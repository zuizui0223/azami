name: Archive split ephemeral artifacts

on:
  push:
    branches:
      - archive/chunk-actions-artifacts-20260903

permissions:
  contents: read
  actions: read

jobs:
  split:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download and verify exhaustive source artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p chunks
          curl --fail --location --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8269246732/zip" \
            -o exhaustive.zip
          echo '5f18b42d18cfcb81691c38ce0f04bcef754e6a67382025ea90110dbc50ae194b  exhaustive.zip' | sha256sum -c -

      - name: Split into Drive-safe byte chunks
        shell: bash
        run: |
          set -euo pipefail
          split -b 45M -d -a 2 exhaustive.zip chunks/exhaustive45.part-
          test "$(find chunks -name 'exhaustive45.part-*' | wc -l)" -eq 20
          cat chunks/exhaustive45.part-* | sha256sum | grep '^5f18b42d18cfcb81691c38ce0f04bcef754e6a67382025ea90110dbc50ae194b '
          sha256sum chunks/exhaustive45.part-* > chunks/exhaustive45-part-sha256.txt
          printf '%s\n' \
            'exhaustive_original_sha256=5f18b42d18cfcb81691c38ce0f04bcef754e6a67382025ea90110dbc50ae194b' \
            'chunk_size=45MiB' \
            'chunk_count=20' > chunks/exhaustive45-reassembly-manifest.txt

      - uses: actions/upload-artifact@v4
        with: {name: exhaustive45-part-00, path: chunks/exhaustive45.part-00, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: exhaustive45-part-01, path: chunks/exhaustive45.part-01, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: exhaustive45-part-02, path: chunks/exhaustive45.part-02, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: exhaustive45-part-03, path: chunks/exhaustive45.part-03, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: exhaustive45-part-04, path: chunks/exhaustive45.part-04, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: exhaustive45-part-05, path: chunks/exhaustive45.part-05, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: exhaustive45-part-06, path: chunks/exhaustive45.part-06, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: exhaustive45-part-07, path: chunks/exhaustive45.part-07, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: exhaustive45-part-08, path: chunks/exhaustive45.part-08, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: exhaustive45-part-09, path: chunks/exhaustive45.part-09, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: exhaustive45-part-10, path: chunks/exhaustive45.part-10, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: exhaustive45-part-11, path: chunks/exhaustive45.part-11, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: exhaustive45-part-12, path: chunks/exhaustive45.part-12, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: exhaustive45-part-13, path: chunks/exhaustive45.part-13, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: exhaustive45-part-14, path: chunks/exhaustive45.part-14, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: exhaustive45-part-15, path: chunks/exhaustive45.part-15, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: exhaustive45-part-16, path: chunks/exhaustive45.part-16, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: exhaustive45-part-17, path: chunks/exhaustive45.part-17, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: exhaustive45-part-18, path: chunks/exhaustive45.part-18, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: exhaustive45-part-19, path: chunks/exhaustive45.part-19, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with:
          name: exhaustive45-reassembly-manifest
          path: |
            chunks/exhaustive45-part-sha256.txt
            chunks/exhaustive45-reassembly-manifest.txt
          compression-level: 0
