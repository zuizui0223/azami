name: Export Chapter 1 EAzami trait handoff

on:
  pull_request:
    paths:
      - "analysis/export_eazami_trait_handoff.py"
      - "tests/test_export_eazami_trait_handoff.py"
      - ".github/workflows/ch1-export-eazami-trait-handoff.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      SOURCE_ARTIFACT_ID: "8226070460"
      SOURCE_ARTIFACT_DIGEST: "sha256:398561508a534ca8108412dbc0944d82b1a54f8007b643e53e16aa8edf9eead9"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal dependency
        run: python -m pip install pandas

      - name: Compile and test exporter
        run: |
          python -m py_compile analysis/export_eazami_trait_handoff.py
          python -m unittest tests/test_export_eazami_trait_handoff.py -v

      - name: Download frozen integrated Chapter 1 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            --output source/ch1_integrated.zip
          unzip -tq source/ch1_integrated.zip
          unzip -q source/ch1_integrated.zip -d source/extracted
          sha256sum source/ch1_integrated.zip | tee source/artifact_zip_sha256.txt

      - name: Resolve species table
        run: |
          set -euo pipefail
          mapfile -t files < <(find source/extracted -type f -name integrated_primary_auxiliary_species.csv | sort)
          test "${#files[@]}" -eq 1
          echo "SPECIES_TABLE=${files[0]}" >> "$GITHUB_ENV"

      - name: Export EAzami handoff
        run: |
          python analysis/export_eazami_trait_handoff.py \
            --species-table "$SPECIES_TABLE" \
            --out-dir handoff \
            --source-artifact-id "$SOURCE_ARTIFACT_ID" \
            --source-artifact-digest "$SOURCE_ARTIFACT_DIGEST"

      - name: Validate frozen dimensions and semantics
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path

          table = pd.read_csv("handoff/azami_ch1_eazami_trait_handoff_v1.csv")
          summary = json.loads(Path("handoff/azami_ch1_eazami_trait_handoff_v1.json").read_text())
          if len(table) != 216 or summary["n_taxa"] != 216:
              raise SystemExit("Expected 216 Chapter 1 taxa")
          if summary["n_taxa_with_auxiliary_involucre_spine"] != 210:
              raise SystemExit("Expected 210 taxa with auxiliary involucre/spine coverage")
          if table["taxon_name"].duplicated().any():
              raise SystemExit("Duplicate taxon in handoff")
          if not table["phylogeny_status"].eq("unassigned_downstream_EAzami_crosswalk_required").all():
              raise SystemExit("Exporter must not preassign phylogenetic placements")
          if not table["involucre_spine_proxy_status"].eq("image_geometry_proxy_not_direct_botanical_state").all():
              raise SystemExit("Auxiliary image proxies lost semantic boundary")
          print(summary)
          PY

      - name: Record source artifact checksum
        run: cp source/artifact_zip_sha256.txt handoff/source_artifact_zip_sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: azami-ch1-eazami-trait-handoff-${{ github.run_id }}
          path: handoff
          if-no-files-found: error
          retention-days: 90
