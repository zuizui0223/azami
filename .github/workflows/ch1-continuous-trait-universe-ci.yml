name: Ch1 continuous trait universe CI

on:
  pull_request:
    paths:
      - 'ch1_global/v2/87_validate_continuous_trait_contract.py'
      - 'ch1_global/v2/88_build_continuous_trait_universe.py'
      - 'ch1_global/v2/89_measure_extended_continuous_traits.py'
      - 'ch1_global/v2/90_run_continuous_trait_universe_climate.py'
      - 'ch1_global/v2/91_prepare_exhaustive_extended_cohort.py'
      - 'ch1_global/v2/92_sample_chelsa_for_continuous_universe.py'
      - 'ch1_global/v2/ontology/ch1_continuous_trait_contract.csv'
      - 'tests/test_ch1_continuous_trait_universe.py'
      - '.github/workflows/ch1-continuous-trait-universe*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ch1_global/v2/requirements-submission.txt
      - name: Install continuous-trait dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ch1_global/v2/requirements-submission.txt 'rasterio>=1.3,<2' 'pyproj>=3.6,<4'
          python -m pip check
      - name: Compile category-free trait modules
        run: |
          python -m py_compile \
            ch1_global/v2/87_validate_continuous_trait_contract.py \
            ch1_global/v2/88_build_continuous_trait_universe.py \
            ch1_global/v2/89_measure_extended_continuous_traits.py \
            ch1_global/v2/90_run_continuous_trait_universe_climate.py \
            ch1_global/v2/91_prepare_exhaustive_extended_cohort.py \
            ch1_global/v2/92_sample_chelsa_for_continuous_universe.py
      - name: Run contract, selection, measurement, and model tests
        run: python -m unittest -v tests/test_ch1_continuous_trait_universe.py
      - name: Validate frozen measurement contract
        run: |
          python ch1_global/v2/87_validate_continuous_trait_contract.py \
            --contract ch1_global/v2/ontology/ch1_continuous_trait_contract.csv \
            --out /tmp/continuous_trait_contract_validation.json
