name: V4 T2 all244 S1 precipitation gradients by real EAzami nuclear coverage
on:
  push:
    branches: [codex/v4-native-integration-workflow]
    paths:
      - 'analysis/v4/t2_all244_nuclear_coverage_ecological_gradient.py'
      - 'tests/test_v4_t2_all244_nuclear_coverage_ecological_gradient.py'
      - '.github/workflows/v4-t2-all244-nuclear-coverage-rain-gradient.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  ecological-pattern-in-full-taxon-census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: .
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal inference environment
        run: python -m pip install 'numpy>=1.26,<3' 'pytest>=8,<10'
      - name: Test original 244 source identities, five climates and noncausal contrasts
        run: python -m pytest -q tests/test_v4_t2_all244_nuclear_coverage_ecological_gradient.py
      - name: Reuse the exact native full244 and EAzami294 113 taxa run-verified bridge
        run: |
          set -euo pipefail
          mkdir -p work/t2-ecology/input work/t2-ecology/bridge work/t2-ecology/out
          test "$(gh api repos/zuizui0223/azami/actions/artifacts/12399694421 --jq '.digest')" = "sha256:902264668bfea47358fdc66bb85ef543f9be29f5a67266d4d1e248d14db146d1"
          test "$(gh api repos/zuizui0223/azami/actions/artifacts/12402464126 --jq '.digest')" = "sha256:3c185e535ecddf80ae18c2d1feee67cfc8c537f6618950eecfe92c1d939b9716"
          gh run download 39718386338 --repo zuizui0223/azami --name v4-t2-full-S1-244-all-species-public-taxonomic-census --dir work/t2-ecology/input
          gh run download 39726717449 --repo zuizui0223/azami --name v4-t2-all244-EAzami294-exact-sample-bridge --dir work/t2-ecology/bridge
          echo "d32e58258a8f98e6e1210ef1733b23402b1bad7277cd6a552148325c40fce021  work/t2-ecology/input/S1_ALL_244_ACCEPTED_TAXON_CENSUS.csv" | sha256sum -c -
      - name: Test BIO12-EXIF angle slopes in all244 and collision-free237 cohorts
        run: |
          python -m analysis.v4.t2_all244_nuclear_coverage_ecological_gradient \
            --s1-census work/t2-ecology/input/S1_ALL_244_ACCEPTED_TAXON_CENSUS.csv \
            --eazami-bridge work/t2-ecology/bridge/T2_ALL244_TO_EAzami294_TAXON_COVERAGE.csv \
            --output work/t2-ecology/out/T2_ALL244_NUCLEAR_COVERAGE_BIO12_GRADIENTS.json
      - name: Confirm effects are reported as observational source-coverage contrasts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('work/t2-ecology/out/T2_ALL244_NUCLEAR_COVERAGE_BIO12_GRADIENTS.json').read_text())
          assert r['total_original_photo_taxa']==244 and r['total_original_photos']==170066
          assert r['primary_clean_taxa']==237 and r['matched_SRA_name_candidate_taxa']==113
          for key,n in [('all244_sensitivity',244),('clean237_primary',237)]:
              for response in ('S1_mean_EXIF_angle_deg','S1_median_EXIF_angle_deg'):
                  p=r['panels'][key][response]
                  assert p['n_taxa']==n and p['source_matched_taxa']==113
                  assert not p['adaptation_or_independent_trait_origins_inferred']
                  assert p['not_geographically_or_phylogenetically_adjusted']
                  assert len(p['annual_precipitation_slopes'])==3
          print('PASS empirical 244 and 237 taxon BIO12 gradients, 113 public nuclear candidate source strata, HC3 limits retained')
          PY
      - name: Save actual full-cohort quantitative ecology only
        uses: actions/upload-artifact@v4
        with:
          name: v4-t2-S1-all244-113nuclear-coverage-precipitation-gradient
          path: work/t2-ecology/out/
          if-no-files-found: error
          retention-days: 90
