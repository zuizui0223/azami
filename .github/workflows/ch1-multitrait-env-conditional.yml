name: Chapter 1 multitrait conditional climate sensitivity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'analysis/v3/run_multitrait_environment_conditional.py'
      - 'tests/test_multitrait_environment_conditional.py'
      - '.github/workflows/ch1-multitrait-env-conditional.yml'

permissions:
  contents: read
  actions: read

jobs:
  residual-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install current numerical runtime
        run: python -m pip install -r reproducibility/requirements-current.txt

      - name: Compile and test
        run: |
          python -m py_compile analysis/v3/run_multitrait_environment_conditional.py
          python -m unittest discover -s tests -p 'test_multitrait_environment_conditional.py' -v

      - name: Verify and recover frozen processed inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/multitrait/input
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/9612943217/zip" > work/multitrait/continuous.zip
          echo '101e996b638996a0c5ae79d358bf51293c3585f0e84c4a961b91dcbedf96211e  work/multitrait/continuous.zip' | sha256sum -c -
          unzip -q work/multitrait/continuous.zip 'universe/continuous_trait_universe_observation_long.csv' -d work/multitrait/input
          echo 'd775794f2bce2dfd0c1f63c5c8e01778c518f6eeb327bf0d9944045143a02344  work/multitrait/input/universe/continuous_trait_universe_observation_long.csv' | sha256sum -c -

          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/9633419268/zip" > work/multitrait/environment.zip
          echo 'd7c0c466f55b67695d06ae46c21a6452dbe6cfd92a52db8042caa200429e97f4  work/multitrait/environment.zip' | sha256sum -c -
          unzip -q work/multitrait/environment.zip 'process_environment/strict_spatial_chelsa_process.csv' -d work/multitrait/input
          echo 'f86a3418e9b21453026bba1aaf350b061f03048949547e2092602620af98cbf6  work/multitrait/input/process_environment/strict_spatial_chelsa_process.csv' | sha256sum -c -

      - name: Climate-adjusted within and among taxon multitrait RV
        run: |
          python -m analysis.v3.run_multitrait_environment_conditional \
            --traits work/multitrait/input/universe/continuous_trait_universe_observation_long.csv \
            --environment work/multitrait/input/process_environment/strict_spatial_chelsa_process.csv \
            --reference-pairs reproducibility/current_reference/upgrade/complete18_construct_pairwise.csv \
            --out-dir work/multitrait/results \
            --environment-pcs 3 \
            --matched-replicates 500 \
            --seed 20261024 | tee work/multitrait/report.log
          test -s work/multitrait/results/multitrait_conditional_report.json
          test -s work/multitrait/results/multitrait_pairwise_conditional.csv
          python -m json.tool work/multitrait/results/multitrait_conditional_report.json >/dev/null

      - name: Upload post-hoc numerical results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch1-multitrait-climate-conditional-${{ github.run_id }}
          path: |
            work/multitrait/results/*
            work/multitrait/report.log
          if-no-files-found: warn
          retention-days: 30
