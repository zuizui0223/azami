name: V4 original S1 observer-disjoint geographic photo-trait signal audit
on:
  pull_request:
    paths:
      - 'analysis/v4/rf_photographic_observer_disjoint_reliability.py'
      - 'tests/test_v4_rf_photographic_observer_disjoint_reliability.py'
      - 'analysis/v4/RF_PHOTO_OBSERVER_DISJOINT_RELIABILITY_JA.md'
      - '.github/workflows/v4-s1-photo-observer-split-half.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: azami-observer-split-half-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  original-S1-observer-authenticated-split-half:
    if: >-
      github.repository == 'zuizui0223/azami' &&
      github.event.pull_request.number == 168 &&
      github.event.pull_request.head.repo.full_name == 'zuizui0223/azami' &&
      github.event.pull_request.head.ref == 'analysis/v4-photo-split-half-reliability-20261031' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: .
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install strict original-observer/S1 archive reader and numeric dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scipy>=1.11,<2' \
            'statsmodels>=0.14,<1' 'cryptography>=46,<49' pytest
      - name: Verify global-user exclusivity, original photo source grain and hue logic using synthetic records
        run: |
          python -m pytest -q tests/test_v4_rf_photographic_split_half_reliability.py \
            tests/test_v4_rf_photographic_observer_disjoint_reliability.py
          python -m py_compile analysis/v4/rf_photographic_observer_disjoint_reliability.py
      - name: Restore exact original S1 and immutable original photographer metadata privately
        env:
          AZAMI_METADATA_KEY: ${{ secrets.AZAMI_METADATA_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AZAMI_METADATA_KEY:-}" ]; then
            echo 'S1_ORIGINAL_METADATA_KEY_UNAVAILABLE' >&2
            exit 7
          fi
          mkdir -p work/s1-obs-half/private work/s1-obs-half/receipt work/s1-obs-half/public
          gh run download 39408603488 --repo zuizui0223/azami \
            --name v4-native-observation-input-encrypted \
            --dir work/s1-obs-half/private
          gh run download 39408603488 --repo zuizui0223/azami \
            --name v4-all665115-native-climate-aggregate \
            --dir work/s1-obs-half/receipt
          gh api -H 'Accept: application/octet-stream' \
            repos/zuizui0223/azami/releases/assets/658986481 \
            > work/s1-obs-half/private/original-metadata.aesgcm
          echo 'dfa98fa162a8029cb6477adf4c26ffc5819cc916a0513d32da14d78d845ab4b0  work/s1-obs-half/private/original-metadata.aesgcm' | sha256sum -c -
          python - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          root=Path('work/s1-obs-half')
          raw=(root/'receipt/measurement_receipt.json').read_bytes()
          if hashlib.sha256(raw).hexdigest()!='246a5ea9643617c6dc766e0b8d27a444a5496afe150d7768032740cf6a53f0a6':
              raise SystemExit('S1_ORIGINAL_RECEIPT_SHA_CHANGED')
          receipt=json.loads(raw)
          sealed=(root/'private/native-observation-measurements.csv.gz.aesgcm').read_bytes()
          if hashlib.sha256(sealed).hexdigest()!=receipt['encrypted_table_sha256']:
              raise SystemExit('S1_ORIGINAL_SOURCE_SHA_CHANGED')
          try:
              plain=AESGCM(bytes.fromhex(os.environ['AZAMI_METADATA_KEY'])).decrypt(
                  sealed[:12],sealed[12:],receipt['encrypted_table_aad'].encode())
          except Exception:
              raise SystemExit('S1_ORIGINAL_AES_GCM_AUTHENTICATION_FAILED') from None
          if hashlib.sha256(plain).hexdigest()!=receipt['prepared_table_sha256']:
              raise SystemExit('S1_ORIGINAL_PLAINTEXT_SHA_CHANGED')
          (root/'private/s1-original.csv.gz').write_bytes(plain)
          print('Authenticated exact S1 and observer source bytes; no original human IDs printed',flush=True)
          PY
          python -m analysis.v4.decode_environment \
            --table work/s1-obs-half/private/s1-original.csv.gz \
            --receipt work/s1-obs-half/receipt/measurement_receipt.json \
            --metadata analysis/v4/environment_source_metadata.json \
            --output work/s1-obs-half/private/decoded
      - name: Evaluate eight photographed traits under globally disjoint original photographers at 1 and 5 degrees
        env:
          AZAMI_METADATA_KEY: ${{ secrets.AZAMI_METADATA_KEY }}
        run: |
          set -euo pipefail
          python -m analysis.v4.rf_photographic_observer_disjoint_reliability \
            --native work/s1-obs-half/private/decoded/observations.csv.gz \
            --receipt work/s1-obs-half/private/decoded/measurement_receipt.json \
            --sealed-metadata work/s1-obs-half/private/original-metadata.aesgcm \
            --output work/s1-obs-half/public/original_s1_8photo_traits_observer_disjoint_split_half_aggregate.json
          python - <<'PY'
          import json
          from pathlib import Path
          f=Path('work/s1-obs-half/public/original_s1_8photo_traits_observer_disjoint_split_half_aggregate.json')
          data=json.loads(f.read_text())
          assert data['schema']=='azami_original_S1_disjoint_observer_8photo_traits_1deg_5deg_v1'
          assert data['n_original_s1_observations']==313350
          assert data['n_original_distinct_observers']==92839
          assert len(data['results'])==16
          assert data['original_frozen_GEB_S1_S2_H3c_and_pr167_RF_untouched']
          assert data['private_photos_locations_users_and_taxon_ids_not_exported']
          assert all(r['status'] in ('estimated_observer_disjoint_spatial_photo_QC_not_RF',
                         'insufficient_original_photo_cell_support',
                         'insufficient_geographical_observer_independent_replication') for r in data['results'])
          forbidden={'obs_id','taxon','accepted_key','taxon_name','user_id','observer_id','photographer_id',
                     'photo_id','latitude','longitude','individual_prediction','individual_photo'}
          def audit(node):
              if isinstance(node,dict):
                  for k,v in node.items():
                      if k in forbidden:raise ValueError('PRIVATE_OBSERVER_OUTPUT_KEY_'+k)
                      audit(v)
              elif isinstance(node,list):
                  for x in node:audit(x)
          audit(data)
          print({'source_original_n':313350,'source_observer_n':92839,'registered_summary_rows':len(data['results']),
                 'eligible_signal_summaries':sum(x['status']=='estimated_observer_disjoint_spatial_photo_QC_not_RF' for x in data['results'])},flush=True)
          PY
      - name: Publish only anonymous total support and split-half geographical summaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: azami-v4-original-S1-observer-disjoint-photo-half-${{ github.run_id }}
          path: work/s1-obs-half/public/original_s1_8photo_traits_observer_disjoint_split_half_aggregate.json
          retention-days: 90
          if-no-files-found: error
      - name: Always purge original observer IDs, S1 source photographs and decrypted metadata
        if: always()
        run: rm -rf work/s1-obs-half/private work/s1-obs-half/receipt