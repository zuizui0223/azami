name: V4 RF CHELSA BIO21 original-source exploratory test
on:
  pull_request:
    paths:
      - 'analysis/v4/rf_bio21_source_real.py'
      - 'analysis/v4/rf_extended_environment.py'
      - 'tests/test_v4_rf_bio21_source_real.py'
      - 'tests/test_v4_rf_holdout_sensitivity.py'
      - '.github/workflows/v4-rf-bio21-source.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: azami-rf-bio21-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-verified-chelsa-bio21:
    # Secrets and original S1 may never run in a fork or an unrelated PR.
    if: >-
      github.repository == 'zuizui0223/azami' &&
      github.event.pull_request.number == 167 &&
      github.event.pull_request.head.repo.full_name == 'zuizui0223/azami' &&
      github.event.pull_request.head.ref == 'analysis/v4-rf-multitrait-exploratory-20261031'
    runs-on: ubuntu-latest
    timeout-minutes: 115
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: .
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numeric, raster and encrypted-source dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scipy>=1.11,<2' \
            'statsmodels>=0.14,<1' 'scikit-learn>=1.4,<2' \
            'rasterio>=1.3,<2' 'requests>=2.31,<3' 'cryptography>=46,<49' pytest
      - name: Test original-source gate and protected raster runner on synthetic data
        run: |
          python -m pytest -q tests/test_v4_rf_bio21_source_real.py \
            tests/test_v4_rf_holdout_sensitivity.py \
            tests/test_v4_rf_extended_environment.py \
            tests/test_v4_rf_extended_raster_sampler.py \
            tests/test_v4_rf_multitrait_predictability.py
          python -m py_compile analysis/v4/rf_bio21_source_real.py
      - name: Recover exact 313350-row confidential S1 from authenticated encrypted artifact
        env:
          AZAMI_METADATA_KEY: ${{ secrets.AZAMI_METADATA_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AZAMI_METADATA_KEY:-}" ]; then
            echo 'S1_METADATA_KEY_UNAVAILABLE_IN_AUTHORISED_WORKFLOW' >&2
            exit 7
          fi
          mkdir -p work/rf21/private work/rf21/receipt work/rf21/public work/rf21/temp
          gh run download 39408603488 --repo zuizui0223/azami \
            --name v4-native-observation-input-encrypted --dir work/rf21/private
          gh run download 39408603488 --repo zuizui0223/azami \
            --name v4-all665115-native-climate-aggregate --dir work/rf21/receipt
          python - <<'PY'
          import os, json, hashlib
          from pathlib import Path
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          root=Path('work/rf21')
          raw=(root/'receipt/measurement_receipt.json').read_bytes()
          if hashlib.sha256(raw).hexdigest() != '246a5ea9643617c6dc766e0b8d27a444a5496afe150d7768032740cf6a53f0a6':
              raise SystemExit('S1_RECEIPT_SHA_MISMATCH')
          receipt=json.loads(raw)
          sealed=(root/'private/native-observation-measurements.csv.gz.aesgcm').read_bytes()
          if hashlib.sha256(sealed).hexdigest()!=receipt['encrypted_table_sha256']:
              raise SystemExit('ENCRYPTED_S1_ARCHIVE_SHA_MISMATCH')
          try:
              clear=AESGCM(bytes.fromhex(os.environ['AZAMI_METADATA_KEY'])).decrypt(
                  sealed[:12], sealed[12:], receipt['encrypted_table_aad'].encode())
          except Exception:
              raise SystemExit('S1_SOURCE_AUTHENTICATION_FAILED') from None
          if hashlib.sha256(clear).hexdigest()!=receipt['prepared_table_sha256']:
              raise SystemExit('S1_ORIGINAL_DECRYPTED_BYTES_MISMATCH')
          (root/'private/s1-original.csv.gz').write_bytes(clear)
          print('SHA/AESGCM original S1 verified (no source rows logged)',flush=True)
          PY
          python -m analysis.v4.decode_environment \
            --table work/rf21/private/s1-original.csv.gz \
            --receipt work/rf21/receipt/measurement_receipt.json \
            --metadata analysis/v4/environment_source_metadata.json \
            --output work/rf21/private/decoded
      - name: Download and sample the 16 source-true raster variables sequentially
        run: |
          set -euo pipefail
          python -m analysis.v4.rf_bio21_source_real \
            --native work/rf21/private/decoded/observations.csv.gz \
            --decoded-receipt work/rf21/private/decoded/measurement_receipt.json \
            --private-dir work/rf21/private/environment \
            --public-dir work/rf21/public \
            --temporary work/rf21/temp
      - name: Source-real RF 12 versus 21, matching photo rows within paired groups
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('work/rf21/public/bio21_source_receipt.json')
          receipt=json.loads(r.read_text())
          assert receipt['source_observations']==313350
          assert len(receipt['source_variables'])==16
          for variable in receipt['source_variables']:
              assert receipt['source_variables'][variable]['coverage']>=.75
          PY
          python -m analysis.v4.rf_extended_environment \
            --upper-tier complete_bioclim21 \
            --native-table work/rf21/private/decoded/observations.csv.gz \
            --native-receipt work/rf21/private/decoded/measurement_receipt.json \
            --archived-seven-table work/rf21/private/environment/original_seven.csv.gz \
            --archived-seven-sha256 "$(python -c 'import json;print(json.load(open("work/rf21/public/bio21_source_receipt.json"))["original_seven_private_table_sha256"])')" \
            --extra32-table work/rf21/private/environment/chelsa_extra_nine.csv.gz \
            --extra32-sha256 "$(python -c 'import json;print(json.load(open("work/rf21/public/bio21_source_receipt.json"))["extra_nine_private_table_sha256"])')" \
            --layer-manifest work/rf21/private/environment/chelsa_nine_manifest.json \
            --output work/rf21/public/rf_12_vs_21_anchor3_aggregate.json \
            --constructs angle,chroma,aspect --trees 80 --permutation-repeats 3
          # Complete all eight registered constructs without changing the
          # three original 2026-10-31 anchor estimates or Holm paper.
          python -m analysis.v4.rf_extended_environment \
            --upper-tier complete_bioclim21 \
            --native-table work/rf21/private/decoded/observations.csv.gz \
            --native-receipt work/rf21/private/decoded/measurement_receipt.json \
            --archived-seven-table work/rf21/private/environment/original_seven.csv.gz \
            --archived-seven-sha256 "$(python -c 'import json;print(json.load(open("work/rf21/public/bio21_source_receipt.json"))["original_seven_private_table_sha256"])')" \
            --extra32-table work/rf21/private/environment/chelsa_extra_nine.csv.gz \
            --extra32-sha256 "$(python -c 'import json;print(json.load(open("work/rf21/public/bio21_source_receipt.json"))["extra_nine_private_table_sha256"])')" \
            --layer-manifest work/rf21/private/environment/chelsa_nine_manifest.json \
            --output work/rf21/public/rf_12_vs_21_full8_aggregate.json \
            --trees 80 --permutation-repeats 3
          # Explicit posthoc sensitivity: relaxed photo/cell support + equal
          # numbers of taxa per group holdout fold; original output untouched.
          python -m analysis.v4.rf_extended_environment \
            --upper-tier complete_bioclim21 \
            --native-table work/rf21/private/decoded/observations.csv.gz \
            --native-receipt work/rf21/private/decoded/measurement_receipt.json \
            --archived-seven-table work/rf21/private/environment/original_seven.csv.gz \
            --archived-seven-sha256 "$(python -c 'import json;print(json.load(open("work/rf21/public/bio21_source_receipt.json"))["original_seven_private_table_sha256"])')" \
            --extra32-table work/rf21/private/environment/chelsa_extra_nine.csv.gz \
            --extra32-sha256 "$(python -c 'import json;print(json.load(open("work/rf21/public/bio21_source_receipt.json"))["extra_nine_private_table_sha256"])')" \
            --layer-manifest work/rf21/private/environment/chelsa_nine_manifest.json \
            --output work/rf21/public/rf_12_vs_21_posthoc_balanced_support_aggregate.json \
            --constructs angle,chroma,aspect --min-per-cell 1 \
            --splits unseen_taxa_balanced,unseen_longitude_sectors \
            --trees 80 --permutation-repeats 3
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('work/rf21/public/rf_12_vs_21_anchor3_aggregate.json')
          data=json.loads(path.read_text())
          assert data['original_S1_S2_Holm_and_H3c_unmodified'] is True
          assert set(data['requested_constructs'])=={'angle','chroma','aspect'}
          assert data['original_source']['s1_observations']==313350
          def all_keys(v):
              if isinstance(v,dict):
                  for k,x in v.items():
                      yield k; yield from all_keys(x)
              elif isinstance(v,list):
                  for x in v: yield from all_keys(x)
          assert not set(all_keys(data)) & {'obs_id','accepted_key','taxon_name',
              'photo_id','user_id','latitude','longitude','photographer_id'}
          print('Aggregates checked: traits=', len(data['requested_constructs']),
                'grouped_holdout_results=',len(data['results']),flush=True)
          full=json.loads(Path('work/rf21/public/rf_12_vs_21_full8_aggregate.json').read_text())
          sensitivity=json.loads(Path('work/rf21/public/rf_12_vs_21_posthoc_balanced_support_aggregate.json').read_text())
          assert len(full['requested_constructs'])==8 and not full['posthoc_support_or_folding_sensitivity']
          assert full['minimum_source_photos_per_taxon_cell']==3
          assert sensitivity['requested_constructs']==['angle','chroma','aspect']
          assert sensitivity['posthoc_support_or_folding_sensitivity']
          assert sensitivity['minimum_source_photos_per_taxon_cell']==1
          assert sensitivity['split_schemes']==['unseen_taxa_balanced','unseen_longitude_sectors']
          for report in (full, sensitivity):
              assert report['original_S1_S2_Holm_and_H3c_unmodified']
              assert not set(all_keys(report)) & {'obs_id','accepted_key','taxon_name',
                  'photo_id','user_id','latitude','longitude','photographer_id'}
          PY
      - name: Upload ONLY aggregated climate source hashes/coverage and RF test summaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: azami-v4-rf-bio21-source-real-${{ github.run_id }}
          path: |
            work/rf21/public/bio21_source_receipt.json
            work/rf21/public/rf_12_vs_21_anchor3_aggregate.json
            work/rf21/public/rf_12_vs_21_full8_aggregate.json
            work/rf21/public/rf_12_vs_21_posthoc_balanced_support_aggregate.json
          if-no-files-found: error
          retention-days: 90
      - name: Always securely remove decrypted S1 and any raster/intermediate input
        if: always()
        run: rm -rf work/rf21/private work/rf21/receipt work/rf21/temp