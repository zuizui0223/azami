name: V4 T2 census-wide BM OU WN and independent nuclear comparisons
on:
  push:
    branches: [codex/v4-native-integration-workflow]
    paths:
      - 'analysis/v4/t2_full_species_bm_ou.py'
      - 'tests/test_v4_t2_full_species_bm_ou.py'
      - '.github/workflows/v4-t2-full-species-bm-ou.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: v4-t2-census-wide-bm-ou-${{ github.sha }}
  cancel-in-progress: false
jobs:
  all-source-backed-available-taxa:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install current frozen scientific dependencies
        run: python -m pip install -r reproducibility/requirements-current.txt pytest
      - name: Validate gaussian model nesting and identity guards
        run: python -m pytest -q tests/test_v4_t2_full_species_bm_ou.py
      - name: Recover and verify frozen real S1 measured all-194 cohort and exact public T2 join
        run: |
          set -euo pipefail
          mkdir -p work/t2-full/input/s1 work/t2-full/input/joint work/t2-full/output
          test "$(gh api repos/zuizui0223/azami/actions/artifacts/12343166776 --jq '.digest')" = "sha256:345617fd8fef6bdb41a06a1a03fa8a776c5ad48ba13c2aa971deb1e929cbf8cb"
          gh run download 39594257539 --repo zuizui0223/azami \
            --name v4-s1-continuous-194-taxa-52-placement-history \
            --dir work/t2-full/input/s1
          test -s work/t2-full/input/s1/S1_CONTINUOUS_194_52_TREE_HISTORY.json
          test "$(gh api repos/zuizui0223/azami/actions/artifacts/12339413151 --jq '.digest')" = "sha256:aa5a9ac298b8e36c9e96da6f1eb96319733136e2e3a105305092f7da2ca97bff"
          gh run download 39584744194 --repo zuizui0223/azami \
            --name v4-joint-s1-t2-exact-cohort-public-aggregate \
            --dir work/t2-full/input/joint
          test -s work/t2-full/input/joint/S1_T2_joint_244_194.json
      - name: Fit all eligible S1 tips on all 52 placements plus independent NA63 and exact S1 NA42 nuclear cohorts
        run: |
          python -m analysis.v4.t2_full_species_bm_ou \
            --source work/t2-full/input/s1/S1_CONTINUOUS_194_52_TREE_HISTORY.json \
            --joint work/t2-full/input/joint/S1_T2_joint_244_194.json \
            --output work/t2-full/output/T2_ALL_SOURCE_MATCHED_S1_NA63_NA42_BM_OU_WN.json
      - name: Retain source-aware full census results without private image or photographer data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-t2-census-wide-S1-BM-OU-WN-NA63-nuclear
          path: work/t2-full/output/
          if-no-files-found: warn
          retention-days: 90
