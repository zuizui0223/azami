name: V4 all 665115 upstream native climate replay
on:
  pull_request:
    paths:
      - 'analysis/v4/native_665115_pipeline.py'
      - 'tests/test_v4_native_665115_pipeline.py'
      - '.github/workflows/v4-native-665115-replay.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  full-original-source:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'zuizui0223/azami'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native source, geometry and raster numerical dependencies
        run: python -m pip install 'numpy>=2,<3' 'pandas>=2.2,<4' 'shapely>=2,<3' 'rasterio>=1.4,<2' pytest
      - name: Verify full-source synthetic source and climate invariants
        run: python -m pytest -q tests/test_v4_native_665115_pipeline.py tests/test_v4_native_climate_cache.py
      - name: Recover checksum-pinned original 665115 observation source and 350-taxon WCVP evidence
        run: |
          set -euo pipefail
          mkdir -p work/native-665115/private work/native-665115/public work/native-665115/cache
          gh api repos/zuizui0223/azami/actions/artifacts/8066010557/zip > work/native-665115/original-metadata.zip
          echo '2f216652602a0b3c42b64780d9b31a3ecb2e7fc1300b28b303e8c369b31884ae  work/native-665115/original-metadata.zip' | sha256sum -c -
          gh api repos/zuizui0223/azami/actions/artifacts/12244160272/zip > work/native-665115/authority350.zip
          echo 'ec0e3b67c2fb81d4d1dd8a9215585e4523abcbf8085959854ec80dc826a56ca1  work/native-665115/authority350.zip' | sha256sum -c -
          unzip -p work/native-665115/authority350.zip native_sources_350.json > work/native-665115/authority350.json
          echo 'a5bf23efffbf8e8f9459d5c3391a0136adcedd8f9dbff0117caa969ab545c2bd  work/native-665115/authority350.json' | sha256sum -c -
      - name: Native-first classify EVERY original observation before phenotype selection
        run: |
          python -m analysis.v4.native_665115_pipeline classify \
            --metadata-zip work/native-665115/original-metadata.zip \
            --authority-json work/native-665115/authority350.json \
            --private-dir work/native-665115/private
      - name: Restore all nine original-pixel CHELSA native caches (no raster re-download)
        run: |
          set -euo pipefail
          while read -r variable id checksum; do
            target="work/native-665115/cache/$variable"
            mkdir -p "$target"
            gh api "repos/zuizui0223/azami/actions/artifacts/$id/zip" > "work/native-665115/cache-$variable.zip"
            echo "$checksum  work/native-665115/cache-$variable.zip" | sha256sum -c -
            unzip -q "work/native-665115/cache-$variable.zip" -d "$target"
            rm "work/native-665115/cache-$variable.zip"
          done <<'ARTIFACTS'
          bio01 12243016948 0e3b83ebfb7de1865662cde2c2c2395fa7737460996e66354f87391f8f0867ab
          bio04 12241949860 dac232683b2a72b9c4f62eab0f341be7927e5e3287a29dbf3a162b893c2307e3
          bio12 12242703088 71e7edeb0d4c0042e973ed97672a1593bef98a608c917792006e22722e288ada
          bio15 12242508971 9f255a7c756fc83a5dd81e6c13d8fee63c53698d93bffb65ae13288e4eebb445
          rsds_mean 12242917323 2193bd04b979f6684f7bce7c670074af63072d270a20c4dc2fd0bd5934862df4
          vpd_mean 12242842598 2b92152e2ed33436ea6c242497d2b0e61c34711e958a7f4eb3620d8bf3ad1265
          sfcwind_mean 12243355603 f383fa07776984ff193864fa8d44a3b0baa079b64a798e014b9e364b9b1f67b0
          gsp 12243306531 8259581896660edd7c07667b97640f71f174cab484eeadfe1292588ab8a96e8d
          npp 12242657215 cd6ab1fd63568ced9b6b18fe4e0d36f65ccdf00b2403e7fbcba9ab9578e76c5a
          ARTIFACTS
      - name: Sample all native original observation coordinates at unaltered CHELSA resolution
        run: |
          python -m analysis.v4.native_665115_pipeline sample \
            --native-roster work/native-665115/private/native350_roster.csv.gz \
            --cache-root work/native-665115/cache \
            --private-dir work/native-665115/private
      - name: Validate public aggregate counts and prohibit raw-row artifact export
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('work/native-665115/private')
          a=json.loads((p/'source_receipt.json').read_text())
          b=json.loads((p/'climate_receipt.json').read_text())
          assert (a['source_observations'],a['source_photos'])==(665115,1122854)
          assert (a['queried_species_names'],a['non_species_names_explicitly_unresolved'])==(350,117)
          assert (a['native_observations'],a['native_accepted_taxa'],a['native_photos'])==(313350,306,534186)
          assert (b['native_source_observations'],b['complete_all_nine'],b['missing_any'])==(313350,313240,110)
          assert (b['outside_cached_cells_observations'],b['outside_cached_cells_unique'])==(106,13)
          assert b['five_degree_tiles_are_storage_only'] and not b['nodata_imputed']
          assert a['trait_or_detector_values_used_for_native_selection'] is False
          assert a['private_observation_rows_uploaded_to_public_CI'] is False
          assert b['private_coordinates_uploaded_to_public_CI'] is False
          out=Path('work/native-665115/public')
          for name in ('source_receipt.json','climate_receipt.json'):
              (out/name).write_bytes((p/name).read_bytes())
          assert {q.name for q in out.iterdir()}=={'source_receipt.json','climate_receipt.json'}
          print('PASS 665115 ORIGINAL OBSERVATIONS -> 313350 NATIVE -> 313240 NINE-PREDICTOR OBSERVATIONS')
          PY
      - name: Upload aggregate receipt ONLY — never native observation IDs or coordinates
        uses: actions/upload-artifact@v4
        with:
          name: v4-all665115-native-climate-aggregate
          path: work/native-665115/public/
          retention-days: 30
          if-no-files-found: error
