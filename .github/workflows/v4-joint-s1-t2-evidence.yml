name: V4 one-source S1 T2 phylogeny evidence ledger
on:
  push:
    branches: [codex/v4-native-integration-workflow]
    paths:
      - 'analysis/v4/joint_s1_t2_phylogeny.py'
      - 'analysis/v4/s1_continuous_phylogenetic_history.py'
      - 'tests/test_v4_joint_s1_t2_phylogeny.py'
      - 'tests/test_v4_s1_continuous_phylogenetic_history.py'
      - '.github/workflows/v4-joint-s1-t2-evidence.yml'
  pull_request:
    paths:
      - 'analysis/v4/joint_s1_t2_phylogeny.py'
      - 'analysis/v4/s1_continuous_phylogenetic_history.py'
      - 'tests/test_v4_joint_s1_t2_phylogeny.py'
      - 'tests/test_v4_s1_continuous_phylogenetic_history.py'
      - '.github/workflows/v4-joint-s1-t2-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: v4-joint-s1-t2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  join-without-refit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install -r reproducibility/requirements-current.txt 'cryptography>=46,<49' pytest
      - name: Verify frozen S1 244 versus tree 194 and prohibit photo-to-botanical recoding
        run: python -m pytest -q tests/test_v4_joint_s1_t2_phylogeny.py tests/test_v4_s1_continuous_phylogenetic_history.py
      - name: Restore exact authenticated S1 native observation input
        env:
          AZAMI_METADATA_KEY: ${{ secrets.AZAMI_METADATA_KEY }}
        run: |
          set -euo pipefail
          mkdir -p work/joint-source/private work/joint-source/receipt work/joint-source/output
          gh run download 39408603488 --repo zuizui0223/azami --name v4-native-observation-input-encrypted --dir work/joint-source/private
          gh run download 39408603488 --repo zuizui0223/azami --name v4-all665115-native-climate-aggregate --dir work/joint-source/receipt
          python - <<'PY'
          import os, json, hashlib
          from pathlib import Path
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          root=Path('work/joint-source')
          raw=(root/'receipt/measurement_receipt.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='246a5ea9643617c6dc766e0b8d27a444a5496afe150d7768032740cf6a53f0a6'
          receipt=json.loads(raw)
          sealed=(root/'private/native-observation-measurements.csv.gz.aesgcm').read_bytes()
          assert hashlib.sha256(sealed).hexdigest()==receipt['encrypted_table_sha256']
          try:
              data=AESGCM(bytes.fromhex(os.environ['AZAMI_METADATA_KEY'])).decrypt(
                  sealed[:12],sealed[12:],receipt['encrypted_table_aad'].encode())
          except Exception:
              raise SystemExit('Private observation input authentication failed') from None
          assert hashlib.sha256(data).hexdigest()==receipt['prepared_table_sha256']
          (root/'private/observations.csv.gz').write_bytes(data)
          PY
      - name: Decode original published-environment units
        run: |
          python -m analysis.v4.decode_environment \
            --table work/joint-source/private/observations.csv.gz \
            --receipt work/joint-source/receipt/measurement_receipt.json \
            --metadata analysis/v4/environment_source_metadata.json \
            --output work/joint-source/decoded
      - name: Reuse 244 original S1 taxon identity and five covariates; 46 biological states for validation only
        run: |
          python -m analysis.v4.joint_s1_t2_phylogeny \
            --native-table work/joint-source/decoded/observations.csv.gz \
            --out work/joint-source/output/S1_T2_joint_244_194.json
      - name: Reconstruct all 194 original continuous S1 head angles on 52 frozen phylogenetic placement scenarios
        run: |
          python -m analysis.v4.s1_continuous_phylogenetic_history \
            --table work/joint-source/decoded/observations.csv.gz \
            --out work/joint-source/output/S1_CONTINUOUS_194_52_TREE_HISTORY.json
      - name: Upload only aggregated public taxon coverage, effects and exclusion reasons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-joint-s1-t2-exact-cohort-public-aggregate
          path: work/joint-source/output
          if-no-files-found: warn
          retention-days: 90
