name: V4 T2 original S1 BIO18 wet quarter true nuclear gap audit
on:
  workflow_dispatch:
  push:
    branches: [codex/v4-native-integration-workflow]
    paths:
      - 'analysis/v4/t2_s1_bio18_genuine_nuclear_coverage_gap.py'
      - 'tests/test_v4_t2_s1_bio18_genuine_nuclear_coverage_gap.py'
      - '.github/workflows/v4-t2-s1-bio18-authentic-nuclear-gap.yml'
permissions:
  contents: read
  actions: read
jobs:
  full-original-251-vs-real-NA42-Japan12:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: .
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original S1 photo and authentic nuclear source tools
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'biopython>=1.83,<2' 'pandas>=2.1,<3' pytest
      - name: Verify source and BIO18 top quartile contract
        run: python -m pytest -q tests/test_v4_t2_s1_bio18_genuine_nuclear_coverage_gap.py
      - name: Recover exact source 251 S1 photo angle records and newly measured 4 climatic axes
        run: |
          mkdir -p work/source251 work/new4 work/out
          test "$(gh api repos/zuizui0223/azami/actions/artifacts/12421842342 --jq .digest)" = \
            'sha256:2b3fff23a280341c81c2d9c95fc2b99c55ccd22458b530f3d4b7e3c451ebe57d'
          test "$(gh api repos/zuizui0223/azami/actions/artifacts/12548594169 --jq .digest)" = \
            'sha256:8b19d76a695f3773d54885c637fcf7ed52445f615e9dae8501305a40e05327f5'
          gh run download 39769949628 --repo zuizui0223/azami \
            --name v4-t2-S1-all251-original-source-name-resolved --dir work/source251
          gh run download 40064998009 --repo zuizui0223/azami \
            --name v4-real-original-S1-S2-BIO18-BIO5-RSDS-elevation --dir work/new4
          echo '47b32972b20564ade163907ef6fdf3eb2a69f8b42c8d87b8cf4ea75ca1682dc1  work/source251/S1_ALL_251_SOURCE_NAME_BY_ACCEPTED_KEY_MEASUREMENTS.csv' | sha256sum -c -
          echo '823ecb8442eb03598253cb33f3e16bac86538c6c2652f48ca2dc0886d0e19626  work/new4/S1_ORIGINAL_251_TAXON_MEAN_NEW_BIO18_BIO05_RSDS_ELEVATION.csv' | sha256sum -c -
      - name: Determine which original S1 BIO18 wet species authentic nuclear species tree can actually test
        run: |
          python -m analysis.v4.t2_s1_bio18_genuine_nuclear_coverage_gap \
            --original251 work/source251/S1_ALL_251_SOURCE_NAME_BY_ACCEPTED_KEY_MEASUREMENTS.csv \
            --newfour work/new4/S1_ORIGINAL_251_TAXON_MEAN_NEW_BIO18_BIO05_RSDS_ELEVATION.csv \
            --out work/out/T2_S1_REAL_BIO18_NUCLEAR_WET_QUARTILE_SOURCE_BIAS.json
      - name: Assert no positive nuclear adaptive claim and new four-axis source denominator
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          x=json.loads(Path("work/out/T2_S1_REAL_BIO18_NUCLEAR_WET_QUARTILE_SOURCE_BIAS.json").read_text())
          assert x["S1_original_4axis_photo_observations"]==169020
          assert x["S1_original_global_wettest_quartile_species"]==63
          assert x["distinct_original_species_in_true_nuclear_tree_panels"]==54
          assert x["n_wet_global_species_MISSING_from_two_true_trees"]==55
          assert x["genuine_nuclear_species_tree_panels"]["NA42_genuine_published_nuclear"]["n_global_S1_BIO18_wet_quartile_species"]==0
          assert x["genuine_nuclear_species_tree_panels"]["Japan12_genuine_176_loci_nuclear"]["n_global_S1_BIO18_wet_quartile_species"]==8
          assert x["genuine_nuclear_species_tree_panels"]["Japan12_genuine_176_loci_nuclear"]["n_BIO18_wet_global_species_with_only_1_original_photo"]==4
          assert x["same_trait_S1_continuous_image_axis_0_to_180"]
          assert x["no_flora_U_D_used"] and x["no_plastid_or_ITS_only_or_failed_Q20_genetree_used"]
          print("PASS_SOURCE_CONFIRMED_HIGH_BIO18_NUCLEAR_TIP_SELECTION_MISSING55")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-t2-original-S1-BIO18-missing-wet-true-nuclear-tips
          path: work/out/
          retention-days: 90
          if-no-files-found: warn
