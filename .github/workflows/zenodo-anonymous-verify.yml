name: Zenodo anonymous verification

on:
  pull_request:
    paths:
      - '.github/workflows/zenodo-anonymous-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out frozen reproduction code
        uses: actions/checkout@v4
        with:
          ref: 584af97b050d15701f26ce1facea212d5b648d4d

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Anonymous Zenodo download and SHA verification
        shell: bash
        run: |
          set -euo pipefail
          url='https://zenodo.org/records/22295791/files/azami_ch1_v2_reproduction_inputs_2026-09-04.zip?download=1'
          curl --fail-with-body -L \
            --retry 6 --retry-delay 10 --retry-all-errors \
            --connect-timeout 30 \
            -A 'azami-public-repro-verifier/1.0' \
            -D zenodo_headers.txt \
            -o bundle.zip "$url"

          size="$(stat -c%s bundle.zip)"
          sha="$(sha256sum bundle.zip | awk '{print $1}')"
          echo "ANONYMOUS_DOWNLOAD=PASS"
          echo "BUNDLE_SIZE=$size"
          echo "BUNDLE_SHA256=$sha"
          test "$size" = '56942044'
          test "$sha" = '50ec15b1280d4660839ca4bf0d55c970a5f49b4d4feaabb7a073b73500253677'

          mkdir reproduction_inputs
          unzip -q bundle.zip -d reproduction_inputs
          python reproducibility/verify_local_materials.py \
            --archive-dir reproduction_inputs \
            --scope numerical \
            --report local_material_check.json

          for spec in \
            'artifact-9612943217-continuous.zip 101e996b638996a0c5ae79d358bf51293c3585f0e84c4a961b91dcbedf96211e' \
            'artifact-9632715852-multilevel.zip 51e7a26b5bd09e030b67b9342586699abaaf46e630f45b6bb4ee7bfc9152ced6' \
            'artifact-8227254443-historical.zip 499061e7a49f9455cf8c367fe26e313b7e0e33b2280d2354717e61a90ea8c6bc' \
            'artifact-8983877726-spatial.zip 151161f926dbc92d35832a0bd71622e4f1f3018c9047a7ba8b4ad94926273dca'
          do
            set -- $spec
            observed="$(sha256sum "reproduction_inputs/$1" | awk '{print $1}')"
            echo "INPUT_SHA256 $1 $observed"
            test "$observed" = "$2"
          done

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zenodo-anonymous-verification-evidence
          path: |
            zenodo_headers.txt
            local_material_check.json
          if-no-files-found: ignore
