name: Ch1 main Figure 2 geography CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'analysis/build_main_figure2_geography.py'
      - '.github/workflows/ch1-main-figure2-geography-ci.yml'
      - 'manuscript/FIGURE_TABLE_MAP.md'
      - 'manuscript/FIGURE2_GEOGRAPHY_MANIFEST.md'
      - 'manuscript/supplement/SUPPLEMENTARY_INFORMATION.md'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  figure2-geography-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXHAUSTIVE_RUN_ID: '29216617585'
      EXHAUSTIVE_ARTIFACT: 'ch1-exhaustive-continuous-merged-all_photos_20260711_v1-recovery'
      ENVIRONMENT_RUN_ID: '29306454759'
      ENVIRONMENT_ARTIFACT: 'ch1-exhaustive-enriched-environment-20260713'
      NATURAL_EARTH_URL: 'https://naturalearth.s3.amazonaws.com/50m_cultural/ne_50m_admin_0_countries.zip'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'

      - name: Install pinned plotting dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'matplotlib==3.10.8' 'geopandas==1.0.1' 'pyogrio==0.11.1' 'shapely==2.1.1'

      - name: Download frozen exhaustive merged source
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.EXHAUSTIVE_RUN_ID }}
          name: ${{ env.EXHAUSTIVE_ARTIFACT }}
          path: source/exhaustive

      - name: Download frozen enriched primary environment
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.ENVIRONMENT_RUN_ID }}
          name: ${{ env.ENVIRONMENT_ARTIFACT }}
          path: source/environment

      - name: Resolve frozen cohort files
        shell: bash
        run: |
          set -euo pipefail
          find_one() {
            mapfile -t hits < <(find "$1" -type f -name "$2" | sort)
            test "${#hits[@]}" -eq 1
            printf '%s' "${hits[0]}"
          }
          echo "ALL_DETECTED=$(find_one source/exhaustive all_detected_observations.csv)" >> "$GITHUB_ENV"
          echo "COORDINATE=$(find_one source/exhaustive coordinate_usable_observations.csv)" >> "$GITHUB_ENV"
          echo "STRICT=$(find_one source/exhaustive strict_10km_observations.csv)" >> "$GITHUB_ENV"
          echo "PRIMARY=$(find_one source/exhaustive strict_spatial_thinned_observations.csv)" >> "$GITHUB_ENV"
          echo "ENVIRONMENT=$(find_one source/environment strict_spatial_thinned_with_climate_topography_soil.csv)" >> "$GITHUB_ENV"

      - name: Download Natural Earth map geometry
        run: |
          set -euo pipefail
          mkdir -p source/naturalearth
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 \
            "$NATURAL_EARTH_URL" --output source/naturalearth.zip
          unzip -tq source/naturalearth.zip
          unzip -q source/naturalearth.zip -d source/naturalearth
          test -s source/naturalearth/ne_50m_admin_0_countries.shp
          echo "COUNTRIES=source/naturalearth/ne_50m_admin_0_countries.shp" >> "$GITHUB_ENV"

      - name: Record source provenance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum "$ALL_DETECTED" "$COORDINATE" "$STRICT" "$PRIMARY" "$ENVIRONMENT" > figure2_source_sha256.txt
          printf '%s\n' \
            "exhaustive_run_id=${EXHAUSTIVE_RUN_ID}" \
            "exhaustive_artifact=${EXHAUSTIVE_ARTIFACT}" \
            "environment_run_id=${ENVIRONMENT_RUN_ID}" \
            "environment_artifact=${ENVIRONMENT_ARTIFACT}" \
            > figure2_source_artifacts.txt

      - name: Build main Figure 2 and geographic Supplement figures
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/mplconfig
        run: |
          python analysis/build_main_figure2_geography.py \
            --all-detected "$ALL_DETECTED" \
            --coordinate-usable "$COORDINATE" \
            --strict-10km "$STRICT" \
            --primary "$PRIMARY" \
            --environment "$ENVIRONMENT" \
            --countries "$COUNTRIES" \
            --out-dir figure2-geography-release

      - name: Validate release products
        run: |
          set -euo pipefail
          test "$(find figure2-geography-release -maxdepth 1 -type f | wc -l)" -eq 13
          for stem in \
            Figure_2_geographic_sampling_and_analysis_domain \
            Figure_S6_sampling_geography_across_filters \
            Figure_S7_geographic_trait_assessability; do
            test -s "figure2-geography-release/${stem}.svg"
            test -s "figure2-geography-release/${stem}.png"
            test -s "figure2-geography-release/${stem}.pdf"
          done
          cat figure2-geography-release/figure2_geography_summary.json
          sha256sum figure2-geography-release/* > figure2_release_sha256.txt

      - name: Upload Figure 2 geography release
        uses: actions/upload-artifact@v4
        with:
          name: ch1-main-figure2-geography-${{ github.run_id }}
          path: |
            figure2-geography-release/
            figure2_source_sha256.txt
            figure2_source_artifacts.txt
            figure2_release_sha256.txt
          if-no-files-found: error
          retention-days: 90
