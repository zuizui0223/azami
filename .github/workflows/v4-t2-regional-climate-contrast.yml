name: V4 T2 source-region five-exposure historical sensitivity
on:
  push:
    branches: [codex/v4-native-integration-workflow]
    paths:
      - 'analysis/v4/t2_regional_climate_contrast.py'
      - 'tests/test_v4_t2_regional_climate_contrast.py'
      - '.github/workflows/v4-t2-regional-climate-contrast.yml'
  pull_request:
    paths:
      - 'analysis/v4/t2_regional_climate_contrast.py'
      - 'tests/test_v4_t2_regional_climate_contrast.py'
      - '.github/workflows/v4-t2-regional-climate-contrast.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: v4-t2-regional-climate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regional-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen numerical dependencies
        run: python -m pip install -r reproducibility/requirements-current.txt pytest
      - name: Verify source-blocked climate contrasts and interpretation guards
        run: python -m pytest -q tests/test_v4_t2_regional_climate_contrast.py tests/test_v4_joint_s1_t2_verified_receipt.py
      - name: Verify immutable authenticated S1-T2 source artifact and retrieve taxon centroids
        run: |
          set -euo pipefail
          mkdir -p work/t2-regional/joint work/t2-regional/result
          digest="$(gh api repos/zuizui0223/azami/actions/artifacts/12339413151 --jq '.digest')"
          test "$digest" = "sha256:aa5a9ac298b8e36c9e96da6f1eb96319733136e2e3a105305092f7da2ca97bff"
          gh run download 39584744194 --repo zuizui0223/azami \
            --name v4-joint-s1-t2-exact-cohort-public-aggregate \
            --dir work/t2-regional/joint
          test -s work/t2-regional/joint/S1_T2_joint_244_194.json
      - name: Same frozen five S1 variables and 46 original botanical states
        run: |
          python -m analysis.v4.t2_regional_climate_contrast \
            --joint work/t2-regional/joint/S1_T2_joint_244_194.json \
            --output work/t2-regional/result/regional_five_climate.json
      - name: Archive only taxon-aggregated model results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-t2-regional-five-climate-source-blocked
          path: work/t2-regional/result
          if-no-files-found: warn
          retention-days: 90
