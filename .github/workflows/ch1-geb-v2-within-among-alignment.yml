name: Ch1 GEB v2 within-among alignment

on:
  pull_request:
    paths:
      - 'analysis/run_geb_v2_within_among_alignment.py'
      - 'analysis/run_geb_v2_expanded_niche_sorting.py'
      - 'analysis/run_capitulum_functional_space.py'
      - 'analysis/run_capitulum_environment_blocks.py'
      - 'analysis/sample_chelsa_process_environment.py'
      - 'analysis/ch1/within_among_alignment_contract.json'
      - 'analysis/ch1/expanded_niche_sorting_contract.json'
      - 'analysis/ch1/capitulum_environment_blocks_contract.json'
      - 'analysis/ch1/chelsa_process_environment_sources.json'
      - 'analysis/ch1/capitulum_function_annotation.csv'
      - 'manuscript/CAPITULUM_FUNCTIONAL_SPACE_HYPOTHESES_2026-08-27.md'
      - 'tests/test_geb_v2_within_among_alignment.py'
      - 'tests/test_geb_v2_expanded_niche_sorting.py'
      - '.github/workflows/ch1-geb-v2-within-among-alignment.yml'
  workflow_dispatch:
    inputs:
      source_artifact_id:
        description: Completed GEB v2 artifact ID
        required: true
        default: '9612943217'
        type: string
      permutations:
        description: Permutations per inferential test
        required: true
        default: '10000'
        type: string
      bootstrap:
        description: Taxon bootstrap replicates for multivariate geometry
        required: true
        default: '1000'
        type: string

permissions:
  actions: read
  contents: read

jobs:
  align-scales:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SOURCE_ARTIFACT_ID: ${{ inputs.source_artifact_id || '9612943217' }}
      PERMUTATIONS: ${{ inputs.permutations || '10000' }}
      BOOTSTRAP: ${{ inputs.bootstrap || '1000' }}

    steps:
      - uses: actions/checkout@v4
      - name: Prepare output directory
        run: mkdir -p output
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate request
        run: |
          python - <<'PY'
          import os, re
          for key, minimum in [('SOURCE_ARTIFACT_ID', 1), ('PERMUTATIONS', 99), ('BOOTSTRAP', 50)]:
              value = os.environ[key].strip().replace(',', '').replace('_', '')
              if not re.fullmatch(r'[0-9]+', value) or int(value) < minimum:
                  raise SystemExit(f'{key} must be an integer >= {minimum}')
          PY
      - name: Install analysis dependencies
        run: |
          python -m pip install 'pandas>=2.2,<4' 'numpy>=1.26,<3' 'rasterio>=1.3,<2' 'pyproj>=3.6,<4'
          python -m pip check
      - name: Compile and run synthetic tests
        run: |
          python -m py_compile \
            analysis/run_geb_v2_within_among_alignment.py \
            analysis/run_geb_v2_expanded_niche_sorting.py \
            analysis/run_capitulum_functional_space.py \
            analysis/run_capitulum_environment_blocks.py \
            analysis/sample_chelsa_process_environment.py
          python -m unittest -v tests/test_geb_v2_within_among_alignment.py
          python -m unittest -v tests/test_geb_v2_expanded_niche_sorting.py
      - name: Download completed GEB v2 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source/extracted output
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 3 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            --output source/geb_v2.zip
          unzip -tq source/geb_v2.zip
          unzip -q source/geb_v2.zip -d source/extracted
          sha256sum source/geb_v2.zip > output/source_geb_v2_artifact_sha256.txt
      - name: Resolve GEB v2 tables
        run: |
          set -euo pipefail
          resolve_one() {
            local pattern="$1"
            local variable="$2"
            mapfile -t matches < <(find source/extracted -type f -name "$pattern" | sort)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected one match for ${pattern}; found ${#matches[@]}" >&2
              printf '%s\n' "${matches[@]}" >&2
              exit 1
            fi
            echo "${variable}=${matches[0]}" >> "$GITHUB_ENV"
          }
          resolve_one continuous_trait_universe_observation_long.csv TRAITS_LONG
          resolve_one strict_spatial_chelsa.csv ENVIRONMENT
          resolve_one continuous_trait_universe_climate_coefficients.csv WITHIN_COEFFICIENTS
      - name: Preflight frozen CHELSA process sources
        run: |
          mkdir -p output/process_environment
          python - <<'PY'
          import os
          import pandas as pd
          source = pd.read_csv(os.environ['ENVIRONMENT'], low_memory=False)
          source.head(32).to_csv('/tmp/chelsa_process_preflight.csv', index=False)
          PY
          python analysis/sample_chelsa_process_environment.py \
            --environment /tmp/chelsa_process_preflight.csv \
            --source-contract analysis/ch1/chelsa_process_environment_sources.json \
            --out-csv /tmp/chelsa_process_preflight_output.csv \
            --report output/process_environment/chelsa_process_preflight_report.json
      - name: Run symmetric within-among CHELSA analysis
        run: |
          python analysis/run_geb_v2_within_among_alignment.py \
            --traits-long "$TRAITS_LONG" \
            --environment "$ENVIRONMENT" \
            --within-coefficients "$WITHIN_COEFFICIENTS" \
            --out-dir output/alignment \
            --predictors chelsa_bio01 chelsa_bio04 chelsa_bio12 chelsa_bio15 \
            --primary-min-trait-observations 5 \
            --sensitivity-min-trait-observations 2 \
            --minimum-taxa 20 \
            --permutations "$PERMUTATIONS" \
            --seed 20260827
      - name: Run expanded among-taxon environmental sorting
        run: |
          python analysis/run_geb_v2_expanded_niche_sorting.py \
            --traits-long "$TRAITS_LONG" \
            --environment "$ENVIRONMENT" \
            --out-dir output/niche_sorting \
            --predictors chelsa_bio01 chelsa_bio04 chelsa_bio12 chelsa_bio15 \
            --primary-min-trait-observations 5 \
            --sensitivity-min-trait-observations 2 \
            --minimum-common-taxa 20 \
            --permutations "$PERMUTATIONS" \
            --seed 20260827
      - name: Quantify multilevel capitulum-space organization
        run: |
          python analysis/run_capitulum_functional_space.py \
            --traits-long "$TRAITS_LONG" \
            --out-dir output/capitulum_space \
            --thresholds 5 2 \
            --module-permutations "$PERMUTATIONS" \
            --matrix-permutations "$PERMUTATIONS" \
            --bootstrap "$BOOTSTRAP" \
            --seed 20260827
      - name: Attach frozen CHELSA process variables
        run: |
          python analysis/sample_chelsa_process_environment.py \
            --environment "$ENVIRONMENT" \
            --source-contract analysis/ch1/chelsa_process_environment_sources.json \
            --out-csv output/process_environment/strict_spatial_chelsa_process.csv \
            --report output/process_environment/chelsa_process_extraction_report.json
          echo "PROCESS_ENVIRONMENT=output/process_environment/strict_spatial_chelsa_process.csv" >> "$GITHUB_ENV"
      - name: Test predeclared environmental blocks against the 18D capitulum
        run: |
          python analysis/run_capitulum_environment_blocks.py \
            --traits-long "$TRAITS_LONG" \
            --environment "$PROCESS_ENVIRONMENT" \
            --block-contract analysis/ch1/capitulum_environment_blocks_contract.json \
            --out-dir output/capitulum_environment \
            --thresholds 5 2 \
            --permutations "$PERMUTATIONS" \
            --bootstrap "$BOOTSTRAP" \
            --seed 20260827
      - name: Record frozen contracts and provenance
        if: always()
        run: |
          mkdir -p output
          cp analysis/ch1/within_among_alignment_contract.json output/within_among_alignment_contract.json
          cp analysis/ch1/expanded_niche_sorting_contract.json output/expanded_niche_sorting_contract.json
          cp analysis/ch1/capitulum_environment_blocks_contract.json output/capitulum_environment_blocks_contract.json
          cp analysis/ch1/chelsa_process_environment_sources.json output/chelsa_process_environment_sources.json
          cp analysis/ch1/capitulum_function_annotation.csv output/capitulum_function_annotation.csv
          cp manuscript/CAPITULUM_FUNCTIONAL_SPACE_HYPOTHESES_2026-08-27.md output/CAPITULUM_FUNCTIONAL_SPACE_HYPOTHESES_2026-08-27.md
          printf '%s\n' "$GITHUB_SHA" > output/git_sha.txt
          printf '%s\n' "$SOURCE_ARTIFACT_ID" > output/source_artifact_id.txt
          python -m pip freeze > output/python_environment.txt
      - name: Upload within-among and capitulum-space artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch1-geb-v2-within-among-${{ github.run_id }}
          path: output
          if-no-files-found: error
          retention-days: 90
