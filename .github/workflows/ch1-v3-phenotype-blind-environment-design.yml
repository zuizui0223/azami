name: Chapter 1 v3 phenotype-blind environment design

on:
  push:
    branches: [revision/ch1-v3-20260907]
    paths:
      - .github/workflows/ch1-v3-phenotype-blind-environment-design.yml
      - analysis/v3/environment_source_archives.json
      - analysis/v3/prepare_environment_source_observations.py
      - analysis/v3/native_range_join_contract.json
      - analysis/v3/build_native_range_join.py
      - analysis/v3/build_native_range_join_from_source.py
      - analysis/v3/build_environment_design_cohort.py
      - analysis/v3/environment_exposure_contract.json
      - analysis/v3/environment_matrix.py
      - analysis/v3/recover_upstream.py
      - analysis/v3/recover_revision_inputs.py
  workflow_dispatch:

concurrency:
  group: ch1-v3-phenotype-blind-environment-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  design:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Set private runner-temporary working directories
        run: |
          echo "V3_SOURCE_ARCHIVES=$RUNNER_TEMP/v3-source-archives" >> "$GITHUB_ENV"
          echo "V3_SOURCE_OBSERVATIONS=$RUNNER_TEMP/v3-source-observations" >> "$GITHUB_ENV"
          echo "V3_NATIVE_JOIN=$RUNNER_TEMP/v3-native-join" >> "$GITHUB_ENV"
          echo "V3_ENV_COHORT=$RUNNER_TEMP/v3-environment-design-cohort" >> "$GITHUB_ENV"
          echo "V3_ENV_DIAGNOSTICS=$RUNNER_TEMP/v3-environment-diagnostics" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install source, taxonomy and raster environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip install 'rasterio>=1.3,<2'

      - name: Recover six immutable source metadata/API archives only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python -m analysis.v3.recover_upstream \
            --manifest analysis/v3/environment_source_archives.json \
            --out-dir "$V3_SOURCE_ARCHIVES" \
            --workers 2

      - name: Reconstruct 665139 phenotype-blind source observations
        run: |
          python -m analysis.v3.prepare_environment_source_observations \
            --archives "$V3_SOURCE_ARCHIVES" \
            --manifest analysis/v3/environment_source_archives.json \
            --out-dir "$V3_SOURCE_OBSERVATIONS"
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.load(open(Path(os.environ['V3_SOURCE_OBSERVATIONS'])/'environment_source_observations_report.json'))
          assert r['counts']['unique_observations']==665139
          assert r['trait_files_read']==0 and r['image_files_read']==0
          print(r['counts'])
          PY

      - name: Resolve taxon concepts and native range from WCVP TDWG
        run: |
          python -m analysis.v3.build_native_range_join_from_source \
            --source-csv "$V3_SOURCE_OBSERVATIONS/environment_source_observations.csv" \
            --contract analysis/v3/native_range_join_contract.json \
            --out-dir "$V3_NATIVE_JOIN"
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.load(open(Path(os.environ['V3_NATIVE_JOIN'])/'native_range_join_report.json'))
          assert r['n_observations']==665139
          assert r['trait_files_read']==0 and r['image_files_read']==0
          print({'status_counts':r['status_counts'], 'taxa_by_status':r['taxa_by_status'],
                 'primary_candidate_rows':r['primary_native_wild_public_exact_date_resolved_rows']})
          PY

      - name: Build taxon-balanced environment-design cohort without traits
        run: |
          python -m analysis.v3.build_environment_design_cohort \
            --native-join "$V3_NATIVE_JOIN/native_range_join.csv" \
            --out-dir "$V3_ENV_COHORT" \
            --taxon-cap 60 \
            --minimum-taxon-support 5
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.load(open(Path(os.environ['V3_ENV_COHORT'])/'environment_design_cohort_report.json'))
          assert r['trait_columns_read']==0 and r['environment_columns_read']==0
          assert r['maximum_rows_per_taxon']<=60
          print(r)
          PY

      - name: Sample all monthly and broad CHELSA candidates and diagnose redundancy
        run: |
          python -m analysis.v3.environment_matrix \
            --observations "$V3_ENV_COHORT/environment_design_cohort.csv" \
            --out-dir "$V3_ENV_DIAGNOSTICS" \
            --variables \
              pr_month tas_month tasmax_month rsds_month vpd_month sfcWind_month pet_month cmi_month \
              BIO1 BIO4 BIO12 BIO15 BIO18 GSP NPP

      - name: Verify phenotype-blind weighted diagnostics and report exposure alternatives
        run: |
          python - <<'PY'
          import json, os, pandas as pd
          from pathlib import Path
          root=Path(os.environ['V3_ENV_DIAGNOSTICS'])
          r=json.load(open(root/'environment_diagnostics.json'))
          assert r['trait_columns_read']==0
          assert r['native_only'] is True
          assert r['engineering_pilot_only'] is False
          assert r['weight_column']=='equal_taxon_weight'
          assert r['primary_redundancy_correlation_method']=='pearson_equal_taxon_weight'
          coverage=pd.read_csv(root/'environment_coverage.csv')
          assert {'pet_month','cmi_month'}.issubset(set(coverage['variable']))
          corr=pd.read_csv(root/'environment_correlations.csv')
          hydric_target={'pr_month','BIO12','BIO18','GSP'}
          hydric=corr[(corr['method']=='pearson_equal_taxon_weight') & corr['variable_a'].isin(hydric_target) & corr['variable_b'].isin(hydric_target)]
          water_stress_target={'pr_month','vpd_month','pet_month','cmi_month'}
          water_stress=corr[(corr['method']=='pearson_equal_taxon_weight') & corr['variable_a'].isin(water_stress_target) & corr['variable_b'].isin(water_stress_target)]
          print({'matrix':r['matrix'],'redundancy_components':r['redundancy_components']})
          print('hydric alternatives')
          print(hydric.to_string(index=False))
          print('water-stress alternatives')
          print(water_stress.to_string(index=False))
          PY

      - name: Retain aggregate design evidence only
        if: always()
        run: |
          mkdir -p publish
          for f in \
            "$V3_SOURCE_OBSERVATIONS/environment_source_observations_report.json" \
            "$V3_NATIVE_JOIN/native_range_join_report.json" \
            "$V3_ENV_COHORT/environment_design_cohort_report.json" \
            "$V3_ENV_DIAGNOSTICS/environment_diagnostics.json" \
            "$V3_ENV_DIAGNOSTICS/environment_coverage.csv" \
            "$V3_ENV_DIAGNOSTICS/environment_correlations.csv" \
            "$V3_ENV_DIAGNOSTICS/environment_vif.csv"; do
              if [ -f "$f" ]; then cp "$f" publish/; fi
          done
          if [ "$(find publish -type f | wc -l)" -eq 0 ]; then
            printf '%s\n' '{"status":"INCOMPLETE_BEFORE_AGGREGATE_RECEIPT"}' > publish/workflow_incomplete.json
          fi
          rm -rf "$V3_SOURCE_ARCHIVES" "$V3_SOURCE_OBSERVATIONS" "$V3_NATIVE_JOIN" "$V3_ENV_COHORT" "$V3_ENV_DIAGNOSTICS"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ch1-v3-phenotype-blind-environment-design-${{ github.run_id }}
          path: publish
          if-no-files-found: error
          retention-days: 30
