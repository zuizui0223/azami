name: GEB V4 S1-S2 frozen science and manuscript contract
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'analysis/README.md'
      - 'manuscripts/README.md'
      - 'legacy/README.md'
      - 'docs/REPOSITORY_MAP.md'
      - 'docs/REPRODUCIBILITY_AND_SUBMISSION_RUNBOOK.md'
      - 'docs/BRANCH_ARCHIVE_TRIAGE_20261030.md'
      - 'tests/test_repository_navigation.py'
      - 'scripts/repository_ref_audit.py'
      - 'tests/test_repository_ref_audit.py'
      - 'tests/test_v4_zenodo_release_guard.py'
      - 'scripts/validate_zenodo_v4_release.py'
      - 'scripts/build_zenodo_ccby4_overlay.py'
      - 'docs/ZENODO_V4_RELEASE_HANDOFF.md'
      - 'docs/BRANCH_REF_INPUT_20261030.json'
      - 'analysis/v4/**'
      - 'manuscripts/v4_s1_s2_frozen_20261025/**'
      - 'legacy/v3/**'
      - 'tests/test_v4_geb_main_contract.py'
      - 'tests/test_v4_review_aggregate_bundle.py'
      - 'tests/test_v4_submission_sampling_coverage.py'
      - '.github/workflows/v4-geb-main-contract.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'analysis/README.md'
      - 'manuscripts/README.md'
      - 'legacy/README.md'
      - 'docs/REPOSITORY_MAP.md'
      - 'docs/REPRODUCIBILITY_AND_SUBMISSION_RUNBOOK.md'
      - 'docs/BRANCH_ARCHIVE_TRIAGE_20261030.md'
      - 'tests/test_repository_navigation.py'
      - 'scripts/repository_ref_audit.py'
      - 'tests/test_repository_ref_audit.py'
      - 'tests/test_v4_zenodo_release_guard.py'
      - 'scripts/validate_zenodo_v4_release.py'
      - 'scripts/build_zenodo_ccby4_overlay.py'
      - 'docs/ZENODO_V4_RELEASE_HANDOFF.md'
      - 'docs/BRANCH_REF_INPUT_20261030.json'
      - 'analysis/v4/**'
      - 'manuscripts/v4_s1_s2_frozen_20261025/**'
      - 'legacy/v3/**'
      - 'tests/test_v4_geb_main_contract.py'
      - 'tests/test_v4_review_aggregate_bundle.py'
      - 'tests/test_v4_submission_sampling_coverage.py'
      - '.github/workflows/v4-geb-main-contract.yml'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check journal abstract, locked numbers, archive and static sources
        run: |
          python -m unittest discover -s tests -p 'test_repository_navigation.py' -v
          python -m unittest discover -s tests -p 'test_repository_ref_audit.py' -v
          python -m unittest discover -s tests -p 'test_v4_zenodo_release_guard.py' -v
          python -m unittest discover -s tests -p 'test_v4_geb_main_contract.py' -v
          python -m unittest discover -s tests -p 'test_v4_review_aggregate_bundle.py' -v
          python -m py_compile analysis/v4/final_v4_bio18_holm_freeze.py
          python -m py_compile scripts/build_zenodo_ccby4_overlay.py scripts/validate_zenodo_v4_release.py
          python -m py_compile manuscripts/v4_s1_s2_frozen_20261025/build_full_supplement.py
          python -m py_compile manuscripts/v4_s1_s2_frozen_20261025/plot_cross_functional_pairs.py
          python -m py_compile manuscripts/v4_s1_s2_frozen_20261025/plot_frozen_summary.py
          python -m py_compile manuscripts/v4_s1_s2_frozen_20261025/verify_s2_frozen_colour_context.py
          python -m py_compile manuscripts/v4_s1_s2_frozen_20261025/plot_s2_native_introduced_colour.py
          python -m py_compile manuscripts/v4_s1_s2_frozen_20261025/plot_bio18_angle_part2.py
          python -m py_compile manuscripts/v4_s1_s2_frozen_20261025/plot_h3_climate_morphospace.py
          python -m py_compile manuscripts/v4_s1_s2_frozen_20261025/plot_bio18_geographic_sensitivity.py
          python -m py_compile manuscripts/v4_s1_s2_frozen_20261025/build_submission_documents.py
          python -m py_compile manuscripts/v4_s1_s2_frozen_20261025/build_review_aggregate_bundle.py
          python -m py_compile manuscripts/v4_s1_s2_frozen_20261025/plot_measurement_pipeline_v4.py
          python -m py_compile manuscripts/v4_s1_s2_frozen_20261025/plot_sampling_coverage_v4.py
      - name: Recover SHA-256-fixed original aggregated results
        run: |
          set -euo pipefail
          mkdir -p work/geb_v4
          gh api repos/zuizui0223/azami/actions/artifacts/12547876704/zip > work/geb_v4/source.zip
          echo '6e081dc081bb8ee2311a05ac5b7fcddd3f6309be2fa909e87d432789f4e0e205  work/geb_v4/source.zip' | sha256sum -c -
      - name: Revalidate four Holm claims and exact visible-module freeze
        run: |
          python -m analysis.v4.final_v4_bio18_holm_freeze --artifact-zip work/geb_v4/source.zip --output work/geb_v4/freeze_check.json
          python -m json.tool work/geb_v4/freeze_check.json > /dev/null
      - name: Verify native versus introduced colour coefficients in the original S2 128-test family
        run: |
          python manuscripts/v4_s1_s2_frozen_20261025/verify_s2_frozen_colour_context.py --artifact work/geb_v4/source.zip --output work/geb_v4/si/Table_S2_S2_original_native_introduced_colour_coefficients.csv
          test $(($(wc -l < work/geb_v4/si/Table_S2_S2_original_native_introduced_colour_coefficients.csv)-1)) -eq 6
      - name: Regenerate 208 frozen phenotype-environment tests, 28 RV pairs and non-niche figures
        run: |
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scipy>=1.11,<2' 'statsmodels>=0.14,<1' 'matplotlib>=3.8,<4'
          python -m unittest discover -s tests -p 'test_v4_submission_sampling_coverage.py' -v
          python manuscripts/v4_s1_s2_frozen_20261025/build_full_supplement.py --artifact work/geb_v4/source.zip --out work/geb_v4/si
          test $(($(wc -l < work/geb_v4/si/Table_S1_full_208_BIO18_tests.csv)-1)) -eq 208
          test $(($(wc -l < work/geb_v4/si/Table_S2_all_28_RV_pairs.csv)-1)) -eq 28
          python manuscripts/v4_s1_s2_frozen_20261025/plot_frozen_summary.py --output-dir work/geb_v4/figures
          python manuscripts/v4_s1_s2_frozen_20261025/plot_bio18_angle_part2.py --artifact work/geb_v4/source.zip --output-dir work/geb_v4/figures --si-dir work/geb_v4/si
          python manuscripts/v4_s1_s2_frozen_20261025/plot_bio18_geographic_sensitivity.py --output-dir work/geb_v4/si
          test -s work/geb_v4/si/figure3_BIO18_geographic_sensitivity.png
          test -s work/geb_v4/si/figure3_BIO18_geographic_sensitivity.svg
          test $(($(wc -l < work/geb_v4/si/SI_S1_all_80_original_raw_BH_Holm.csv)-1)) -eq 80
          test $(($(wc -l < work/geb_v4/si/SI_S1_BIO18_image_angle_both_scales.csv)-1)) -eq 2
          python manuscripts/v4_s1_s2_frozen_20261025/plot_s2_native_introduced_colour.py --source work/geb_v4/si/Table_S2_S2_original_native_introduced_colour_coefficients.csv --output-dir work/geb_v4/figures
          python manuscripts/v4_s1_s2_frozen_20261025/plot_cross_functional_pairs.py --pairs-csv work/geb_v4/si/Table_S2_all_28_RV_pairs.csv --output-dir work/geb_v4/figures
          test -s work/geb_v4/figures/figure2_cross_functional_trait_pairs.png
          test -s work/geb_v4/si/Figure_S1_S1_all_28_RV.png
          test -s work/geb_v4/figures/figure3_BIO18_among_taxa_image_angle.png
          test -s work/geb_v4/si/SI_Figure_BIO18_image_angle_both_scales.png
          test -s work/geb_v4/figures/figure4_S2_native_introduced_colour_coefficients.png
          python manuscripts/v4_s1_s2_frozen_20261025/plot_h3_climate_morphospace.py --output-dir work/geb_v4/figures
          test -s work/geb_v4/figures/figure5_H3_climatic_breadth_floral_morphospace.png
          test -s work/geb_v4/figures/figure5_H3_climatic_breadth_floral_morphospace.svg
      - name: Validate original cross-domain signed correlations (descriptive only)
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          path=Path("work/geb_v4/si/Table_S2_all_28_RV_pairs.csv")
          with path.open(newline="",encoding="utf-8") as f:
              rows={(r["left"],r["right"]):r for r in csv.DictReader(f)}
          assert len(rows)==28, "Missing a source-derived RV pair"
          expected={
              ("angle","chroma"):(-0.22512839486857492,-0.028067356918921597),
              ("angle","aspect"):(-0.24694620634514822,-0.0693870326972044),
              ("chroma","aspect"):(0.01993972231831634,-0.01824691397495542),
          }
          for pair,(among,within) in expected.items():
              result=rows[pair]
              assert result["n_photos"]=="156683" and result["n_taxa"]=="174"
              assert abs(float(result["adjusted_among_signed_r"])-among)<1e-9,pair
              assert abs(float(result["adjusted_within_signed_r"])-within)<1e-9,pair
          print("Original 28 pairs verified, selected angle-chroma-aspect cross-domain signs fixed")
          PY
      - name: Save verified aggregate tables, not private source records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geb-v4-source-check-${{ github.run_id }}
          path: |
            work/geb_v4/freeze_check.json
            work/geb_v4/si/**
            work/geb_v4/figures/**
          retention-days: 30
          if-no-files-found: warn
