name: TEMP Chapter 1 eight-stage replay

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-ch1-current-replay-pr.yml'

permissions:
  contents: read
  actions: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen numerical environment
        run: python -m pip install -r reproducibility/requirements-current.txt
      - name: Run eight-stage numerical replay and 16-file validation
        run: python -m reproducibility.run_current_analysis --download
      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch1-current-eight-stage-replay-${{ github.run_id }}
          path: |
            work/current/results/**
            work/current/inputs/verified_inputs.json
          retention-days: 30
          if-no-files-found: error
