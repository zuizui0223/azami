name: V4 all-upstream native-source completion
on:
  pull_request:
    paths:
      - 'analysis/v4/native_additional_species_20261020.txt'
      - '.github/workflows/v4-native-full-source.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-completion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests numpy pandas shapely pytest
      - name: Recover checksum-locked 288-taxon authority snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work/native350/base work/native350/out
          gh api repos/zuizui0223/azami/actions/artifacts/12242801813/zip > work/native350/base.zip
          echo '3774fa4ae93fd6612598c27450c7ea5925957437feb27f4950b803b0652e146d  work/native350/base.zip' | sha256sum -c -
          unzip -q work/native350/base.zip -d work/native350/base
      - name: Query missing upstream species only, preserving raw authority responses
        run: |
          python - <<'PY'
          import json, hashlib, os
          from pathlib import Path
          from datetime import datetime, timezone
          from concurrent.futures import ThreadPoolExecutor
          from urllib.parse import urlencode
          from analysis.v4.collect_native_sources import download, pages, API, DATASET
          from analysis.v4.native_scope import resolve_exact
          root = Path('work/native350')
          source = json.loads((root/'base/native_sources.json').read_text())
          raw = json.loads((root/'base/raw_gbif_responses.json').read_text())
          meta = json.loads(download(API+'/dataset/'+DATASET))
          assert meta['modified'] == source['dataset_metadata']['modified'], 'Authority version changed; do not mix snapshots'
          extra = Path('analysis/v4/native_additional_species_20261020.txt').read_text().splitlines()
          existing = {r['input_name'] for r in source['resolutions']}
          assert len(extra)==len(set(extra))==62 and not existing.intersection(extra)
          def fetch_name(name):
              rows, payload = pages(API+'/species/search?'+urlencode({'dataset_key':DATASET,'q':name}))
              return name, resolve_exact(name,rows), payload
          with ThreadPoolExecutor(max_workers=4) as pool:
              rows = list(pool.map(fetch_name, extra))
          source['resolutions'].extend([r[1] for r in rows])
          raw['name_queries'].update({r[0]:r[2] for r in rows})
          keys = sorted({r['accepted_key'] for r in source['resolutions'] if r['accepted_key'] is not None} - {int(k) for k in source['distributions']})
          def fetch_dist(key):
              dist, payload = pages(API+f'/species/{key}/distributions')
              return str(key),dist,payload
          with ThreadPoolExecutor(max_workers=4) as pool:
              for key, dist, payload in pool.map(fetch_dist, keys):
                  source['distributions'][key]=dist
                  raw['distribution_queries'][key]=payload
          source['completed_utc']=datetime.now(timezone.utc).isoformat()
          source['resolutions']=sorted(source['resolutions'],key=lambda r:r['input_name'])
          assert len(source['resolutions'])==350
          out=root/'out'
          (out/'native_sources_350.json').write_text(json.dumps(source,ensure_ascii=False))
          (out/'raw_gbif_responses_350.json').write_text(json.dumps(raw,ensure_ascii=False))
          receipt={'upstream_snapshot':'8066010557 / 2026-07-03', 'source_photo_rows':1122854,'source_observations':665115,'species_rank_names':350,'previous_names':288,'additional_names':62,'queried_names':len(source['resolutions']),'resolved_names':sum(r['accepted_key'] is not None for r in source['resolutions']),'dataset_modified':meta['modified'],'input_authority_zip_sha256':'3774fa4ae93fd6612598c27450c7ea5925957437feb27f4950b803b0652e146d','trait_values_used':False,'native_cohort_or_analysis_executed':False,'commit':os.environ['GITHUB_SHA'],'file_sha256':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in out.glob('*.json')}}
          (out/'source_receipt_350.json').write_text(json.dumps(receipt,indent=2))
          print(json.dumps(receipt,indent=2))
          PY
      - name: Preserve source code for offline replay
        run: |
          git archive --format=tar HEAD > work/native350/out/source_code.tar
      - uses: actions/upload-artifact@v4
        with:
          name: v4-native-all350-source-and-code
          path: work/native350/out/
          retention-days: 90
