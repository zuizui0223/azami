name: Export EAzami Japan-38 exhaustive traits

on:
  pull_request:
    paths:
      - "analysis/export_eazami_japan38_exhaustive_traits.py"
      - "tests/test_export_eazami_japan38_exhaustive_traits.py"
      - ".github/workflows/ch1-export-eazami-japan38-exhaustive-traits.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SOURCE_RUN_ID: "29216617585"
      SOURCE_ARTIFACT_NAME: "ch1-exhaustive-continuous-merged-all_photos_20260711_v1-recovery"
      SOURCE_ARTIFACT_ID: "8269246732"
      SOURCE_ARTIFACT_DIGEST: "sha256:5f18b42d18cfcb81691c38ce0f04bcef754e6a67382025ea90110dbc50ae194b"
      EAZAMI_MEMBERSHIP_COMMIT: "17d87fcf491b57c24cea7bc91936990730aecd09"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal dependency
        run: python -m pip install pandas numpy

      - name: Compile and test exporter
        run: |
          python -m py_compile analysis/export_eazami_japan38_exhaustive_traits.py
          python -m unittest tests/test_export_eazami_japan38_exhaustive_traits.py -v

      - name: Download frozen exhaustive Azami artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          name: ${{ env.SOURCE_ARTIFACT_NAME }}
          path: source/exhaustive

      - name: Fetch pinned EAzami Japan-38 membership audit
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/zuizui0223/EAzami/${EAZAMI_MEMBERSHIP_COMMIT}/data/evidence/moreyra2025_japan_38_membership_audit_2026-08-10.csv" \
            --output source/japan38.csv
          test -s source/japan38.csv

      - name: Resolve exhaustive observation table
        run: |
          set -euo pipefail
          mapfile -t files < <(find source/exhaustive -type f -name exhaustive_continuous_observation_level.csv | sort)
          test "${#files[@]}" -eq 1
          echo "EXHAUSTIVE_OBSERVATIONS=${files[0]}" >> "$GITHUB_ENV"

      - name: Export Japan-38 trait summaries
        run: |
          python analysis/export_eazami_japan38_exhaustive_traits.py \
            --observations "$EXHAUSTIVE_OBSERVATIONS" \
            --japan38 source/japan38.csv \
            --out-dir handoff

      - name: Validate recovered coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          summary = json.loads(Path("handoff/japan38_exhaustive_trait_summary_v1.json").read_text())
          traits = pd.read_csv("handoff/japan38_exhaustive_primary_trait_summary_v1.csv")
          coverage = pd.read_csv("handoff/japan38_exhaustive_trait_coverage_v1.csv")
          if summary["n_japan38_paper_concepts"] != 38:
              raise SystemExit("Japan-38 membership count drifted")
          if summary["n_distinct_binomial_trait_taxa_present"] != 18:
              raise SystemExit(f"Expected 18 detector-positive Japan-38 binomial trait taxa, got {summary['n_distinct_binomial_trait_taxa_present']}")
          if summary["n_paper_concepts_represented_at_binomial_level"] != 20:
              raise SystemExit("Expected 20 Japan-38 paper concepts represented at binomial level")
          if len(traits) != 18 or coverage["azami_detector_positive_trait_taxon_present"].sum() != 18:
              raise SystemExit("Coverage table and trait table disagree")
          if "Cirsium amplexifolium" not in set(traits["taxon_name"]):
              raise SystemExit("Exhaustive layer failed to recover C. amplexifolium")
          print(summary)
          PY

      - name: Record immutable source provenance
        run: |
          cat > handoff/source_provenance.json <<JSON
          {
            "azami_source_run_id": ${SOURCE_RUN_ID},
            "azami_source_artifact_id": ${SOURCE_ARTIFACT_ID},
            "azami_source_artifact_name": "${SOURCE_ARTIFACT_NAME}",
            "azami_source_artifact_digest": "${SOURCE_ARTIFACT_DIGEST}",
            "eazami_membership_commit": "${EAZAMI_MEMBERSHIP_COMMIT}"
          }
          JSON

      - uses: actions/upload-artifact@v4
        with:
          name: azami-eazami-japan38-exhaustive-traits-${{ github.run_id }}
          path: handoff
          if-no-files-found: error
          retention-days: 90
