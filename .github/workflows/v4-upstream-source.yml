name: V4 original-photo upstream validation
on:
  pull_request:
    paths:
      - 'analysis/v4/upstream*'
      - 'analysis/v4/run_upstream*'
      - 'tests/test_v4_upstream.py'
      - '.github/workflows/v4-upstream-source.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: v4-upstream-original-photo
  cancel-in-progress: false
jobs:
  source-replay:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image measurement environment
        run: python -m pip install numpy pandas pillow opencv-python-headless requests pytest
      - name: Test upstream sampling and direct pixel geometry
        run: python -m pytest -q tests/test_v4_upstream.py
      - name: Acquire actual original images from pre-detector metadata
        run: python -m analysis.v4.run_upstream_acquisition --manifest analysis/v4/upstream_first_batch.json --out-dir work/v4-upstream
      - name: Record optional upstream source availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate repos/zuizui0223/azami/releases | jq -s '[.[][] | {tag:.tag_name,draft:.draft,assets:[.assets[] | {id,name,size,digest}]}]' > work/v4-upstream/release_source_inventory.json
          mkdir -p work/v4-upstream/optional_runtime
          python -m pip download --no-deps ultralytics ultralytics-thop -d work/v4-upstream/optional_runtime
      - name: Preserve source bytes and acquisition receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-original-photo-upstream
          path: work/v4-upstream/
          retention-days: 30
