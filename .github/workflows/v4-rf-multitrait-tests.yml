name: V4 RF exploratory code tests (no private source)
on:
  pull_request:
    paths:
      - 'analysis/v4/rf_multitrait_predictability.py'
      - 'analysis/v4/rf_extended_environment.py'
      - 'analysis/v4/rf_extended_raster_sampler.py'
      - 'analysis/v4/RF_MULTITRAIT_PREDICTABILITY_JA.md'
      - 'analysis/v4/RF_EXPANDED_44_PREDICTORS_JA.md'
      - 'analysis/v4/rf_requirements.txt'
      - 'analysis/v4/rf_complete_bioclim21_raster_recipe_TEMPLATE.json'
      - 'tests/test_v4_rf_multitrait_predictability.py'
      - 'tests/test_v4_rf_extended_environment.py'
      - 'tests/test_v4_rf_extended_raster_sampler.py'
      - '.github/workflows/v4-rf-multitrait-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install main and optional RF/geospatial test requirements
        run: python -m pip install -e '.[test]' -r analysis/v4/rf_requirements.txt
      - name: Test synthetic cohort, leakage, source raster/manifest guards only
        run: |
          python -m pytest -q tests/test_v4_rf_multitrait_predictability.py \
            tests/test_v4_rf_extended_environment.py \
            tests/test_v4_rf_extended_raster_sampler.py
      - name: Syntax and template checks
        run: |
          python -m py_compile analysis/v4/rf_multitrait_predictability.py \
            analysis/v4/rf_extended_environment.py \
            analysis/v4/rf_extended_raster_sampler.py
          python -m analysis.v4.rf_extended_raster_sampler \
            --upper-tier complete_bioclim21 \
            --create-recipe-template /tmp/test_rf_bioclim21_template.json
          python -c 'import json; from pathlib import Path; assert len(json.loads(Path("/tmp/test_rf_bioclim21_template.json").read_text())["layers"]) == 9'