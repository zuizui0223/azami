name: V4 RF exploratory code tests (no private source)
on:
  pull_request:
    paths:
      - 'analysis/v4/rf_multitrait_predictability.py'
      - 'analysis/v4/RF_MULTITRAIT_PREDICTABILITY_JA.md'
      - 'analysis/v4/rf_requirements.txt'
      - 'tests/test_v4_rf_multitrait_predictability.py'
      - '.github/workflows/v4-rf-multitrait-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install main and optional RF test requirements
        run: python -m pip install -e '.[test]' -r analysis/v4/rf_requirements.txt
      - name: Test synthetic cohort and leakage/provenance guards only
        run: python -m pytest -q tests/test_v4_rf_multitrait_predictability.py
      - name: Syntax check
        run: python -m py_compile analysis/v4/rf_multitrait_predictability.py
