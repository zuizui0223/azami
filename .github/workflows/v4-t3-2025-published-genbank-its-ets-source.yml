name: V4 T3 2025 original 163 ITS ETS public GenBank source for Senecioneae phylogeny
on:
  pull_request:
    paths:
      - 'analysis/v4/t3_public_2025_its_ets_genbank_reconstruct.py'
      - 'analysis/v4/results/20261023_T3_TAIWANIA2025_ORIGINAL163_ITS_ETS_GENBANK_ACCESSIONS.csv'
      - 'tests/test_v4_t3_public_2025_its_ets_genbank_reconstruct.py'
      - '.github/workflows/v4-t3-2025-published-genbank-its-ets-source.yml'
  push:
    branches: [codex/v4-native-integration-workflow]
    paths:
      - 'analysis/v4/t3_public_2025_its_ets_genbank_reconstruct.py'
      - 'analysis/v4/results/20261023_T3_TAIWANIA2025_ORIGINAL163_ITS_ETS_GENBANK_ACCESSIONS.csv'
      - 'tests/test_v4_t3_public_2025_its_ets_genbank_reconstruct.py'
      - '.github/workflows/v4-t3-2025-published-genbank-its-ets-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-published-2025-genbank-ITS-ETS-source-specimens:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install trusted real NCBI INSDC source parser
        run: python -m pip install 'requests>=2.31,<3' 'biopython>=1.83,<2' 'pytest>=8,<10'
      - name: Test all original 163 publication rows; guard nine duplicated names and linked nuclear rDNA regions
        run: |
          python -m pytest -q tests/test_v4_t3_public_2025_its_ets_genbank_reconstruct.py tests/test_v4_t3_ren2021_real_sra_capitulum_tip_crosswalk.py
      - name: Probe a dozen genuine published accessions, no DNA fastq bulk
        run: |
          mkdir -p work/T3/2025-pilot
          python -m analysis.v4.t3_public_2025_its_ets_genbank_reconstruct \
            --original-2025-table analysis/v4/results/20261023_T3_TAIWANIA2025_ORIGINAL163_ITS_ETS_GENBANK_ACCESSIONS.csv \
            --outdir work/T3/2025-pilot --limit 12
      - name: Retrieve real original GenBank ITS ETS from EVERY one of 163 published source accession table entries
        run: |
          mkdir -p work/T3/2025-full
          python -m analysis.v4.t3_public_2025_its_ets_genbank_reconstruct \
            --original-2025-table analysis/v4/results/20261023_T3_TAIWANIA2025_ORIGINAL163_ITS_ETS_GENBANK_ACCESSIONS.csv \
            --outdir work/T3/2025-full
          git rev-parse HEAD > work/T3/2025-full/AUDITED_COMMIT.txt
      - name: Verify unlinked gene ancestry and real source coverage NEVER promoted to complete species tree
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("work/T3/2025-full")
          a=json.loads((root/"T3_2025_TRUE_SOURCE_GENBANK_ITS_ETS_RECOVERY_STATUS.json").read_text())
          assert a["original_163_source_rows"]==163
          assert a["original_154_unique_published_taxa"]==154
          assert a["source_rows_queried"]==163
          assert not a["source_failure_batches_not_ITS_absence"]
          assert a["n_unique_taxa_with_exact_published_organism_ITS"]>=35
          assert a["n_unique_taxa_with_exact_published_organism_both_ITS_and_ETS"]>=15
          assert a["original_ITS_ETS_rDNA_spacers_physically_linked_not_independent_nuclear_orthologs"]
          assert a["original_2021_48_target_capture_phylogeny_not_reproduced"]
          assert a["T3_ancestral_nodding_transition_count_and_rain_fitness_not_inferred"]
          assert (root/"T3_2025_ORIGINAL_GENBANK_ITS_SEQUENCE.fasta").stat().st_size>10000
          print("T3_TRUE_PUBLISHED_163_ITS_ETS_SOURCE_RETRIEVED",
                a["n_unique_taxa_with_exact_published_organism_ITS"],
                a["n_unique_taxa_with_exact_published_organism_both_ITS_and_ETS"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t3-published2025-163-source-genbank-ITS-ETS-154names-exact-original
          path: work/T3/2025-full/
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t3-published2025-small-pilot-genbank-accessions
          path: work/T3/2025-pilot/
          if-no-files-found: warn
          retention-days: 60
