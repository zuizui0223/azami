name: V4 S2 full-background WCVP climate PCA-env
on:
  workflow_dispatch:
  push:
    branches: [codex/v4-native-integration-workflow]
    paths:
      - 'analysis/v4/native_pca_env.py'
      - 'analysis/v4/native_pca_env_fullcoverage.py'
      - 'analysis/v4/native_full_rain_head_response.py'
      - 'analysis/v4/native_wet_edge.py'
      - 'tests/test_v4_native_wet_edge.py'
      - 'tests/test_v4_native_full_rain_head_response.py'
      - 'analysis/v4/native_climate_source_archive.py'
      - 'tests/test_v4_native_pca_env_fullcoverage.py'
      - '.github/workflows/v4-native-pca-env-full-background.yml'
permissions:
  # Required to READ original source from immutable private GitHub Draft release.
  # No release, tag or repository content is modified by this workflow.
  contents: write
  actions: read
concurrency:
  group: v4-pca-env-full-background-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-verified-complete-niche:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned environment and rasterio for original TIFF-only sampling
        run: |
          python -m pip install -r reproducibility/requirements-current.txt \
            'shapely>=2,<3' 'rasterio>=1.4,<2' \
            'requests>=2.32,<3' 'cryptography>=46,<49' pytest
      - name: Validate source SHA, exact original TIFF pixel and stop-rule tests
        run: |
          python -m pytest -q \
            tests/test_v4_native_pca_env.py \
            tests/test_v4_native_pca_env_fullcoverage.py \
            tests/test_v4_native_full_rain_head_response.py \
            tests/test_v4_native_wet_edge.py
      - name: Recover original sealed 665115 source and WCVP350 authority, never publish originals
        run: |
          set -euo pipefail
          mkdir -p work/full-pca-env/private work/full-pca-env/public
          gh api -H 'Accept: application/octet-stream' \
            repos/zuizui0223/azami/releases/assets/658986481 \
            > work/full-pca-env/private/original-metadata.aesgcm
          echo 'dfa98fa162a8029cb6477adf4c26ffc5819cc916a0513d32da14d78d845ab4b0  work/full-pca-env/private/original-metadata.aesgcm' | sha256sum -c -
          gh api repos/zuizui0223/azami/actions/artifacts/12244160272/zip \
            > work/full-pca-env/private/authority350.zip
          echo 'ec0e3b67c2fb81d4d1dd8a9215585e4523abcbf8085959854ec80dc826a56ca1  work/full-pca-env/private/authority350.zip' | sha256sum -c -
          gh api -H 'Accept: application/octet-stream' \
            repos/zuizui0223/azami/releases/assets/659010325 \
            > work/full-pca-env/private/original-measurements.aesgcm
          echo '111c8fb668265a623c948b635dea68b5182f0a2be04d91ec03bda056b608eb60  work/full-pca-env/private/original-measurements.aesgcm' | sha256sum -c -
      - name: Obtain five original CHELSA TIFFs serially with full SHA check then discard each source
        env:
          AZAMI_METADATA_KEY: ${{ secrets.AZAMI_METADATA_KEY }}
          AZAMI_MEASUREMENTS_KEY: ${{ secrets.AZAMI_MEASUREMENTS_KEY }}
        run: |
          python -m analysis.v4.native_pca_env_fullcoverage \
            --original work/full-pca-env/private/original-metadata.aesgcm \
            --authority-archive work/full-pca-env/private/authority350.zip \
            --measurements work/full-pca-env/private/original-measurements.aesgcm \
            --source-meta analysis/v4/environment_source_metadata.json \
            --work work/full-pca-env/private \
            --output work/full-pca-env/public
      - name: Ensure only output aggregates and fully sourced climate information escape private runner
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          path=Path('work/full-pca-env/public/S2_two_species_full_background_PCA_env.json')
          if not path.exists():
              print('Full original CHELSA download or PCA-env did NOT complete; no fake climate niche result created.')
              raise SystemExit(0)
          out=json.loads(path.read_text())
          assert out['status']=='ORIGINAL_TIFF_SHA_VERIFIED_ALL_FIVE_COMPLETE_NATIVE_INTRODUCED_AVAILABLE_ENVIRONMENT'
          assert set(out['focal_source_species'])=={'Cirsium arvense','Cirsium vulgare'}
          assert out['without_image_orientation_trait_selection']
          assert out['no_original_photo_observer_coordinates_in_public_report']
          assert out['total_wild_source_observations_before_observer_cell_balance']==297622
          assert all(x['has_been_SHA_verified_against_existing_native_source']
                     for x in out['source_TIFF_provenance_per_variable'].values())
          response=path.parent/'S2_two_species_full_rain_head_response.json'
          assert response.is_file()
          data=json.loads(response.read_text())
          assert data['status']=='DIRECT_CLIMATE_NOVELTY_AND_IMAGE_ORIENTATION_FINISHED_EXPLORATORY'
          assert set(data['focal'])=={'Cirsium arvense','Cirsium vulgare'}
          assert data['no_original_location_observation_photographer_identifiers_in_public_result']
          assert all(
            'annual_precipitation' in region['hypotheses']
            and 'precipitation_seasonality' in region['hypotheses']
            for species in data['focal'].values() for region in species['regions'].values()
          )
          # S2 envelope must be defined independently of photo-angle outcomes.
          wet=path.parent/'S2_wet_edge_angle_blind_distribution.json'
          assert wet.is_file()
          w=json.loads(wet.read_text())
          assert w['status']=='SOURCE_VERIFIED_WET_EDGE_PREFLIGHT_AND_CONDITIONAL_EXPLORATORY_WHERE_ADMITTED'
          assert set(w['focal'])=={'Cirsium arvense','Cirsium vulgare'}
          assert w['source_two_species_full_original_wild_observations']==297622
          assert w['source_orientation_eligible_before_date_and_cell_balancing']==173737
          assert set(w['source_five_original_CHELSA_SHA256'])==set(out['source_TIFF_provenance_per_variable'])
          assert not any(w['privacy'].values())
          for species in w['focal'].values():
              assert len(species['native_original_unselected_climate_reference']['BIO12_q50_q75_q90_q95_q975_mm'])==5
              assert 'angle_blind_source_coverage' in species
          files=list(path.parent.iterdir())
          assert set(files)=={path,response,wet}, files
          for file in (path,response,wet):
              content=file.read_text()
              for field in ('"obs_id"','"user_id"','"latitude"','"longitude"'):
                  assert field not in content
          print('Exact five-original-raster-source PCA-env aggregate audit passed')
          PY
      - name: Upload aggregate two-species full-background climate niche result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-two-species-PCA-env-full-original-background
          path: work/full-pca-env/public/
          if-no-files-found: warn
          retention-days: 90
