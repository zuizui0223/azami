name: Ch1 WCVP taxonomic review candidates

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "analysis/build_wcvp_taxonomic_review_candidates.py"
      - ".github/workflows/ch1-wcvp-taxonomic-candidates.yml"
      - "analysis/audit_taxonomic_freeze.py"
      - "manuscript/TAXONOMIC_FREEZE_PROTOCOL.md"

permissions:
  actions: read
  contents: read

jobs:
  build-taxonomic-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONTINUOUS_ARTIFACT_ID: "8225059018"
      ENVIRONMENT_RUN_ID: "29306454759"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install pandas

      - name: Download balanced-atlas continuous species table
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source/continuous
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CONTINUOUS_ARTIFACT_ID}/zip" \
            --output source/continuous.zip
          unzip -tq source/continuous.zip
          unzip -q source/continuous.zip -d source/continuous
          test -s source/continuous/aggregated/primary_trait_continuous_species_level.csv

      - name: Download exhaustive 259-taxon environment table
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.ENVIRONMENT_RUN_ID }}
          name: ch1-exhaustive-enriched-environment-20260713
          path: source/environment

      - name: Build WCVP review candidates
        run: |
          test -s source/environment/strict_spatial_thinned_with_climate_topography_soil.csv
          python analysis/build_wcvp_taxonomic_review_candidates.py \
            --taxon-table source/continuous/aggregated/primary_trait_continuous_species_level.csv \
            --taxon-table source/environment/strict_spatial_thinned_with_climate_topography_soil.csv \
            --output-dir taxonomic_review

      - name: Validate candidate table
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          table = pd.read_csv("taxonomic_review/taxonomic_decisions_wcvp_review.csv")
          high = pd.read_csv("taxonomic_review/taxonomic_high_priority_review.csv")
          summary = json.loads(Path("taxonomic_review/taxonomic_wcvp_candidate_summary.json").read_text())
          if table["input_name"].duplicated().any():
              raise SystemExit("Taxonomic candidate names are duplicated")
          if len(table) < 259:
              raise SystemExit(f"Expected at least the exhaustive 259 names, got {len(table)}")
          if not table["decision"].eq("provisional").all():
              raise SystemExit("Candidate workflow must never auto-finalize taxonomic decisions")
          if table["authority_source"].isna().any():
              raise SystemExit("Authority provenance missing")
          print(summary)
          print(f"High-priority human review rows: {len(high)}")
          PY
          printf '%s\n' "${GITHUB_SHA}" > taxonomic_review/git_sha.txt
          sha256sum source/continuous.zip \
            source/environment/strict_spatial_thinned_with_climate_topography_soil.csv \
            > taxonomic_review/input_sha256.txt
          python -m pip freeze > taxonomic_review/python_environment.txt

      - name: Upload WCVP candidate review bundle
        uses: actions/upload-artifact@v4
        with:
          name: ch1-wcvp-taxonomic-review-${{ github.run_id }}
          path: taxonomic_review
          if-no-files-found: error
          retention-days: 90
