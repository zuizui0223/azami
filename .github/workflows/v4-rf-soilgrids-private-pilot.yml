name: V4 RF SoilGrids six original S1 pixel pilot (protected; no RF)
on:
  pull_request:
    paths:
      - 'analysis/v4/rf_soilgrids_private_pilot.py'
      - 'tests/test_v4_rf_soilgrids_private_pilot.py'
      - 'analysis/v4/RF_SOILGRIDS_SOURCE_PROTOCOL_JA.md'
      - '.github/workflows/v4-rf-soilgrids-private-pilot.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: azami-soilgrids-private-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-authenticated-protected-six-soil-pilot:
    if: >-
      github.repository == 'zuizui0223/azami' &&
      github.event.pull_request.number == 167 &&
      github.event.pull_request.head.repo.full_name == 'zuizui0223/azami' &&
      github.event.pull_request.head.ref == 'analysis/v4-rf-multitrait-exploratory-20261031'
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: .
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install secure source reader and original-data numeric dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scipy>=1.11,<2' \
            'statsmodels>=0.14,<1' 'cryptography>=46,<49' \
            'rasterio>=1.3,<2' 'requests>=2.31,<3' pytest
      - name: Test fail-closed original S1, VRT pins, no individual output on synthetic data
        run: |
          python -m pytest -q tests/test_v4_rf_soilgrids_private_pilot.py \
            tests/test_v4_rf_soilgrids_webdav_probe.py
          python -m py_compile analysis/v4/rf_soilgrids_private_pilot.py
      - name: Recover unchanged source-authenticated 313350-row private S1
        env:
          AZAMI_METADATA_KEY: ${{ secrets.AZAMI_METADATA_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AZAMI_METADATA_KEY:-}" ]; then
            echo 'NO_AUTHORIZED_ORIGINAL_S1_DECRYPTION_KEY' >&2
            exit 7
          fi
          mkdir -p work/soil_private/private work/soil_private/receipt work/soil_private/public
          gh run download 39408603488 --repo zuizui0223/azami \
            --name v4-native-observation-input-encrypted --dir work/soil_private/private
          gh run download 39408603488 --repo zuizui0223/azami \
            --name v4-all665115-native-climate-aggregate --dir work/soil_private/receipt
          python - <<'PY'
          import os,hashlib,json
          from pathlib import Path
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          root=Path('work/soil_private')
          raw=(root/'receipt/measurement_receipt.json').read_bytes()
          if hashlib.sha256(raw).hexdigest()!='246a5ea9643617c6dc766e0b8d27a444a5496afe150d7768032740cf6a53f0a6':
              raise SystemExit('S1_SOURCE_RECEIPT_DRIFT')
          receipt=json.loads(raw)
          sealed=(root/'private/native-observation-measurements.csv.gz.aesgcm').read_bytes()
          if hashlib.sha256(sealed).hexdigest()!=receipt['encrypted_table_sha256']:
              raise SystemExit('S1_ENCRYPTED_ARCHIVE_DRIFT')
          try:
              clear=AESGCM(bytes.fromhex(os.environ['AZAMI_METADATA_KEY'])).decrypt(
                  sealed[:12],sealed[12:],receipt['encrypted_table_aad'].encode())
          except Exception:
              raise SystemExit('S1_SOURCE_AUTHENTICATION_FAILED') from None
          if hashlib.sha256(clear).hexdigest()!=receipt['prepared_table_sha256']:
              raise SystemExit('S1_DECRYPTED_SOURCE_SHA_MISMATCH')
          (root/'private/original-s1.csv.gz').write_bytes(clear)
          print('Exact original S1 bytes authenticated; original identities private',flush=True)
          PY
          python -m analysis.v4.decode_environment \
            --table work/soil_private/private/original-s1.csv.gz \
            --receipt work/soil_private/receipt/measurement_receipt.json \
            --metadata analysis/v4/environment_source_metadata.json \
            --output work/soil_private/private/decoded
      - name: Read six exact-pinned SoilGrids pixels on 12 private S1 positions per sector
        run: |
          set -euo pipefail
          python -m analysis.v4.rf_soilgrids_private_pilot \
            --native work/soil_private/private/decoded/observations.csv.gz \
            --receipt work/soil_private/private/decoded/measurement_receipt.json \
            --per-sector 12 \
            --output work/soil_private/public/soilgrids_6layer_originalS1_sample_pilot_aggregate.json
      - name: Upload ONLY six-layer source/coverage audit with no original observation rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azami-soilgrids-protected-six-source-pilot-${{ github.run_id }}
          path: work/soil_private/public/soilgrids_6layer_originalS1_sample_pilot_aggregate.json
          retention-days: 90
          if-no-files-found: warn
      - name: Remove all confidential decoded source and intermediate files
        if: always()
        run: rm -rf work/soil_private/private work/soil_private/receipt