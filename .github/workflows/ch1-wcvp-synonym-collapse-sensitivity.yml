name: Ch1 WCVP synonym-collapse sensitivity

on:
  workflow_dispatch:
    inputs:
      wcvp_review_run_id:
        description: Successful WCVP candidate-review workflow run
        required: true
        default: "31152400481"
        type: string
      environment_run_id:
        description: Frozen enriched environment source run
        required: true
        default: "29306454759"
        type: string
  pull_request:
    branches: [main]
    paths:
      - "analysis/audit_wcvp_synonym_collapse_sensitivity.py"
      - ".github/workflows/ch1-wcvp-synonym-collapse-sensitivity.yml"
      - "analysis/build_wcvp_taxonomic_review_candidates.py"

permissions:
  actions: read
  contents: read

jobs:
  synonym-collapse-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONTINUOUS_ARTIFACT_ID: "8225059018"
      DEFAULT_WCVP_RUN: "31152400481"
      DEFAULT_ENVIRONMENT_RUN: "29306454759"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install pandas numpy statsmodels

      - name: Resolve source runs
        id: params
        shell: bash
        run: |
          WCVP_RUN="${{ inputs.wcvp_review_run_id }}"
          ENV_RUN="${{ inputs.environment_run_id }}"
          echo "wcvp_run=${WCVP_RUN:-$DEFAULT_WCVP_RUN}" >> "$GITHUB_OUTPUT"
          echo "environment_run=${ENV_RUN:-$DEFAULT_ENVIRONMENT_RUN}" >> "$GITHUB_OUTPUT"

      - name: Download WCVP review candidates
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.params.outputs.wcvp_run }}
          name: ch1-wcvp-taxonomic-review-${{ steps.params.outputs.wcvp_run }}
          path: source/wcvp

      - name: Download frozen balanced-atlas continuous artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source/continuous
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CONTINUOUS_ARTIFACT_ID}/zip" \
            --output source/continuous.zip
          unzip -tq source/continuous.zip
          unzip -q source/continuous.zip -d source/continuous
          test -s source/continuous/aggregated/primary_trait_continuous_head_with_metadata.csv

      - name: Download frozen enriched environment
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.params.outputs.environment_run }}
          name: ch1-exhaustive-enriched-environment-20260713
          path: source/environment

      - name: Run WCVP synonym-collapse sensitivity
        run: |
          WCVP="source/wcvp/taxonomic_decisions_wcvp_review.csv"
          HEAD="source/continuous/aggregated/primary_trait_continuous_head_with_metadata.csv"
          ENV="source/environment/strict_spatial_thinned_with_climate_topography_soil.csv"
          test -s "$WCVP"
          test -s "$HEAD"
          test -s "$ENV"
          python analysis/audit_wcvp_synonym_collapse_sensitivity.py \
            --wcvp-review "$WCVP" \
            --head-table "$HEAD" \
            --environment-table "$ENV" \
            --out-dir wcvp_collapse_sensitivity \
            --min-species-model-n 5
          sha256sum "$WCVP" source/continuous.zip "$ENV" > wcvp_collapse_sensitivity/input_sha256.txt
          printf '%s\n' "${GITHUB_SHA}" > wcvp_collapse_sensitivity/git_sha.txt
          python -m pip freeze > wcvp_collapse_sensitivity/python_environment.txt

      - name: Enforce headline robustness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("wcvp_collapse_sensitivity/wcvp_synonym_collapse_sensitivity_summary.json").read_text())
          if r["n_wcvp_synonym_conflicts_collapsed"] != 8:
              raise SystemExit(f"Expected 8 WCVP synonym conflicts, got {r['n_wcvp_synonym_conflicts_collapsed']}")
          if r["n_fdr_decisions_changed"] != 0:
              raise SystemExit("WCVP collapse changes at least one primary FDR decision")
          if r["n_coefficient_signs_changed"] != 0:
              raise SystemExit("WCVP collapse changes at least one primary coefficient sign")
          if r["nested_collapsed_within_fraction_min"] <= 0.5:
              raise SystemExit("WCVP collapse invalidates the below-species variance headline")
          print(json.dumps(r, indent=2))
          PY

      - name: Upload taxonomic sensitivity artifact
        uses: actions/upload-artifact@v4
        with:
          name: ch1-wcvp-synonym-collapse-sensitivity-${{ github.run_id }}
          path: wcvp_collapse_sensitivity
          if-no-files-found: error
          retention-days: 90
