name: V4 S1 EAzami continuous Brownian branches on two TRUE nuclear species trees
on:
  workflow_dispatch:
  push:
    branches: [codex/v4-native-integration-workflow]
    paths:
      - 'analysis/v4/t2_true_nuclear_S1_continuous_eazami_brownian_fourclimate.py'
      - 'tests/test_v4_t2_true_nuclear_S1_continuous_eazami_brownian_fourclimate.py'
      - '.github/workflows/v4-t2-s1-real-nuclear-eazami-continuous-four-climate-branches.yml'
permissions:
  contents: read
  actions: read
jobs:
  same-S1-trait-real-two-nuclear-molecular-Brownian-branches:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: .
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install genuine S1 source photo nuclear Brownian branch environment
        run: |
          python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2' \
             'biopython>=1.83,<2' 'pandas>=2.1,<3' pytest
      - name: Unit tests continuous photo trait and genuine source-based nuclear trees
        run: |
          python -m pytest -q \
            tests/test_v4_t2_true_nuclear_S1_continuous_eazami_brownian_fourclimate.py \
            tests/test_v4_t2_s1_continuous_genuine_nuclear_two_tree_clustering.py \
            tests/test_v4_t2_world_s1_fouraxis_eazami_brownian_branch_regime.py
      - name: Recover original true S1 photo observations and real four-axis climate pixel source
        run: |
          set -euo pipefail
          mkdir -p work/nuclear/source251 work/nuclear/four work/nuclear/out
          test "$(gh api repos/zuizui0223/azami/actions/artifacts/12421842342 --jq .digest)" = \
           'sha256:2b3fff23a280341c81c2d9c95fc2b99c55ccd22458b530f3d4b7e3c451ebe57d'
          test "$(gh api repos/zuizui0223/azami/actions/artifacts/12548594169 --jq .digest)" = \
           'sha256:8b19d76a695f3773d54885c637fcf7ed52445f615e9dae8501305a40e05327f5'
          gh run download 39769949628 --repo zuizui0223/azami \
            --name v4-t2-S1-all251-original-source-name-resolved --dir work/nuclear/source251
          gh run download 40064998009 --repo zuizui0223/azami \
            --name v4-real-original-S1-S2-BIO18-BIO5-RSDS-elevation --dir work/nuclear/four
          echo '47b32972b20564ade163907ef6fdf3eb2a69f8b42c8d87b8cf4ea75ca1682dc1  work/nuclear/source251/S1_ALL_251_SOURCE_NAME_BY_ACCEPTED_KEY_MEASUREMENTS.csv' | sha256sum -c -
          echo '823ecb8442eb03598253cb33f3e16bac86538c6c2652f48ca2dc0886d0e19626  work/nuclear/four/S1_ORIGINAL_251_TAXON_MEAN_NEW_BIO18_BIO05_RSDS_ELEVATION.csv' | sha256sum -c -
      - name: Apply real EAzami Brownian squared-change ancestral environmental score to original S1 continuous photo angles on true DNA species trees
        run: |
          python -m analysis.v4.t2_true_nuclear_S1_continuous_eazami_brownian_fourclimate \
            --original251 work/nuclear/source251/S1_ALL_251_SOURCE_NAME_BY_ACCEPTED_KEY_MEASUREMENTS.csv \
            --newfour work/nuclear/four/S1_ORIGINAL_251_TAXON_MEAN_NEW_BIO18_BIO05_RSDS_ELEVATION.csv \
            --permutations 9999 \
            --out work/nuclear/out/T2_EAzami_BROWNIAN_ORIGINAL_S1_CONTINUOUS_TRUE_NA_JAPAN_MULTILOCUS_FOUR_CLIMATE.json
          git rev-parse HEAD > work/nuclear/out/AUTHENTIC_S1_SOURCE_COMMIT.txt
      - name: Distinguish botanical U to D CTMC, S1 continuous Brownian and grafted phylogenies
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('work/nuclear/out')
          x=json.loads((root/'T2_EAzami_BROWNIAN_ORIGINAL_S1_CONTINUOUS_TRUE_NA_JAPAN_MULTILOCUS_FOUR_CLIMATE.json').read_text())
          assert x['S1_angular_outcome_is_CONTINUOUS_and_NOT_EAzami_discrete_U_D']
          assert x['true_independent_multilocus_nuclear_species_tree_panels']==2
          assert x['n_true_multi_locus_species_total']==54
          assert x['no_plant_flora_botanical_U_D_or_chloroplast_or_ITS_primary_tree']
          assert x['same_original_S1_site_four_environment_complete_head_photos']==169020
          assert set(x['axes'])=={'chelsa_bio18','chelsa_bio05','chelsa_rsds_mean','elevation_m'}
          assert x['panels']['NorthAmerica_true_nuclear42']['n_authentic_original_nuclear_S1_taxa']==42
          assert x['panels']['Japan_true_176loci_nuclear12']['n_authentic_original_nuclear_S1_taxa']==12
          assert x['panels']['NorthAmerica_true_nuclear42']['n_photo10_tips']==40
          assert x['panels']['Japan_true_176loci_nuclear12']['comparison']['original_S1_photo_min10']['status']=='STOP_TOO_FEW_GENUINE_MULTILOCUS_TIPS'
          for panel in x['panels'].values():
              for scope in ('all_edges','internal_edges'):
                  r=panel['comparison'][scope]
                  assert r['n_original_tree_placement_scenarios']==1
                  assert r['n_continuous_photo_tip_permutations']==9999
                  assert r['not_Mk_transition_model_or_botanical_U_D']
                  assert 0<r['BIO18_positive_direction_one_sided_fraction']<=1
                  assert len(r['four_axis_maxT_fraction'])==4
          print('PASS_TWO_AUTHENTIC_NUCLEAR_TREES_ORIGINAL_S1_CONTINUOUS_BROWNIAN_BRANCH_CLIMATE')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-S1-real-NA42-Japan12-continuous-EAzami-Brownian-4climate-branches
          path: work/nuclear/out/
          retention-days: 90
          if-no-files-found: warn
