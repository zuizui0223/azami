name: V4 full native climate inputs
on:
  pull_request:
    paths:
      - 'analysis/v4/native_climate_cache.py'
      - 'analysis/v4/native_climate_cells.json'
      - 'tests/test_v4_native_climate_cache.py'
      - '.github/workflows/v4-native-climate-cache.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v4-native-climate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  climate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        variable: [bio01, bio04, bio12, bio15, rsds_mean, vpd_mean, sfcwind_mean, gsp, npp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=2,<3' 'rasterio>=1.4,<2' requests pytest
      - name: Test source identity and exact pixel extraction
        run: python -m pytest -q tests/test_v4_native_climate_cache.py
      - name: Acquire source raster and losslessly cache occupied cells
        run: >-
          python -m analysis.v4.native_climate_cache
          --variable '${{ matrix.variable }}'
          --cells analysis/v4/native_climate_cells.json
          --out-dir 'work/native-climate/${{ matrix.variable }}'
      - name: Preserve native footprint raster tiles and source receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-native-climate-${{ matrix.variable }}
          path: work/native-climate/${{ matrix.variable }}/
          compression-level: 0
          retention-days: 30
          if-no-files-found: warn
