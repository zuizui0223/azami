name: Chapter 1 v3 environment source pilot

on:
  push:
    branches: [revision/ch1-v3-20260907]
    paths:
      - .github/workflows/ch1-v3-environment-source-pilot.yml
      - analysis/v3/environment_exposure_contract.json
      - analysis/v3/environment_matrix.py
      - analysis/v3/recover_revision_inputs.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install environment extraction stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,full]'
      - name: Recover frozen full-source metadata snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p source
          python - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          from analysis.v3.recover_revision_inputs import download
          archive = Path('source/metadata.zip')
          download(8066010557, archive, '2f216652602a0b3c42b64780d9b31a3ecb2e7fc1300b28b303e8c369b31884ae')
          with zipfile.ZipFile(archive) as z:
              data = z.read('photo_metadata_merged.csv')
          if hashlib.sha256(data).hexdigest() != '506917aef9a9452dddcf373acfb941e9f3620ba9740ef588cbcf8725557828e4':
              raise SystemExit('metadata member hash mismatch')
          Path('source/photo_metadata_merged.csv').write_bytes(data)
          PY
      - name: Build phenotype-blind month-balanced engineering sample
        run: |
          python - <<'PY'
          import hashlib
          import pandas as pd
          src = pd.read_csv('source/photo_metadata_merged.csv', low_memory=False)
          cols = {'obs_id','observed_on','latitude','longitude','coordinate_usable_for_environment'}
          if not cols.issubset(src.columns):
              raise SystemExit('required metadata columns unavailable: ' + str(sorted(cols-set(src.columns))))
          x = src[list(cols)].copy()
          x['observed_on'] = pd.to_datetime(x['observed_on'], errors='coerce')
          x['latitude'] = pd.to_numeric(x['latitude'], errors='coerce')
          x['longitude'] = pd.to_numeric(x['longitude'], errors='coerce')
          usable = x['coordinate_usable_for_environment'].astype(str).str.lower().isin({'true','1','yes'})
          x = x.loc[usable & x['observed_on'].notna() & x['latitude'].between(-90,90) & x['longitude'].between(-180,180)].copy()
          x['observation_month'] = x['observed_on'].dt.month.astype(int)
          x = x.sort_values(['obs_id','observed_on']).drop_duplicates('obs_id', keep='first')
          x['hash'] = x['obs_id'].astype(str).map(lambda s: hashlib.sha256(s.encode()).hexdigest())
          pilot = x.sort_values(['observation_month','hash']).groupby('observation_month', group_keys=False).head(2)
          if set(pilot['observation_month']) != set(range(1,13)):
              raise SystemExit('pilot lacks one or more months')
          pilot[['obs_id','latitude','longitude','observation_month']].to_csv('source/environment_pilot_observations.csv', index=False)
          print({'pilot_rows':len(pilot),'months':pilot['observation_month'].value_counts().sort_index().to_dict()})
          PY
      - name: Sample direct monthly and broad CHELSA representations
        run: |
          python -m analysis.v3.environment_matrix \
            --observations source/environment_pilot_observations.csv \
            --out-dir pilot_output \
            --allow-nonnative-pilot \
            --variables \
              pr_month tas_month tasmax_month rsds_month vpd_month sfcWind_month \
              BIO1 BIO4 BIO12 BIO15 BIO18 GSP
      - name: Enforce engineering-only boundary and inspect hydric redundancy
        run: |
          python - <<'PY'
          import json, pandas as pd
          report = json.load(open('pilot_output/environment_diagnostics.json'))
          assert report['engineering_pilot_only'] is True
          assert report['representation_may_be_frozen_from_this_run'] is False
          assert report['trait_columns_read'] == 0
          assert report['n_rows'] == 24
          corr = pd.read_csv('pilot_output/environment_correlations.csv')
          target = {'pr_month','BIO12','BIO18','GSP'}
          hydric = corr[(corr['method']=='pearson') & corr['variable_a'].isin(target) & corr['variable_b'].isin(target)]
          print({'matrix': report['matrix'], 'redundancy_components': report['redundancy_components']})
          print(hydric.to_string(index=False))
          PY
          rm -f pilot_output/environment_candidate_matrix.csv
          rm -rf source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ch1-v3-environment-source-pilot-${{ github.run_id }}
          path: pilot_output
          if-no-files-found: error
          retention-days: 30
