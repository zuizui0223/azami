name: V4 T2 exact EAzami U D CTMC branch transitions S1 S2 four climates
on:
  workflow_dispatch:
  push:
    branches: [codex/v4-native-integration-workflow]
    paths:
      - 'analysis/v4/t2_eazami_h1_original_transition_s1s2_fourclimate.py'
      - 'tests/test_v4_t2_eazami_h1_original_transition_s1s2_fourclimate.py'
      - '.github/workflows/v4-t2-eazami-original-h1-ctmc-s1s2-fourclimate.yml'
permissions:
  contents: read
  actions: read
jobs:
  original-eazami-six-true-nuclear-CTMC-Brownian-state-maps:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: .
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install EXACT statistical CTMC, Brownian, raster source dependencies
        run: |
          python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'pandas>=2.1,<3' \
            'biopython>=1.83,<2' 'rasterio>=1.4,<2' 'requests>=2.32,<3' 'pytest>=8,<10'
      - name: Unit test original source constraints and exact map null
        run: python -m pytest -q tests/test_v4_t2_eazami_h1_original_transition_s1s2_fourclimate.py
      - name: Retrieve EAzami ORIGINAL AUTHOR transition implementation, 6 true nuclear AU trees, U D taxon authority
        run: |
          set -euo pipefail
          mkdir -p work/EAzami/author work/EAzami/japan work/EAzami/taiwan \
                   work/raster-public work/rsds/chelsa_rsds_mean work/result work/private
          ROOT="https://raw.githubusercontent.com/zuizui0223/EAzami/c9870e91604ed1514344ddc8f765eae5237dbf27"
          curl -fLsS --retry 3 "$ROOT/analysis/run_chapter2_orientation_transition_regime_hypothesis_v1.py" \
            -o work/EAzami/author/original_H1.py
          curl -fLsS --retry 3 "$ROOT/data/evidence/comp1061_six_au_nonrejected_trees_v1.nwk" \
            -o work/EAzami/author/six_AU_nuclear_trees.nwk
          curl -fLsS --retry 3 "$ROOT/data/evidence/orientation_comp1061_20tip_source_crosswalk_v1.csv" \
            -o work/EAzami/author/original_botanical_U_D.csv
          curl -fLsS --retry 3 "$ROOT/data/evidence/chapter2_orientation_occurrence_coverage_audit_result_v1.json" \
            -o work/EAzami/author/original_taxon_coverage.json
          curl -fLsS --retry 3 "$ROOT/data/evidence/chapter2_orientation_transition_regime_hypothesis_contract_v1.json" \
            -o work/EAzami/author/original_method_contract.json
          curl -fLsS --retry 3 "$ROOT/data/evidence/fdt4_branchwise_niche_transition_concordance_v1.json" \
            -o work/EAzami/author/original_legacy_method.json
          curl -fLsS --retry 3 "$ROOT/data/evidence/chapter2_orientation_transition_regime_hypothesis_result_v1.json" \
            -o work/EAzami/author/original_20260904_H1_result.json
          test "$(git hash-object work/EAzami/author/original_H1.py)" = "09731b563907b3ec2778ea04086d729771376f7e"
          test "$(git hash-object work/EAzami/author/six_AU_nuclear_trees.nwk)" = "d7f8c0b96ee9c257c815db06a5a0aa9fdae4841e"
          test "$(git hash-object work/EAzami/author/original_botanical_U_D.csv)" = "f655544e77f1659323c1e915567dacbb51b01cc3"
          test "$(git hash-object work/EAzami/author/original_taxon_coverage.json)" = "47e97cb35d241c0dcba8cb9c844038b568db03d5"
          test "$(git hash-object work/EAzami/author/original_method_contract.json)" = "59acc74cbcace6da78226c62fc976c0e543f0225"
          test "$(git hash-object work/EAzami/author/original_legacy_method.json)" = "5cb259ee373b33c1f16032b3ff9bbfd699913826"
          test "$(git hash-object work/EAzami/author/original_20260904_H1_result.json)" = "fb7992e683301ddf307be3ab7be35a2f246dddde"
          test "$(gh api repos/zuizui0223/EAzami/actions/artifacts/9516784077 --jq .digest)" = \
            'sha256:cb5717c90cbc769398f9ffce38787704a02e34253c1ff16cf8f368ba55aeda96'
          test "$(gh api repos/zuizui0223/EAzami/actions/artifacts/9520157997 --jq .digest)" = \
            'sha256:819936ceeb6008f356c580622fb72972617700402afaa3d3ab125bff2e6d9106'
          gh run download 32716015605 --repo zuizui0223/EAzami \
            --name fdt4-japan-orientation-niche-v1 --dir work/EAzami/japan
          gh run download 32725842871 --repo zuizui0223/EAzami \
            --name fdt4-taiwan-orientation-niche-v1 --dir work/EAzami/taiwan
          test -s work/EAzami/japan/focal_occurrences_environment_complete.csv
          test -s work/EAzami/taiwan/focal_occurrences_environment_complete.csv
      - name: Reproduce original EAzami frozen BIO1 BIO15 method at fixed n10 and n5 (abort if different)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from analysis.v4 import t2_eazami_h1_original_transition_s1s2_fourclimate as src
          w=Path("work/EAzami/author")
          h1=src.load_original_python(w/"original_H1.py")
          trees,o,c,k,l,r=src.frozen(h1,{
            "trees":w/"six_AU_nuclear_trees.nwk",
            "orientation":w/"original_botanical_U_D.csv",
            "coverage":w/"original_taxon_coverage.json",
            "contract":w/"original_method_contract.json",
            "legacy":w/"original_legacy_method.json",
            "reference":w/"original_20260904_H1_result.json"})
          old,check=src.original_occurrences(
            "work/EAzami/japan/focal_occurrences_environment_complete.csv",
            "work/EAzami/taiwan/focal_occurrences_environment_complete.csv",
            h1,trees,o,c,k,l,r)
          Path("work/result/EAzami_ORIGINAL_H1_METHOD_REPRODUCTION_RECEIPT.json").write_text(
            json.dumps(check,indent=2,sort_keys=True)+"\n")
          print("OLD_EAZAMI_CTMC_H1_REPRODUCED="+json.dumps({
              "n_source_occurrences":len(old),
              "n_accepted_nuclear_trees":len(trees),
              "old_n5_composite_median":check["old_n5_six_AU_observed_composite_median"],
              "legacy_method_status":check["status"]},sort_keys=True))
          assert check["status"]=="ORIGINAL_EAZAMI_FROZEN_CTMC_BROWNIAN_REPRODUCED"
          PY
      - name: Recover 1981-2010 original S1 S2 three physical rasters and SHA-checked original RSDS cache
        run: |
          set -euo pipefail
          python -m analysis.v4.s1_s2_real_bio18_bio05_rsds_elevation \
            --stage download --source-root work/raster-public
          echo '90078d99eeb0b08dd1a115a5ffa60b7c19e5849686854db950283cbac9d3817d  work/raster-public/CHELSA_bio05_1981-2010_V.2.1.tif' | sha256sum -c -
          echo '68b0b1cb905cdf6972364e947e137f714a68d287f38863b1516161a2a4bbd7ec  work/raster-public/CHELSA_bio18_1981-2010_V.2.1.tif' | sha256sum -c -
          echo '8b9ac1eddbb1e51ea4aa860f637a5ec30096e1668a85303febe0d91abf901017  work/raster-public/wc2.1_30s_elev.zip' | sha256sum -c -
          echo '1d57ce9fd3584cea6a227396bc75ef88522fd5346e8487c17370885c0499716e  work/raster-public/wc2.1_30s_elev.tif' | sha256sum -c -
          gh api repos/zuizui0223/azami/actions/artifacts/12242917323/zip > work/private/RSDS-original-source.zip
          echo '2193bd04b979f6684f7bce7c670074af63072d270a20c4dc2fd0bd5934862df4  work/private/RSDS-original-source.zip' | sha256sum -c -
          unzip -q work/private/RSDS-original-source.zip -d work/rsds/chelsa_rsds_mean
      - name: EXACT EAzami original U to D CTMC x Brownian 4 climate branch shifts with 792/1716 finite U D maps and region-control null
        run: |
          python -m analysis.v4.t2_eazami_h1_original_transition_s1s2_fourclimate \
            --h1 work/EAzami/author/original_H1.py \
            --trees work/EAzami/author/six_AU_nuclear_trees.nwk \
            --orientation work/EAzami/author/original_botanical_U_D.csv \
            --coverage work/EAzami/author/original_taxon_coverage.json \
            --contract work/EAzami/author/original_method_contract.json \
            --legacy work/EAzami/author/original_legacy_method.json \
            --reference work/EAzami/author/original_20260904_H1_result.json \
            --jp work/EAzami/japan/focal_occurrences_environment_complete.csv \
            --tw work/EAzami/taiwan/focal_occurrences_environment_complete.csv \
            --rasters work/raster-public \
            --rsds work/rsds \
            --rsds-meta analysis/v4/environment_source_metadata.json \
            --out work/result
          git rev-parse HEAD > work/result/SOURCE_GITHUB_COMMIT.txt
      - name: Verify exact original H1 semantics with no fake S1 photo or historical adaptive claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("work/result")
          data=json.loads((root/"EAzami_S1S2_BIO18_BIO05_RSDS_ELEV_CTMC_BRANCHWISE_RESULTS.json").read_text())
          assert data["original_EAzami_frozen_H1_method"]["status"]=="ORIGINAL_EAZAMI_FROZEN_CTMC_BROWNIAN_REPRODUCED"
          assert data["original_EAzami_frozen_H1_method"]["n_original_occurrences"]==748
          x=data["original_H1_BIO15up_BIO1down_recomputed_on_same_689_sites"]
          assert x["original_n_Japan_Taiwan"]>600
          assert x["n_original_4climate_complete_sites_entire_14_taxon_universe"]==689
          assert x["matched_fourclimate_exact_rank"]["n_maps"]==792
          assert x["old_data_are_biological_states_not_camera_head_angle"]
          assert data["frozen_panels_exact_maps"]["n5_primary"]["n_exact_state_maps"]==792
          assert data["frozen_panels_exact_maps"]["n3_sensitivity"]["n_exact_state_maps"]==1716
          assert data["frozen_panels_exact_maps"]["n10_strict_sensitivity"]["n_exact_state_maps"]==126
          assert data["frozen_panels_exact_maps"]["n5_region_frequency_preserving_stress"]["n_exact_state_maps"]==336
          assert set(data["new_S1_S2_four_climate_exposures"])=={
            "chelsa_bio18","chelsa_bio05","chelsa_rsds_mean","elevation_m"}
          assert data["original_continuous_photo_angle_not_used_as_U_D"]
          assert data["no_S1_photo_angle_effect_estimated_here"]
          assert data["source_observation_coordinates_NOT_in_public_outputs"]
          assert data["no_true_gravity_referenced_photographs_inferred"]
          assert (root/"EAzami_ORIGINAL_TAXON_CENTROIDS_S1S2_4AXIS.csv").stat().st_size>100
          for key in ("n5_primary","n3_sensitivity","n10_strict_sensitivity"):
              result=data["frozen_panels_exact_maps"][key]
              assert len(result["axis_effects"])==4
              assert result["n_accepted_comp1061_nuclear_topologies"]==6
              assert result["number_observed_state_maps"]==1
              assert all(v["finite_permutation_exact_rank_not_independent_biological_p_value"]
                         for v in result["axis_effects"].values())
          print("PASS_EAzami_TRUE_ORIGINAL_CTMC_BROWNIAN_FOUR_AXES_N5_N3_N10_WITH_OLD_BENCHMARK")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-exact-EAzami-CTMC-UD-transition-BIO18-BIO05-RSDS-elevation
          path: work/result/
          retention-days: 90
          if-no-files-found: warn
