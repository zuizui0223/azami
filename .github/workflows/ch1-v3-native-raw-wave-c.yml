name: Chapter 1 v3 native raw measurement wave C

on:
  push:
    branches: [revision/ch1-v3-20260907]
    paths:
      - analysis/v3/native_measurement_wave_20260908_c.json
      - .github/workflows/ch1-v3-native-raw-wave-c.yml
  workflow_dispatch:

permissions:
  contents: write # Only assets on the existing UNPUBLISHED numerical draft.
  actions: read # Pinned detector artifact.

jobs:
  measure:
    if: github.repository == 'zuizui0223/azami' && github.ref == 'refs/heads/revision/ch1-v3-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        chunk: [c000018, c000019, c000020, c000021, c000022, c000023, c000024, c000025, c000026, c000027, c000028, c000029, c000030, c000031, c000032, c000033, c000034, c000035, c000036, c000037, c000038, c000039, c000040, c000041, c000042, c000043, c000044, c000045, c000046, c000047, c000048, c000049, c000050, c000051, c000052, c000053, c000054, c000055, c000056, c000057, c000058, c000059, c000060, c000061, c000062, c000063, c000064, c000065, c000066, c000067, c000068, c000069, c000070, c000071, c000072, c000073, c000074, c000075, c000076, c000077, c000078, c000079, c000080, c000081, c000082, c000083, c000084, c000085, c000086, c000087, c000088, c000089, c000090, c000091, c000092, c000093, c000094, c000095, c000096, c000097, c000098, c000099, c000100, c000101, c000102, c000103, c000104, c000105, c000106, c000107, c000108, c000109, c000110, c000111, c000112, c000113, c000114, c000115, c000116, c000117, c000118, c000119, c000120, c000121, c000122, c000123, c000124, c000125, c000126, c000127, c000128, c000129, c000130, c000131, c000132, c000133, c000134, c000135, c000136, c000137, c000138, c000139, c000140, c000141, c000142, c000143, c000144, c000145]
    concurrency:
      group: v3-native-11831c6ad28ccaba-${{ matrix.chunk }}
      cancel-in-progress: false
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: reproducibility/v3-image-cpu-requirements.txt
      - name: Install pinned CPU measurement runtime
        run: |
          python -m pip install torch==2.11.0+cpu torchvision==0.26.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r reproducibility/v3-image-cpu-requirements.txt requests==2.34.2
      - name: Test chunk conservation, checkpoint recovery and protected transport
        run: |
          python -m pytest -q tests/test_v3_measurement_chunks.py tests/test_v3_cloud_measurement_chunks.py tests/test_v3_reconciled_photo_schedule.py tests/test_v3_protected_artifacts.py tests/test_v3_private_replay.py
      - name: Measure only missing photo units and preserve numerical results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m analysis.v3.cloud_measurement_chunks \
            --batch analysis/v3/native_measurement_wave_20260908_c.json \
            --chunk '${{ matrix.chunk }}' \
            --out "$RUNNER_TEMP/v3-native-${{ matrix.chunk }}"
      - uses: actions/upload-artifact@v4
        with:
          name: v3-native-${{ matrix.chunk }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v3-native-${{ matrix.chunk }}/measurement/public_report.json
          if-no-files-found: error
          retention-days: 30
      # Source images exist only in temporary memory. Numerical payloads,
      # links and partial units must never enter public artifacts or logs.
      # No ecological join, release publication or automatic full-cohort fan-out.
