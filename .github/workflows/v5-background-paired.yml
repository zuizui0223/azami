name: V5 region-specific background-corrected climate vs head overlap

on:
  push:
    branches:
      - codex/v5-climate-head-overlap-20261109
    paths:
      - analysis/v5/background_paired_overlap.py
      - tests/test_v5_background_paired_overlap.py
      - .github/workflows/v5-background-paired.yml
  pull_request:
    branches:
      - main
    paths:
      - analysis/v5/background_paired_overlap.py
      - tests/test_v5_background_paired_overlap.py
      - .github/workflows/v5-background-paired.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: azami-v5-bg-paired-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source_background_pair_test:
    # Original photo metadata and colour measurements remain in the private
    # runner; export only aggregate statistics and source-hash receipts.
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: .
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific packages and pytest
        run: |
          python -m pip install --disable-pip-version-check \
            'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scipy>=1.11,<2' \
            'statsmodels>=0.14,<1' 'cryptography>=46,<49' \
            'shapely>=2,<3' 'rasterio>=1.4,<2' 'requests>=2.31,<3' \
            'scikit-learn>=1.4,<2' 'pytest>=8,<10'
      - name: Run source-free unit tests
        run: |
          python -m pytest -q tests/test_v5_background_paired_overlap.py
          python -m py_compile analysis/v5/background_paired_overlap.py
      - name: Restore SHA-verified encrypted originals and WCVP authority privately
        run: |
          set -euo pipefail
          mkdir -p work/submission/private work/submission/public
          gh api -H "Accept: application/octet-stream" \
            repos/zuizui0223/azami/releases/assets/658986481 \
            > work/submission/private/original-metadata.aesgcm
          echo 'dfa98fa162a8029cb6477adf4c26ffc5819cc916a0513d32da14d78d845ab4b0  work/submission/private/original-metadata.aesgcm' | sha256sum -c -
          gh api -H "Accept: application/octet-stream" \
            repos/zuizui0223/azami/releases/assets/659010325 \
            > work/submission/private/original-measurements.aesgcm
          echo '111c8fb668265a623c948b635dea68b5182f0a2be04d91ec03bda056b608eb60  work/submission/private/original-measurements.aesgcm' | sha256sum -c -
          gh api repos/zuizui0223/azami/actions/artifacts/12244160272/zip \
            > work/submission/private/authority350.zip
          echo 'ec0e3b67c2fb81d4d1dd8a9215585e4523abcb8085959854ec80dc826a56ca1  work/submission/private/authority350.zip' | sha256sum -c -
      - name: Calculate background-corrected regional climate D vs matching head D
        env:
          AZAMI_METADATA_KEY: ${{ secrets.AZAMI_METADATA_KEY }}
          AZAMI_MEASUREMENTS_KEY: ${{ secrets.AZAMI_MEASUREMENTS_KEY }}
        run: |
          set -euo pipefail
          python -m analysis.v5.background_paired_overlap
      - name: Upload aggregate-only verified output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v5-background-regional-paired-aggregate
          path: work/submission/public/v5_background_paired_overlap_summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove restored confidential files
        if: always()
        run: |
          rm -rf work/submission/private
