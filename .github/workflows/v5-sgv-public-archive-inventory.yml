name: V5 public standing-variation archive inventory
on:
  push:
    branches: [analysis/phenotype-surplus-20261126]
    paths: ['analysis/v5/sgv_public_archive_inventory.py','tests/test_v5_sgv_public_archive_inventory.py','.github/workflows/v5-sgv-public-archive-inventory.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas requests pytest ruff
      - run: |
          python -m ruff check --select F821 analysis/v5/sgv_public_archive_inventory.py
          python -m pytest -q tests/test_v5_sgv_public_archive_inventory.py
      - run: python -m analysis.v5.sgv_public_archive_inventory
      - uses: actions/upload-artifact@v4
        with:
          name: v5-sgv-public-archive-inventory
          path: work/public_sgv_inventory/
          if-no-files-found: error
