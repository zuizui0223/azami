name: V5 CHELSA BIO10 source SHA and georeference audit
on:
  pull_request:
    branches:
      - main
    paths:
      - analysis/v5/bio10_source_audit.py
      - .github/workflows/v5-bio10-source-audit.yml
  push:
    branches:
      - codex/v5-climate-head-overlap-20261109
    paths:
      - analysis/v5/bio10_source_audit.py
      - .github/workflows/v5-bio10-source-audit.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v5-bio10-source-${D}{{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install raster parsing and HTTPS
        run: python -m pip install --disable-pip-version-check 'rasterio>=1.4,<2' 'requests>=2.31,<3'
      - name: SHA-256 and original-raster georeference audit
        run: python -m analysis.v5.bio10_source_audit
      - uses: actions/upload-artifact@v4
        with:
          name: azami-v5-bio10-source-receipt
          path: work/submission/public/v5_bio10_source_receipt.json
          retention-days: 90
          if-no-files-found: error
      - name: Remove source TIFF
        if: always()
        run: rm -rf work/submission/private
