name: Chapter 1 native-primary v2 reuse reanalysis

on:
  push:
    paths:
      - 'analysis/v3/run_native_primary_from_v2.py'
      - 'analysis/v3/recover_display_composition.py'
      - 'analysis/v3/rebuild_exact_native_status_from_frozen_aux.py'
      - 'analysis/v3/select_native_environment_vifstep10.py'
      - 'analysis/v3/run_v2_full27_selected_predictors.py'
      - 'analysis/sample_chelsa_process_environment.py'
      - 'analysis/run_geb_v2_full27_spatial_sensitivity.py'
      - 'analysis/run_geb_v2_full27_historical_sensitivity.py'
      - '.github/workflows/ch1-v3-native-primary.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-primary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen v2 numerical runtime
        run: |
          python -m pip install \
            pandas==3.0.5 numpy==2.4.6 scipy==1.17.1 statsmodels==0.14.6 \
            rasterio==1.4.4 pyproj==3.7.2 requests==2.34.2 shapely==2.1.2 \
            biopython==1.85
      - name: Recover frozen v2 continuous source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work/continuous
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9612943217/zip > work/continuous.zip
          echo '101e996b638996a0c5ae79d358bf51293c3585f0e84c4a961b91dcbedf96211e  work/continuous.zip' | sha256sum -c -
          unzip -q work/continuous.zip -d work/continuous
          test -f work/continuous/universe/continuous_trait_universe_observation_long.csv
          test -f work/continuous/environment/strict_spatial_chelsa.csv
          echo '2172e3570f684770d0f919ecd81265c8460574e287bc4fb057db4f719cab7bb0  work/continuous/environment/strict_spatial_chelsa.csv' | sha256sum -c -
      - name: Regenerate frozen-v2 native cohort from frozen auxiliary tables
        run: |
          set -euo pipefail
          mkdir -p work/native
          git fetch --depth=1 origin refs/tags/azami-ch1-v2-2026-08-27:refs/tags/azami-ch1-v2-2026-08-27
          test "$(git rev-parse azami-ch1-v2-2026-08-27:analysis_outputs/native_range_sensitivity_v1/wcvp_name_resolution.csv)" = '467bcb3e52204542aa96eea6a25f9b10539b1d3c'
          test "$(git rev-parse azami-ch1-v2-2026-08-27:analysis_outputs/native_range_sensitivity_v1/wcvp_distribution_records.csv)" = '690247722d2c389d367ede356178e23bec42628f'
          git show azami-ch1-v2-2026-08-27:analysis_outputs/native_range_sensitivity_v1/wcvp_name_resolution.csv > work/native/wcvp_name_resolution.csv
          git show azami-ch1-v2-2026-08-27:analysis_outputs/native_range_sensitivity_v1/wcvp_distribution_records.csv > work/native/wcvp_distribution_records.csv
          python analysis/v3/rebuild_exact_native_status_from_frozen_aux.py \
            --observation work/continuous/environment/strict_spatial_chelsa.csv \
            --resolution work/native/wcvp_name_resolution.csv \
            --distributions work/native/wcvp_distribution_records.csv \
            --out-csv work/native/observation_native_status.csv \
            --report work/native/native_status_exact_rebuild_report.json
          echo '9686b8f515deef3b3aa9311b5137317a094af195e0f2414f2b1b70d7c72b5021  work/native/observation_native_status.csv' | sha256sum -c -
      - name: Recover the five historically omitted measured endpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/historical work/recovered_display
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/8269246732/zip > work/historical.zip
          echo '5f18b42d18cfcb81691c38ce0f04bcef754e6a67382025ea90110dbc50ae194b  work/historical.zip' | sha256sum -c -
          unzip -q work/historical.zip -d work/historical
          HEADS=$(find work/historical -type f -name exhaustive_continuous_head_level.csv -print -quit)
          test -n "$HEADS"
          RECOVERED_DIR="$RUNNER_TEMP/ch1-recovered-display-${GITHUB_RUN_ID}"
          rm -rf "$RECOVERED_DIR"
          python -m analysis.v3.recover_display_composition --heads "$HEADS" --out-dir "$RECOVERED_DIR"
          cp "$RECOVERED_DIR/observation_values.csv" work/recovered_display/observation_values.csv
          cp "$RECOVERED_DIR/display_composition_report.json" work/recovered_display/display_composition_report.json
          test -s work/recovered_display/observation_values.csv
      - name: Build native-only frozen core environment
        run: |
          python - <<'PY'
          import hashlib
          import pandas as pd
          core = pd.read_csv('work/continuous/environment/strict_spatial_chelsa.csv', low_memory=False)
          status = pd.read_csv('work/native/observation_native_status.csv', usecols=['obs_id','native_range_status'], low_memory=False)
          core['obs_id'] = core['obs_id'].astype(str)
          status['obs_id'] = status['obs_id'].astype(str)
          native_ids = set(status.loc[status['native_range_status'].eq('native'),'obs_id'])
          out = core.loc[core['obs_id'].isin(native_ids)].copy()
          if len(out) != 27066 or out['obs_id'].nunique() != 27066:
              raise SystemExit(f'native core cohort mismatch: rows={len(out)} unique={out["obs_id"].nunique()}')
          out.to_csv('work/native_core_environment.csv', index=False)
          h = hashlib.sha256(open('work/native_core_environment.csv','rb').read()).hexdigest()
          print({'native_core_rows': len(out), 'native_core_sha256': h})
          PY
      - name: Rebuild nine-predictor environment on native cohort only
        run: |
          python analysis/sample_chelsa_process_environment.py \
            --environment work/native_core_environment.csv \
            --source-contract analysis/ch1/chelsa_process_environment_sources.json \
            --out-csv work/native_chelsa_process.csv \
            --report work/chelsa_process_extraction_report.json
          python - <<'PY'
          import pandas as pd
          env = pd.read_csv('work/native_chelsa_process.csv', low_memory=False)
          expected = ['chelsa_bio01','chelsa_bio04','chelsa_bio12','chelsa_bio15','chelsa_rsds_mean','chelsa_vpd_mean','chelsa_sfcwind_mean','chelsa_gsp','chelsa_npp']
          if len(env) != 27066 or env['obs_id'].nunique() != 27066:
              raise SystemExit('native nine-predictor environment membership mismatch')
          missing = [c for c in expected if c not in env.columns]
          if missing:
              raise SystemExit(f'missing frozen predictors: {missing}')
          print({'native_environment_rows': len(env), 'predictors': expected})
          PY
      - name: Run native-only full-27 atlas with unchanged v2 model
        run: |
          python analysis/v3/run_native_primary_from_v2.py \
            --endpoint-contract ch1_global/v2/ontology/ch1_continuous_trait_contract.csv \
            --analysis-contract analysis/ch1/v2_full27_environment_atlas_contract.json \
            --traits-long work/continuous/universe/continuous_trait_universe_observation_long.csv \
            --environment work/native_chelsa_process.csv \
            --native-status work/native/observation_native_status.csv \
            --recovered-display work/recovered_display/observation_values.csv \
            --work-dir work/native_inputs \
            --out-dir work/native_results
      - name: Run existing v2 broad-spatial sensitivity on native results
        run: |
          python analysis/run_geb_v2_full27_spatial_sensitivity.py \
            --analysis-contract work/native_inputs/native_analysis_contract.json \
            --traits-long work/native_inputs/native_traits_long.csv \
            --environment work/native_inputs/native_environment.csv \
            --atlas-dir work/native_results \
            --out-dir work/native_results/spatial
      - name: Recover frozen historical-placement tree artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/historical_bundle
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/8227254443/zip > work/historical_trees.zip
          echo '499061e7a49f9455cf8c367fe26e313b7e0e33b2280d2354717e61a90ea8c6bc  work/historical_trees.zip' | sha256sum -c -
          unzip -q work/historical_trees.zip -d work/historical_bundle
          test -f work/historical_bundle/historical_trees/gbotb_lcvp_scenario1.tre
          test -f work/historical_bundle/historical_trees/gbotb_lcvp_scenario3.tre
          test -f work/historical_bundle/historical_trees/gbotb_lcvp_scenario2_randomized.trees
      - name: Run existing v2 historical-placement sensitivity on spatial survivors
        run: |
          python analysis/run_geb_v2_full27_historical_sensitivity.py \
            --analysis-contract work/native_inputs/native_analysis_contract.json \
            --traits-long work/native_inputs/native_traits_long.csv \
            --environment work/native_inputs/native_environment.csv \
            --spatial-dir work/native_results/spatial \
            --tree-dir work/historical_bundle/historical_trees \
            --out-dir work/native_results/historical
      - name: Select scale-specific predictors by VIFstep threshold 10
        run: |
          mkdir -p work/vif10
          python analysis/v3/select_native_environment_vifstep10.py \
            --environment work/native_inputs/native_environment.csv \
            --threshold 10 \
            --out-json work/vif10/vifstep10_report.json \
            --out-csv work/vif10/vifstep10_steps.csv
          python - <<'PY'
          import json, os
          report = json.load(open('work/vif10/vifstep10_report.json'))
          within = report['downstream_predictor_sets']['within_taxon']
          among = report['downstream_predictor_sets']['among_taxon']
          with open(os.environ['GITHUB_ENV'], 'a') as handle:
              handle.write('VIF10_WITHIN=' + ' '.join(within) + '\n')
              handle.write('VIF10_AMONG=' + ' '.join(among) + '\n')
          print({'VIF10_WITHIN': within, 'VIF10_AMONG': among})
          PY
      - name: Refit v2 full-27 within atlas on VIFstep10 predictors
        run: |
          python analysis/v3/run_v2_full27_selected_predictors.py \
            --endpoint-contract ch1_global/v2/ontology/ch1_continuous_trait_contract.csv \
            --analysis-contract work/native_inputs/native_analysis_contract.json \
            --traits-long work/native_inputs/native_traits_long.csv \
            --environment work/native_inputs/native_environment.csv \
            --out-dir work/vif10/within_atlas \
            --lane within_taxon \
            --predictors $VIF10_WITHIN
      - name: Refit v2 full-27 among atlas on VIFstep10 predictors
        run: |
          python analysis/v3/run_v2_full27_selected_predictors.py \
            --endpoint-contract ch1_global/v2/ontology/ch1_continuous_trait_contract.csv \
            --analysis-contract work/native_inputs/native_analysis_contract.json \
            --traits-long work/native_inputs/native_traits_long.csv \
            --environment work/native_inputs/native_environment.csv \
            --out-dir work/vif10/among_atlas \
            --lane among_taxon \
            --predictors $VIF10_AMONG
      - name: Assemble scale-specific VIFstep10 atlas
        run: |
          mkdir -p work/vif10/combined
          cp work/vif10/within_atlas/v2_full27_environment_within.csv work/vif10/combined/v2_full27_environment_within.csv
          cp work/vif10/among_atlas/v2_full27_environment_among.csv work/vif10/combined/v2_full27_environment_among.csv
          cp work/vif10/vifstep10_report.json work/vif10/combined/vifstep10_report.json
          cp work/vif10/vifstep10_steps.csv work/vif10/combined/vifstep10_steps.csv
      - name: Run existing v2 broad-spatial sensitivity on VIFstep10 results
        run: |
          python analysis/run_geb_v2_full27_spatial_sensitivity.py \
            --analysis-contract work/native_inputs/native_analysis_contract.json \
            --traits-long work/native_inputs/native_traits_long.csv \
            --environment work/native_inputs/native_environment.csv \
            --atlas-dir work/vif10/combined \
            --out-dir work/vif10/combined/spatial
      - name: Run existing v2 historical-placement sensitivity on VIFstep10 spatial survivors
        run: |
          python analysis/run_geb_v2_full27_historical_sensitivity.py \
            --analysis-contract work/native_inputs/native_analysis_contract.json \
            --traits-long work/native_inputs/native_traits_long.csv \
            --environment work/native_inputs/native_environment.csv \
            --spatial-dir work/vif10/combined/spatial \
            --tree-dir work/historical_bundle/historical_trees \
            --out-dir work/vif10/combined/historical
      - name: Summarize VIFstep10 reanalysis
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root = Path('work/vif10/combined')
          vif = json.load(open(root/'vifstep10_report.json'))
          within = pd.read_csv(root/'v2_full27_environment_within.csv', low_memory=False)
          among = pd.read_csv(root/'v2_full27_environment_among.csv', low_memory=False)
          sw = pd.read_csv(root/'spatial/v2_full27_spatial_within.csv', low_memory=False)
          sa = pd.read_csv(root/'spatial/v2_full27_spatial_among.csv', low_memory=False)
          hist = pd.read_csv(root/'historical/v2_full27_historical_placement_summary.csv', low_memory=False)
          def sig(frame):
              return frame[frame.status.eq('ok') & pd.to_numeric(frame.q_fdr_bh_global_family, errors='coerce').lt(0.05)].copy()
          w_sig = sig(within)
          a5_sig = sig(among[among.scope.eq('among_taxon_min5')])
          a2_sig = sig(among[among.scope.eq('among_taxon_min2')])
          passed_hist = hist[hist['historical_placement_sensitivity_pass'].fillna(False).astype(bool)].copy()
          report = {
              'analysis_id': 'native_vifstep10_full27_v2_reuse_v1',
              'native_observations': 27066,
              'within_predictors': vif['downstream_predictor_sets']['within_taxon'],
              'among_predictors': vif['downstream_predictor_sets']['among_taxon'],
              'within_fdr_signals': int(len(w_sig)),
              'among_min5_fdr_signals': int(len(a5_sig)),
              'among_min2_fdr_signals': int(len(a2_sig)),
              'within_spatial_passes': int(sw.get('broad_spatial_sensitivity_pass', pd.Series(dtype=bool)).fillna(False).astype(bool).sum()),
              'among_spatial_passes': int(sa.get('broad_spatial_sensitivity_pass', pd.Series(dtype=bool)).fillna(False).astype(bool).sum()),
              'historical_pair_rows': int(len(hist)),
              'historical_passes': int(len(passed_hist)),
              'historical_pass_pairs': passed_hist[['unit_id','predictor','inferential_unit','n_successful_placement_trees','n_placement_trees_p_lt_0_05','maximum_p_value','lambda_min','lambda_max']].to_dict('records'),
          }
          (root/'native_vifstep10_summary.json').write_text(json.dumps(report, indent=2)+'\n')
          print(json.dumps(report, indent=2))
          PY
      - name: Upload compact native-primary results
        uses: actions/upload-artifact@v4
        with:
          name: ch1-native-primary-v2-reuse-${{ github.run_id }}
          path: |
            work/native_results/**
            work/vif10/**
            work/native/native_status_exact_rebuild_report.json
            work/chelsa_process_extraction_report.json
            work/recovered_display/display_composition_report.json
          if-no-files-found: error
          retention-days: 30
