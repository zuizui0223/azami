name: Publish Chapter 1 Zenodo v3 data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-ch1-zenodo-v3-data.yml'

permissions:
  contents: read
  actions: read

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      ZENODO_ACCESS_TOKEN_PRIMARY: ${{ secrets.ZENODO_ACCESS_TOKEN }}
      ZENODO_ACCESS_TOKEN_FALLBACK: ${{ secrets.ZENODO_TOKEN }}
      FINAL_SOURCE_COMMIT: 7483ae8e20fa5df2439ad524312d3ac9a0fbf71f
      FINAL_ARTIFACT_ID: '10921221306'
      FINAL_WRAPPER_SHA256: 941c70768664ae9df82cd18f522dda9f4fd352ad723e08ad1e9a8d9e23f0996e
      FINAL_ZIP_SHA256: be57e9ba80773c97afdc200f9a3982eaa85044cfc6791b62187ccfcd41f54438
      FINAL_FILENAME: azami_ch1_v3_analysis_inputs.zip
      V2_RECORD_ID: '22295791'
      V2_RECORD_DOI: 10.5281/zenodo.22295791
      CONCEPT_DOI: 10.5281/zenodo.22295790

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require Zenodo publish token
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ZENODO_ACCESS_TOKEN_PRIMARY}" && -z "${ZENODO_ACCESS_TOKEN_FALLBACK}" ]]; then
            echo "::error::Neither ZENODO_ACCESS_TOKEN nor ZENODO_TOKEN is configured in repository Actions secrets."
            exit 78
          fi
          echo "Zenodo token secret is configured; proceeding with authorized publication."

      - name: Fetch and verify frozen final candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/zenodo-publish"
          cd "${RUNNER_TEMP}/zenodo-publish"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${FINAL_ARTIFACT_ID}/zip" > wrapper.zip
          echo "${FINAL_WRAPPER_SHA256}  wrapper.zip" | sha256sum -c -
          unzip -q wrapper.zip -d wrapper
          test -f "wrapper/${FINAL_FILENAME}"
          cp "wrapper/${FINAL_FILENAME}" "${FINAL_FILENAME}"
          echo "${FINAL_ZIP_SHA256}  ${FINAL_FILENAME}" | sha256sum -c -

      - name: Install publication client
        run: python -m pip install --disable-pip-version-check requests

      - name: Create new version, replace file, update metadata, and publish
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, time, urllib.parse
          import requests

          api = "https://zenodo.org/api"
          token = os.environ.get("ZENODO_ACCESS_TOKEN_PRIMARY") or os.environ.get("ZENODO_ACCESS_TOKEN_FALLBACK")
          if not token:
              raise SystemExit("Zenodo token missing")
          headers = {"Authorization": f"Bearer {token}"}
          json_headers = {**headers, "Content-Type": "application/json"}
          base_id = int(os.environ["V2_RECORD_ID"])
          expected_doi = os.environ["V2_RECORD_DOI"]
          concept_doi = os.environ["CONCEPT_DOI"]
          file_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "zenodo-publish" / os.environ["FINAL_FILENAME"]

          def require(resp, ok, label):
              if resp.status_code not in ok:
                  raise RuntimeError(f"{label}: HTTP {resp.status_code}: {resp.text[:2000]}")
              return resp

          # Validate that the authenticated account owns the published v2 deposition.
          r = requests.get(f"{api}/deposit/depositions/{base_id}", headers=headers, timeout=60)
          if r.status_code != 200:
              # Fallback: locate the owned published deposition by DOI/concept identity.
              rr = require(
                  requests.get(
                      f"{api}/deposit/depositions",
                      headers=headers,
                      params={"status": "published", "all_versions": "true", "size": 100, "sort": "-mostrecent"},
                      timeout=60,
                  ),
                  {200},
                  "list owned depositions",
              )
              matches = []
              for dep in rr.json():
                  dep_doi = dep.get("doi") or dep.get("metadata", {}).get("doi")
                  concept = dep.get("conceptdoi") or dep.get("metadata", {}).get("conceptdoi")
                  if dep_doi == expected_doi or concept == concept_doi or str(dep.get("conceptrecid","")) == "22295790":
                      matches.append(dep)
              if not matches:
                  raise RuntimeError(
                      "Authenticated Zenodo account cannot access the v2 deposition and no owned matching concept was found."
                  )
              # Use the newest matching published deposition as the new-version parent.
              parent = sorted(matches, key=lambda x: x.get("modified",""))[-1]
              base_id = int(parent["id"])
          else:
              parent = r.json()

          if parent.get("submitted") is not True and parent.get("state") != "done":
              raise RuntimeError(f"Zenodo parent deposition {base_id} is not published")

          # Select only a real unpublished draft. Zenodo's published v2
          # representation currently exposes links.latest_draft pointing back to
          # the published deposition itself, so links.latest_draft alone is not
          # sufficient evidence that a resource is a draft.
          def find_target_drafts():
              rr = require(
                  requests.get(
                      f"{api}/deposit/depositions",
                      headers=headers,
                      params={"status": "draft", "all_versions": "true", "size": 100, "sort": "-mostrecent"},
                      timeout=60,
                  ),
                  {200},
                  "list owned draft resources",
              )
              candidates = []
              for dep in rr.json():
                  concept = dep.get("conceptdoi") or dep.get("metadata", {}).get("conceptdoi")
                  conceptrecid = str(dep.get("conceptrecid", ""))
                  is_target = concept == concept_doi or conceptrecid == "22295790"
                  is_unpublished = dep.get("submitted") is False and dep.get("state") in ("unsubmitted", "inprogress")
                  if is_target and is_unpublished:
                      candidates.append(dep)
              return candidates

          candidates = find_target_drafts()
          if not candidates:
              # No true unpublished draft exists. Ask Zenodo to create one from
              # the latest published version, then discover it by state rather
              # than trusting the parent's latest_draft link.
              r = requests.post(
                  f"{api}/deposit/depositions/{base_id}/actions/newversion",
                  headers=headers,
                  timeout=60,
              )
              if r.status_code not in (201, 400):
                  require(r, {201}, "create new version")
              if r.status_code == 400 and "Please remove all files first." not in r.text:
                  require(r, {201}, "create new version")
              candidates = find_target_drafts()

          if not candidates:
              raise RuntimeError("No true unpublished draft found for target Zenodo concept after newversion")

          draft = sorted(candidates, key=lambda x: x.get("modified", ""))[-1]
          draft_id = int(draft["id"])

          # Collection/list responses can omit the full files array. Always
          # refetch the individual deposition before applying the public payload
          # boundary.
          draft = require(
              requests.get(f"{api}/deposit/depositions/{draft_id}", headers=headers, timeout=60),
              {200},
              "fetch full target draft",
          ).json()
          if draft.get("submitted") is not False or draft.get("state") not in ("unsubmitted", "inprogress"):
              raise RuntimeError(
                  f"Refusing non-draft resource {draft_id}: submitted={draft.get('submitted')}, state={draft.get('state')}"
              )
          concept = draft.get("conceptdoi") or draft.get("metadata", {}).get("conceptdoi")
          if concept != concept_doi and str(draft.get("conceptrecid", "")) != "22295790":
              raise RuntimeError(f"Draft {draft_id} is not in target concept {concept_doi}")

          # Zenodo's legacy multipart deposition-file endpoint left this
          # ~59 MB ZIP in "transfer pending" for >24 h. Prefer the newer bucket
          # Files API documented by Zenodo. Reuse an already-correct *new API*
          # file on retries; replace legacy/stale files once.
          existing_files = list(draft.get("files", []))
          local_size = file_path.stat().st_size
          local_md5 = hashlib.md5(file_path.read_bytes()).hexdigest()

          reuse_existing = False
          if len(existing_files) == 1:
              existing = existing_files[0]
              existing_name = existing.get("key") or existing.get("filename")
              server_checksum = str(existing.get("checksum") or "")
              server_md5 = server_checksum.split(":", 1)[-1] if server_checksum else None
              server_size = existing.get("size")
              if server_size is None:
                  server_size = existing.get("filesize")
              links = existing.get("links") or {}
              is_new_files_api = bool(
                  existing.get("key")
                  or existing.get("version_id")
                  or links.get("uploads")
                  or links.get("version")
              )
              checksum_ok = server_md5 in (None, "", local_md5)
              size_ok = server_size is None or int(server_size) == local_size
              if (
                  is_new_files_api
                  and existing_name == file_path.name
                  and checksum_ok
                  and size_ok
              ):
                  reuse_existing = True
                  print(
                      f"Reusing completed Zenodo bucket file {file_path.name}; "
                      f"size={local_size}, md5={local_md5}",
                      flush=True,
                  )

          if not reuse_existing:
              # Remove legacy or mismatching draft files. The target resource is
              # a verified unpublished draft in the authorized concept.
              for old_file in existing_files:
                  old_name = old_file.get("key") or old_file.get("filename")
                  if old_file.get("id"):
                      url = f"{api}/deposit/depositions/{draft_id}/files/{old_file['id']}"
                      resp = requests.delete(url, headers=headers, timeout=60)
                  else:
                      self_url = (old_file.get("links") or {}).get("self")
                      if not self_url:
                          raise RuntimeError(f"No delete URL for existing draft file {old_name!r}")
                      resp = requests.delete(self_url, headers=headers, timeout=60)
                  require(resp, {204}, f"delete existing draft file {old_name}")

              emptied = require(
                  requests.get(f"{api}/deposit/depositions/{draft_id}", headers=headers, timeout=60),
                  {200},
                  "verify emptied target draft",
              ).json()
              if emptied.get("files"):
                  raise RuntimeError(
                      "Target draft not empty after deletion: "
                      + str([f.get("key") or f.get("filename") for f in emptied["files"]])
                  )

              bucket_url = (emptied.get("links") or {}).get("bucket")
              if not bucket_url:
                  raise RuntimeError("Target Zenodo draft has no links.bucket for new Files API")
              upload_url = (
                  bucket_url.rstrip("/")
                  + "/"
                  + urllib.parse.quote(file_path.name, safe="")
              )
              with file_path.open("rb") as handle:
                  uploaded = require(
                      requests.put(
                          upload_url,
                          headers=headers,
                          data=handle,
                          timeout=600,
                      ),
                      {200, 201},
                      "upload v3 input ZIP through Zenodo bucket Files API",
                  ).json()

              uploaded_name = uploaded.get("key") or uploaded.get("filename")
              uploaded_checksum = str(uploaded.get("checksum") or "")
              uploaded_md5 = uploaded_checksum.split(":", 1)[-1] if uploaded_checksum else None
              uploaded_size = uploaded.get("size")
              if uploaded_size is None:
                  uploaded_size = uploaded.get("filesize")
              if uploaded_name != file_path.name:
                  raise RuntimeError(f"Bucket upload filename mismatch: {uploaded_name!r}")
              if uploaded_md5 not in (None, "", local_md5):
                  raise RuntimeError(
                      f"Bucket upload MD5 mismatch: {uploaded_md5}; expected {local_md5}"
                  )
              if uploaded_size is not None and int(uploaded_size) != local_size:
                  raise RuntimeError(
                      f"Bucket upload size mismatch: {uploaded_size}; expected {local_size}"
                  )
              print(
                  f"Zenodo bucket upload PASS: {uploaded_name}, "
                  f"size={local_size}, md5={local_md5}",
                  flush=True,
              )

          description = (
              "SHA-locked processed numerical inputs for reproducing the current Azami Chapter 1 v3 analysis "
              "with the separately versioned GitHub code. The archive contains only analysis inputs: continuous "
              "image-derived measurements, the nine-predictor environment input, broad-region lookup, "
              "historical-placement trees, and the frozen observation native-status table. Analysis code, "
              "manuscripts, figures, fitted/reference outputs, replay receipts, original third-party photographs, "
              "and detector training material are intentionally excluded."
          )
          metadata = {
              "metadata": {
                  "title": "Azami Chapter 1 v3 numerical analysis input package",
                  "upload_type": "dataset",
                  "description": description,
                  "creators": [{"name": "ZHANG, Ruiqi"}],
                  "version": "v3",
                  "access_right": "open",
                  "license": "cc-by-4.0",
                  "keywords": [
                      "Cirsium",
                      "image phenomics",
                      "reproducibility",
                      "trait-environment association",
                      "citizen science",
                  ],
                  "related_identifiers": [
                      {
                          "identifier": "https://github.com/zuizui0223/azami/tree/" + os.environ["FINAL_SOURCE_COMMIT"],
                          "relation": "isSupplementTo",
                          "scheme": "url",
                      }
                  ],
                  "notes": (
                      "Zenodo preserves the processed numerical input bytes. Analysis code, runbook, current "
                      "reference outputs and executable history remain in the linked GitHub repository at the pinned commit."
                  ),
              }
          }
          require(
              requests.put(
                  f"{api}/deposit/depositions/{draft_id}",
                  headers=json_headers,
                  data=json.dumps(metadata),
                  timeout=60,
              ),
              {200},
              "update v3 metadata",
          )

          # Pre-publish fail-closed check.
          draft = require(
              requests.get(f"{api}/deposit/depositions/{draft_id}", headers=headers, timeout=60),
              {200},
              "refetch draft",
          ).json()
          files = draft.get("files", [])
          draft_names = [f.get("key") or f.get("filename") for f in files]
          if len(files) != 1 or draft_names[0] != file_path.name:
              raise RuntimeError(f"Draft file boundary mismatch: {draft_names}")
          if draft.get("metadata", {}).get("title") != metadata["metadata"]["title"]:
              raise RuntimeError("Draft title mismatch before publish")

          # Irreversible action explicitly authorized by the user.
          published = None
          last_publish_response = None
          for attempt in range(60):
              resp = requests.post(
                  f"{api}/deposit/depositions/{draft_id}/actions/publish",
                  headers=headers,
                  timeout=120,
              )
              last_publish_response = resp
              if resp.status_code == 202:
                  published = resp.json()
                  break
              if resp.status_code == 400 and "files have not completed their transfer" in resp.text:
                  print(f"Zenodo transfer pending; retry {attempt + 1}/60", flush=True)
                  time.sleep(10)
                  continue
              require(resp, {202}, "publish v3")
          if published is None:
              require(last_publish_response, {202}, "publish v3 after transfer wait")

          receipt = {
              "status": "PUBLISHED",
              "parent_deposition_id": base_id,
              "draft_deposition_id": draft_id,
              "record_id": published.get("record_id"),
              "doi": published.get("doi"),
              "doi_url": published.get("doi_url"),
              "record_url": published.get("record_url"),
              "concept_doi": published.get("conceptdoi") or published.get("metadata", {}).get("conceptdoi"),
              "file": file_path.name,
              "file_sha256": os.environ["FINAL_ZIP_SHA256"],
              "github_code_commit": os.environ["FINAL_SOURCE_COMMIT"],
              "published_at_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
          }
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "zenodo-publish" / "zenodo_publish_receipt.json"
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Anonymous public redownload and checksum verification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, time, zipfile
          import requests

          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "zenodo-publish"
          receipt = json.loads((root / "zenodo_publish_receipt.json").read_text())
          record_id = receipt.get("record_id")
          if not record_id:
              raise RuntimeError("Published response lacks record_id")

          public = None
          for _ in range(36):
              r = requests.get(f"https://zenodo.org/api/records/{record_id}", timeout=60)
              if r.status_code == 200:
                  public = r.json()
                  break
              time.sleep(10)
          if public is None:
              raise RuntimeError("Published record did not become anonymously readable within 6 minutes")

          files = public.get("files", [])
          matches = [f for f in files if f.get("key") == os.environ["FINAL_FILENAME"]]
          if len(matches) != 1:
              raise RuntimeError(f"Public record file mismatch: {[f.get('key') for f in files]}")
          f = matches[0]
          url = f.get("links", {}).get("self") or f.get("links", {}).get("download")
          if not url:
              raise RuntimeError("Public file has no anonymous download link")

          out = root / "anonymous-redownload.zip"
          with requests.get(url, stream=True, timeout=600) as r:
              r.raise_for_status()
              with out.open("wb") as handle:
                  for chunk in r.iter_content(chunk_size=1024*1024):
                      if chunk:
                          handle.write(chunk)

          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          if digest != os.environ["FINAL_ZIP_SHA256"]:
              raise RuntimeError(f"Anonymous redownload SHA mismatch: {digest}")

          with zipfile.ZipFile(out) as z:
              checksum_rows = json.loads(z.read("checksums.json"))
              for row in checksum_rows:
                  actual = hashlib.sha256(z.read(row["path"])).hexdigest()
                  if actual != row["sha256"]:
                      raise RuntimeError(f"Embedded checksum mismatch: {row['path']}")
              manifest = json.loads(z.read("release_manifest.json"))
              if manifest["release_ready"] is not True or manifest["analysis_input_count"] != 5:
                  raise RuntimeError("Public manifest is not the approved final data-only surface")
              if any(manifest[k] for k in (
                  "code_included","manuscript_files_included","figures_included",
                  "reference_outputs_included","replay_receipts_included"
              )):
                  raise RuntimeError("Public manifest violated data-only boundary")

          receipt["anonymous_redownload"] = {
              "status": "PASS",
              "sha256": digest,
              "embedded_checksums": "PASS",
              "record_api": f"https://zenodo.org/api/records/{record_id}",
          }
          (root / "zenodo_publish_receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(receipt["anonymous_redownload"], indent=2))
          PY

      - name: Reproduce from anonymously downloaded Zenodo inputs
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/zenodo-publish"
          PINNED="${RUNNER_TEMP}/azami-pinned"
          git worktree add --detach "$PINNED" "$FINAL_SOURCE_COMMIT"
          cd "$PINNED"
          python -m pip install --disable-pip-version-check -r reproducibility/requirements-current.txt

          mkdir -p "$ROOT/extracted" "$ROOT/archives" "$ROOT/replay/inputs"
          unzip -q "$ROOT/anonymous-redownload.zip" -d "$ROOT/extracted"
          cp "$ROOT/extracted/inputs/artifact-9612943217-continuous.zip" "$ROOT/archives/"
          cp "$ROOT/extracted/inputs/artifact-9633419268-environment.zip" "$ROOT/archives/"
          cp "$ROOT/extracted/inputs/artifact-8983877726-spatial.zip" "$ROOT/archives/"
          cp "$ROOT/extracted/inputs/artifact-8227254443-historical.zip" "$ROOT/archives/"
          cp "$ROOT/extracted/inputs/observation_native_status.csv" "$ROOT/replay/inputs/native_status.csv"

          python -m reproducibility.run_current_analysis \
            --work-dir "$ROOT/replay" \
            --archive-dir "$ROOT/archives"

          python - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"zenodo-publish"
          receipt=json.loads((root/"zenodo_publish_receipt.json").read_text())
          validation=json.loads((root/"replay/results/validation.json").read_text())
          assert validation["status"]=="PASS"
          assert validation["aggregate_files_compared"]==16
          receipt["clean_replay"]={
              "status":"PASS",
              "aggregate_files_compared":16,
              "github_code_commit":os.environ["FINAL_SOURCE_COMMIT"],
          }
          (root/"zenodo_publish_receipt.json").write_text(
              json.dumps(receipt,indent=2,sort_keys=True)+"\n",encoding="utf-8"
          )
          print(json.dumps(receipt["clean_replay"],indent=2))
          PY

      - name: Upload publication verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: ch1-v3-zenodo-publication-receipt
          path: |
            ${{ runner.temp }}/zenodo-publish/zenodo_publish_receipt.json
            ${{ runner.temp }}/zenodo-publish/replay/results/validation.json
          if-no-files-found: error
          retention-days: 90
