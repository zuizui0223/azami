name: Ch1 environmental niche permutation null

on:
  workflow_dispatch:
    inputs:
      environment_run_id:
        description: Frozen enriched environment source run
        required: true
        default: "29306454759"
        type: string
      historical_artifact_id:
        description: Frozen historical tree/PGLS artifact
        required: true
        default: "8227254443"
        type: string
  pull_request:
    branches: [main]
    paths:
      - "analysis/permutation_test_trait_niche_contrasts.py"
      - ".github/workflows/ch1-niche-permutation-null.yml"
      - "ch1_global/v2/84_trait_modules_and_niche.py"

permissions:
  actions: read
  contents: read

jobs:
  niche-null:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEFAULT_ENVIRONMENT_RUN: "29306454759"
      DEFAULT_HISTORICAL_ARTIFACT: "8227254443"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install pandas numpy scikit-learn

      - name: Resolve frozen sources
        id: params
        shell: bash
        run: |
          ENV_RUN="${{ inputs.environment_run_id }}"
          HIST_ART="${{ inputs.historical_artifact_id }}"
          echo "environment_run=${ENV_RUN:-$DEFAULT_ENVIRONMENT_RUN}" >> "$GITHUB_OUTPUT"
          echo "historical_artifact=${HIST_ART:-$DEFAULT_HISTORICAL_ARTIFACT}" >> "$GITHUB_OUTPUT"

      - name: Download frozen enriched environment
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.params.outputs.environment_run }}
          name: ch1-exhaustive-enriched-environment-20260713
          path: source/environment

      - name: Download frozen historical tree audit
        env:
          GH_TOKEN: ${{ github.token }}
          HISTORICAL_ARTIFACT_ID: ${{ steps.params.outputs.historical_artifact }}
        run: |
          set -euo pipefail
          mkdir -p source/historical
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${HISTORICAL_ARTIFACT_ID}/zip" \
            --output source/historical.zip
          unzip -tq source/historical.zip
          unzip -q source/historical.zip -d source/historical
          test -s source/historical/historical_trees/gbotb_lcvp_backbone_audit.csv

      - name: Run 10,000-permutation null tests
        run: |
          ENVIRONMENT="source/environment/strict_spatial_thinned_with_climate_topography_soil.csv"
          test -s "$ENVIRONMENT"
          python analysis/permutation_test_trait_niche_contrasts.py \
            --environment "$ENVIRONMENT" \
            --direct-backbone-audit source/historical/historical_trees/gbotb_lcvp_backbone_audit.csv \
            --output-dir niche_permutation \
            --min-species-n 5 \
            --permutations 10000 \
            --seed 20260807
          sha256sum "$ENVIRONMENT" source/historical.zip > niche_permutation/input_sha256.txt
          printf '%s\n' "${GITHUB_SHA}" > niche_permutation/git_sha.txt
          python -m pip freeze > niche_permutation/python_environment.txt

      - name: Validate and summarize
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          r = pd.read_csv("niche_permutation/trait_niche_permutation_results.csv")
          s = json.loads(Path("niche_permutation/trait_niche_permutation_summary.json").read_text())
          if set(r["scope"]) != {"all_complete_species", "direct_backbone_complete_species"}:
              raise SystemExit("Both all-species and direct-backbone scopes are required")
          if not (r.groupby("scope").size() == 9).all():
              raise SystemExit("Each scope must contain all nine primary traits")
          if s["n_permutations"] != 10000:
              raise SystemExit("Permutation count changed")
          print(r[["scope", "trait", "observed_centroid_distance", "centroid_permutation_p", "centroid_bh_q", "observed_bhattacharyya_overlap", "overlap_permutation_p", "overlap_bh_q"]].to_string(index=False))
          PY

      - name: Upload niche null artifact
        uses: actions/upload-artifact@v4
        with:
          name: ch1-trait-niche-permutation-${{ github.run_id }}
          path: niche_permutation
          if-no-files-found: error
          retention-days: 90
