name: Reproducibility integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install reproducibility environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Compile Python sources
        run: python -m compileall -q analysis src ch1_global/v2 reproducibility/verify_local_materials.py

      - name: Check reproducibility layout and live entry points
        run: |
          pytest -q \
            tests/test_ch1_canonical_manifest.py \
            tests/test_reproducibility_manifest.py \
            tests/test_material_availability.py \
            tests/test_azami_ch1_provenance.py \
            tests/test_azami_ch1_tabular.py

      - name: Confirm prepublication documents are absent
        shell: bash
        run: |
          test ! -e manuscript
          test ! -e submission
          ! git ls-files | grep -E '\.(docx?|pptx?|xlsx?|zip)$'

      - name: Confirm frozen outputs and recovery contracts are tracked
        shell: bash
        run: |
          test -d analysis_outputs
          test -d reproducibility/figures
          test -f analysis/ch1/v2_full27_environment_atlas_contract.json
          test -f analysis/ch1/native_range_sensitivity_contract.json
          test -f analysis/ch1/chelsa_process_environment_sources.json
          test -f analysis/rebuild_frozen_native_status.py
          test -f analysis/rebuild_frozen_broad_region_lookup.py
          test -f analysis/build_naturalearth_broad_region_lookup.py
          test -f reproducibility/frozen-numerical-rebuild-requirements.txt
          test -f reproducibility/contracts/cirsium_ch1_image_trait_dictionary.csv
          test -f ch1_global/v2/ANALYSIS_MANIFEST.tsv
          test -f reproducibility/actions_artifact_catalog.json
          test -f reproducibility/durable_archive_manifest.json
          test -f reproducibility/material_availability.json
          test -f reproducibility/verify_local_materials.py
