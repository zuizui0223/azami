name: Reproducibility integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install reproducibility environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Compile Python sources
        run: python -m compileall -q analysis src ch1_global/v2 reproducibility/verify_local_materials.py

      - name: Check reproducibility layout and live entry points
        run: |
          pytest -q \
            tests/test_ch1_canonical_manifest.py \
            tests/test_reproducibility_manifest.py \
            tests/test_material_availability.py \
            tests/test_azami_ch1_provenance.py \
            tests/test_azami_ch1_tabular.py \
            tests/test_v3_*.py

      - name: Validate v3 workflow design without promoting scientific status
        run: python -m analysis.v3.workflow plan

      - name: Confirm prepublication documents are absent
        shell: bash
        run: |
          test ! -e manuscript
          test ! -e submission
          ! git ls-files | grep -E '\.(docx?|pptx?|xlsx?|zip)$'

      - name: Confirm frozen outputs and recovery contracts are tracked
        shell: bash
        run: |
          test -d analysis_outputs
          test -d reproducibility/figures
          test -f analysis/ch1/v2_full27_environment_atlas_contract.json
          test -f analysis/ch1/native_range_sensitivity_contract.json
          test -f analysis/ch1/chelsa_process_environment_sources.json
          test -f analysis/rebuild_frozen_native_status.py
          test -f analysis/rebuild_frozen_broad_region_lookup.py
          test -f analysis/build_naturalearth_broad_region_lookup.py
          test -f analysis/v3/resolution_stream_gate.py
          test -f analysis/v3/resolution_size_followup.py
          test -f analysis/v3/resolution_gate_contract.json
          test -f analysis/v3/measurement_qualification_contract.json
          test -f analysis/v3/measurement_qualification_decision_20260908.json
          test -f analysis/v3/freeze_measurement_qualification.py
          test -f analysis/v3/ecological_analysis_contract.json
          test -f analysis/v3/ecological_source_cohort_contract.json
          test -f analysis/v3/ecological_model_contract.json
          test -f analysis/v3/build_ecological_source_cohort.py
          test -f analysis/v3/stream_original_traits.py
          test -f analysis/v3/native_range_join_contract.json
          test -f analysis/v3/build_native_range_join.py
          test -f analysis/v3/build_native_range_join_from_source.py
          test -f analysis/v3/environment_source_archives.json
          test -f analysis/v3/prepare_environment_source_observations.py
          test -f analysis/v3/build_environment_design_cohort.py
          test -f analysis/v3/environment_exposure_contract.json
          test -f analysis/v3/environment_selection_priority_20260907.json
          test -f analysis/v3/environment_matrix.py
          test -f analysis/v3/freeze_environment_representation.py
          test -f analysis/v3/capitulum_abiotic_hypotheses_v3.md
          test -f analysis/v3/design_rationale.md
          test -f .github/workflows/ch1-v3-resolution-stream-gate.yml
          test -f .github/workflows/ch1-v3-resolution-size-followup.yml
          test -f .github/workflows/ch1-v3-measurement-freeze.yml
          test -f .github/workflows/ch1-v3-ecological-source-cohort.yml
          test -f .github/workflows/ch1-v3-original-stream-pilot.yml
          test -f .github/workflows/ch1-v3-environment-freeze.yml
          test -f reproducibility/v3_environment_design_upstream_20260907.json
          test -f reproducibility/v3_environment_representation_freeze_20260907.json
          test -f reproducibility/v3_measurement_qualification_freeze_20260908.json
          test -f reproducibility/frozen-numerical-rebuild-requirements.txt
          test -f reproducibility/v3-image-cpu-requirements.txt
          test -f reproducibility/contracts/cirsium_ch1_image_trait_dictionary.csv
          test -f ch1_global/v2/ANALYSIS_MANIFEST.tsv
          test -f reproducibility/actions_artifact_catalog.json
          test -f reproducibility/durable_archive_manifest.json
          test -f reproducibility/material_availability.json
          test -f reproducibility/public_release_manifest.json
          test -f reproducibility/verify_local_materials.py
