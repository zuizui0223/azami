name: Chapter 1 v3 aggregate repaired tail mechanics

on:
  push:
    branches: [revision/ch1-v3-20260907]
    paths:
      - analysis/v3/tail_mechanics_repair_aggregate_launch_20260909.json

permissions:
  actions: read
  contents: read

jobs:
  aggregate:
    if: github.repository == 'zuizui0223/azami' && github.ref == 'refs/heads/revision/ch1-v3-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install lightweight runtime
        run: python -m pip install numpy==2.5.3 pandas==3.0.5 scipy==1.18.1 pytest==9.1.1
      - name: Verify pinned repaired mechanics run is terminal and successful
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          marker=json.loads(Path('analysis/v3/tail_mechanics_repair_aggregate_launch_20260909.json').read_text())
          assert marker['source_run_id']==34247983094
          assert marker['source_head_sha']=='cd9562fb800447b4b9853d8617ace8b2288477e7'
          assert marker['expected_artifacts']==32
          assert marker['empirical_trait_environment_values_read']==0
          assert marker['ecological_models_executed']==0
          assert marker['ecological_fitting_authorized'] is False
          PY
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/34247983094 --jq .status)" = "completed"
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/34247983094 --jq .conclusion)" = "success"
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/34247983094 --jq .head_sha)" = "cd9562fb800447b4b9853d8617ace8b2288477e7"
      - name: Download all 32 repaired mechanics artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: v3-full36-tail-*
          path: runs/repaired-tail-artifacts
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: '34247983094'
      - name: Require exact inventory and aggregate without replacing failures
        run: |
          count="$(find runs/repaired-tail-artifacts -name public_report.json -type f | wc -l)"
          test "$count" -eq 32
          mapfile -t reports < <(find runs/repaired-tail-artifacts -name public_report.json -type f | sort)
          mkdir -p runs/repaired-tail-aggregate
          python -m analysis.v3.summarize_full_family_tail_pilot \
            --reports "${reports[@]}" \
            --out runs/repaired-tail-aggregate/report.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('runs/repaired-tail-aggregate/report.json')
          d=json.loads(p.read_text())
          assert d['recorded_outer_reports']==32
          assert d['expected_grid_cases']==64
          assert d['complete_grid_cases']==64, d.get('incomplete_grid_cases')
          assert not d['missing_outer_reports']
          assert d['status']=='FULL36_TAIL_MECHANICS_PILOT_AGGREGATED_NOT_ECOLOGY_ADMISSION'
          assert d['empirical_trait_environment_values_read']==0
          assert d['ecological_models_executed']==0
          assert d['ecological_fitting_authorized'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v3-tail-mechanics-solver-repair-aggregate-${{ github.run_id }}
          path: runs/repaired-tail-aggregate/report.json
          if-no-files-found: error
          retention-days: 30

# This workflow is inert until the repaired 999-draw mechanics run is terminal.
# It preserves the original 63/64 failure evidence and creates a separate repaired aggregate.
