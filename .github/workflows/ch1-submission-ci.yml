name: Ch1 submission code CI

on:
  pull_request:
    branches: [main]
    paths:
      - "README.md"
      - "analysis/**"
      - "manuscript/**"
      - "src/**"
      - "pyproject.toml"
      - "ch1_global/**"
      - "tests/**"
      - ".gitignore"
      - ".github/workflows/ch1-*.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "analysis/**"
      - "manuscript/**"
      - "src/**"
      - "pyproject.toml"
      - "ch1_global/**"
      - "tests/**"
      - ".gitignore"
      - ".github/workflows/ch1-*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submission-code-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            ch1_global/v2/requirements-submission.txt

      - name: Install submission dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ch1_global/v2/requirements-submission.txt "PyYAML>=6,<7"
          python -m pip install --editable .
          python -m pip check

      - name: Validate active submission controls
        run: |
          python analysis/ch1/run_submission.py check
          python analysis/ch1/run_submission.py claims
          python analysis/ch1/run_submission.py summary > /tmp/ch1_submission_summary.json
          python -m json.tool /tmp/ch1_submission_summary.json >/dev/null

      - name: Validate Supplement tables against frozen claims
        run: |
          python analysis/validate_supplement_tables.py

      - name: Compile active Python control and analysis scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          roots = [Path("analysis"), Path("analysis/ch1"), Path("ch1_global/v2")]
          count = 0
          for root in roots:
              for path in sorted(root.glob("*.py")):
                  compile(path.read_text(encoding="utf-8"), str(path), "exec")
                  count += 1
          if count == 0:
              raise SystemExit("No active Python scripts found")
          print(f"compiled {count} Python files")
          PY

      - name: Smoke-build Supplement figures
        run: |
          rm -rf /tmp/ch1-supplement-figures
          python analysis/build_supplement_figures.py \
            --tables-dir manuscript/supplement/tables \
            --out-dir /tmp/ch1-supplement-figures
          test "$(find /tmp/ch1-supplement-figures -maxdepth 1 -name 'Figure_S*.png' | wc -l)" -eq 5
          test "$(find /tmp/ch1-supplement-figures -maxdepth 1 -name 'Figure_S*.svg' | wc -l)" -eq 5

      - name: Parse active R submission scripts
        uses: r-lib/actions/setup-r@v2

      - name: Check R syntax
        run: |
          Rscript -e 'parse(file="ch1_global/v2/65_audit_and_build_historical_trees.R")'
          Rscript -e 'parse(file="ch1_global/v2/66_run_historical_constraint_pgls.R")'
          Rscript -e 'parse(file="ch1_global/v2/83_run_lightweight_spde_inla.R")'
          Rscript -e 'parse(file="analysis/export_spde_best_model_residuals.R")'
          bash -n ch1_global/v2/72_run_exhaustive_continuous_trait_shard.sh

      - name: Validate JSON and workflow YAML
        run: |
          python -m json.tool analysis/ch1/pipeline.json >/dev/null
          python -m json.tool analysis/ch1/submission_contract.json >/dev/null
          python -m json.tool manuscript/final_claims.json >/dev/null
          python - <<'PY'
          from pathlib import Path
          import yaml
          workflows = sorted(Path(".github/workflows").glob("ch1-*.yml"))
          if not workflows:
              raise SystemExit("No Chapter 1 workflows found")
          for path in workflows:
              value = yaml.safe_load(path.read_text(encoding="utf-8"))
              if not isinstance(value, dict) or "jobs" not in value:
                  raise SystemExit(f"Invalid workflow structure: {path}")
          print(f"validated {len(workflows)} workflows")
          PY

      - name: Reject resurrected withdrawn headline
        run: |
          python - <<'PY'
          from pathlib import Path
          active = [
              Path("README.md"),
              Path("manuscript/SUBMISSION_MANUSCRIPT.md"),
              Path("manuscript/00_title_abstract.md"),
              Path("manuscript/03_results.md"),
              Path("manuscript/04_discussion.md"),
              Path("manuscript/05_conclusion_and_declarations.md"),
              Path("manuscript/FIGURE_TABLE_MAP.md"),
              Path("manuscript/RUNBOOK.md"),
          ]
          forbidden = ["figure_species_lability_quadrants", "quadrants: 22 high/high", "variation-responsiveness Spearman rho: -0.333"]
          hits = []
          for path in active:
              text = path.read_text(encoding="utf-8")
              for token in forbidden:
                  if token in text:
                      hits.append(f"{path}: {token}")
          if hits:
              raise SystemExit("Withdrawn headline material found:\n" + "\n".join(hits))
          PY

      - name: Run unit and invariant tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci_artifacts
          python -m unittest discover -s tests -p "test_*.py" -v 2>&1 | tee ci_artifacts/unittest.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch1-submission-ci-diagnostics
          path: ci_artifacts
          if-no-files-found: warn
          retention-days: 14
