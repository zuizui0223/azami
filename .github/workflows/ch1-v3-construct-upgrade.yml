name: Chapter 1 v3 construct upgrade

on:
  push:
    branches: [analysis/ch1-v3-biological-axes-20260910]
    paths:
      - 'analysis/v3/run_construct_scale_upgrade.py'
      - '.github/workflows/ch1-v3-construct-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  construct-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numerical runtime
        run: |
          python -m pip install pandas==3.0.5 numpy==2.4.6 statsmodels==0.14.6 scipy==1.17.1
          python -m py_compile analysis/v3/run_biological_axis_reanalysis.py analysis/v3/run_construct_scale_upgrade.py

      - name: Recover frozen v2 inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/continuous work/environment
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9612943217/zip > work/continuous.zip
          echo '101e996b638996a0c5ae79d358bf51293c3585f0e84c4a961b91dcbedf96211e  work/continuous.zip' | sha256sum -c -
          unzip -q work/continuous.zip 'universe/continuous_trait_universe_observation_long.csv' -d work/continuous
          echo 'd775794f2bce2dfd0c1f63c5c8e01778c518f6eeb327bf0d9944045143a02344  work/continuous/universe/continuous_trait_universe_observation_long.csv' | sha256sum -c -

          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9633419268/zip > work/environment.zip
          echo 'd7c0c466f55b67695d06ae46c21a6452dbe6cfd92a52db8042caa200429e97f4  work/environment.zip' | sha256sum -c -
          unzip -q work/environment.zip 'process_environment/strict_spatial_chelsa_process.csv' -d work/environment
          echo 'f86a3418e9b21453026bba1aaf350b061f03048949547e2092602620af98cbf6  work/environment/process_environment/strict_spatial_chelsa_process.csv' | sha256sum -c -

      - name: Rebuild construct environmental atlas
        run: |
          set -euo pipefail
          mkdir -p work/axis
          python -m analysis.v3.run_biological_axis_reanalysis \
            --traits work/continuous/universe/continuous_trait_universe_observation_long.csv \
            --environment work/environment/process_environment/strict_spatial_chelsa_process.csv \
            --out-dir work/axis \
            --permutations 9999 \
            --seed 20260910
          test -s work/axis/biological_axes_among_min5.csv
          test -s work/axis/biological_axes_within.csv

      - name: Run common-cohort and six-block upgrade
        run: |
          set -euo pipefail
          mkdir -p work/upgrade
          python -m analysis.v3.run_construct_scale_upgrade \
            --traits work/continuous/universe/continuous_trait_universe_observation_long.csv \
            --environment work/environment/process_environment/strict_spatial_chelsa_process.csv \
            --axis-among work/axis/biological_axes_among_min5.csv \
            --axis-within work/axis/biological_axes_within.csv \
            --out-dir work/upgrade \
            --minimum-complete-observations-per-taxon 5 \
            --bootstrap-replicates 1000 \
            --permutations 9999 \
            --seed 20260910 | tee work/upgrade/run.log
          test -s work/upgrade/construct_scale_upgrade_report.json
          python -m json.tool work/upgrade/construct_scale_upgrade_report.json >/dev/null

      - name: Upload construct upgrade outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ch1-v3-construct-upgrade-${{ github.run_id }}
          path: work/upgrade/**
          if-no-files-found: error
          retention-days: 30
