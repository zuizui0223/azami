name: V4 S2 source-wide WCVP native vs introduced opportunity
on:
  workflow_dispatch:
  push:
    branches: [codex/v4-native-integration-workflow]
    paths:
      - 'analysis/v4/native_range_status.py'
      - 'analysis/v4/native_introduced_opportunity.py'
      - 'tests/test_v4_native_introduced_opportunity.py'
      - '.github/workflows/v4-rain-introduced-opportunity.yml'
permissions:
  # The source is a PRIVATE draft-release asset. GitHub requires write-scoped
  # contents for the built-in runner token to READ draft-release binary assets.
  # This job NEVER changes or publishes the Release or original data.
  contents: write
  actions: read
concurrency:
  group: v4-native-introduced-screen-${{ github.ref }}
  cancel-in-progress: false
jobs:
  classified-original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit environment (no global Cirsium downloads)
        run: python -m pip install -r reproducibility/requirements-current.txt 'shapely>=2,<3' 'cryptography>=46,<49' pytest
      - name: Check introduced/native WCVP partition and phantom-phenotype guards
        run: python -m pytest -q tests/test_v4_native_introduced_opportunity.py
      - name: Recover exact source and original measurement ciphertext and 350-species WCVP authority
        run: |
          set -euo pipefail
          mkdir -p work/rain-transfer/private work/rain-transfer/public
          gh api -H "Accept: application/octet-stream" \
            repos/zuizui0223/azami/releases/assets/658986481 \
            > work/rain-transfer/private/original-metadata.aesgcm
          echo 'dfa98fa162a8029cb6477adf4c26ffc5819cc916a0513d32da14d78d845ab4b0  work/rain-transfer/private/original-metadata.aesgcm' | sha256sum -c -
          gh api -H "Accept: application/octet-stream" \
            repos/zuizui0223/azami/releases/assets/659010325 \
            > work/rain-transfer/private/original-measurements.aesgcm
          echo '111c8fb668265a623c948b635dea68b5182f0a2be04d91ec03bda056b608eb60  work/rain-transfer/private/original-measurements.aesgcm' | sha256sum -c -
          gh api repos/zuizui0223/azami/actions/artifacts/12244160272/zip \
            > work/rain-transfer/private/authority350.zip
          echo 'ec0e3b67c2fb81d4d1dd8a9215585e4523abcbf8085959854ec80dc826a56ca1  work/rain-transfer/private/authority350.zip' | sha256sum -c -
      - name: Classify ALL 665115 original observation regions and match true orientation availability
        env:
          AZAMI_METADATA_KEY: ${{ secrets.AZAMI_METADATA_KEY }}
          AZAMI_MEASUREMENTS_KEY: ${{ secrets.AZAMI_MEASUREMENTS_KEY }}
        run: |
          python -m analysis.v4.native_introduced_opportunity \
            --original work/rain-transfer/private/original-metadata.aesgcm \
            --measurements work/rain-transfer/private/original-measurements.aesgcm \
            --authority work/rain-transfer/private/authority350.zip \
            --output work/rain-transfer/public
      - name: Validate public-only output and no original metadata exposure
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          output=Path('work/rain-transfer/public')
          if not (output/'source665115_introduced_opportunity.json').is_file():
              # If the numerical stage failed, retain its original failure;
              # never create a guessed, fake-complete scientific receipt.
              print('No source-wide numerical result yet: inspect job failure.')
              raise SystemExit(0)
          files=[x.name for x in output.iterdir()]
          assert files==['source665115_introduced_opportunity.json'], files
          d=json.loads((output/files[0]).read_text())
          o=d['overall']
          assert o['status_partition_conserved']
          assert o['original_observations']==665115
          assert o['native_primary_wild_observations']==313350
          assert o['introduced_primary_wild_observations']>0
          assert len(d['focal_native_intro_orientation_support'])==2
          print('Public-only source aggregate verified')
          PY
      - name: Upload aggregate source status without private observations
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-rain-introduced-source-opportunity
          path: work/rain-transfer/public/
          retention-days: 90
          if-no-files-found: warn
