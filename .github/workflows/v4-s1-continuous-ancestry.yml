name: V4 S1 continuous orientation 194-taxon ancestry
on:
  push:
    branches: [codex/v4-native-integration-workflow]
    paths:
      - '.github/workflows/v4-s1-continuous-ancestry.yml'
      - 'analysis/v4/s1_continuous_phylogenetic_history.py'
      - 'tests/test_v4_s1_continuous_phylogenetic_history.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: v4-s1-continuous-${{ github.sha }}
  cancel-in-progress: false
jobs:
  continuous-history:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numerical and decryption dependencies
        run: python -m pip install -r reproducibility/requirements-current.txt 'cryptography>=46,<49' pytest
      - name: Validate continuous non-categorical Brownian inference and five-climate design
        run: python -m pytest -q tests/test_v4_s1_continuous_phylogenetic_history.py
      - name: Restore original encrypted S1 observations under source-integrity gate
        env:
          AZAMI_METADATA_KEY: ${{ secrets.AZAMI_METADATA_KEY }}
        run: |
          set -euo pipefail
          mkdir -p work/s1-continuous/private work/s1-continuous/receipt work/s1-continuous/output
          gh run download 39408603488 --repo zuizui0223/azami --name v4-native-observation-input-encrypted --dir work/s1-continuous/private
          gh run download 39408603488 --repo zuizui0223/azami --name v4-all665115-native-climate-aggregate --dir work/s1-continuous/receipt
          python - <<'PY'
          import os, json, hashlib
          from pathlib import Path
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          root=Path('work/s1-continuous')
          raw=(root/'receipt/measurement_receipt.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='246a5ea9643617c6dc766e0b8d27a444a5496afe150d7768032740cf6a53f0a6'
          receipt=json.loads(raw)
          sealed=(root/'private/native-observation-measurements.csv.gz.aesgcm').read_bytes()
          assert hashlib.sha256(sealed).hexdigest()==receipt['encrypted_table_sha256']
          try:
              data=AESGCM(bytes.fromhex(os.environ['AZAMI_METADATA_KEY'])).decrypt(
                  sealed[:12],sealed[12:],receipt['encrypted_table_aad'].encode())
          except Exception:
              raise SystemExit('Private observation source authentication failed') from None
          assert hashlib.sha256(data).hexdigest()==receipt['prepared_table_sha256']
          (root/'private/observations.csv.gz').write_bytes(data)
          PY
      - name: Decode immutable CHELSA five-exposure native source
        run: |
          python -m analysis.v4.decode_environment \
            --table work/s1-continuous/private/observations.csv.gz \
            --receipt work/s1-continuous/receipt/measurement_receipt.json \
            --metadata analysis/v4/environment_source_metadata.json \
            --output work/s1-continuous/decoded
      - name: Infer S1 measured mean and median image-angle continuous history on all 194 taxa across 52 trees
        run: |
          python -m analysis.v4.s1_continuous_phylogenetic_history \
            --table work/s1-continuous/decoded/observations.csv.gz \
            --out work/s1-continuous/output/S1_CONTINUOUS_194_52_TREE_HISTORY.json
      - name: Upload public species-level numerical ancestry and source audit only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-s1-continuous-194-taxa-52-placement-history
          path: work/s1-continuous/output/
          if-no-files-found: warn
          retention-days: 90
