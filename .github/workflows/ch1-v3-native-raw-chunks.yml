name: Chapter 1 v3 native raw measurement chunks

on:
  push:
    branches: [revision/ch1-v3-20260907]
    paths:
      - analysis/v3/native_measurement_batch_20260908.json
  workflow_dispatch:

permissions:
  contents: write # Only assets on the existing UNPUBLISHED numerical draft.
  actions: read # Pinned detector artifact.

jobs:
  measure:
    if: github.repository == 'zuizui0223/azami' && github.ref == 'refs/heads/revision/ch1-v3-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        chunk: [c000000, c000001]
    concurrency:
      group: v3-native-11831c6ad28ccaba-${{ matrix.chunk }}
      cancel-in-progress: false
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: reproducibility/v3-image-cpu-requirements.txt
      - name: Install pinned CPU measurement runtime
        run: |
          python -m pip install torch==2.11.0+cpu torchvision==0.26.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r reproducibility/v3-image-cpu-requirements.txt requests==2.34.2
      - name: Test chunk conservation, checkpoint recovery and protected transport
        run: |
          python -m pytest -q tests/test_v3_measurement_chunks.py tests/test_v3_cloud_measurement_chunks.py tests/test_v3_reconciled_stream_input.py tests/test_v3_protected_artifacts.py tests/test_v3_private_replay.py
      - name: Measure only missing photo units and preserve numerical results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m analysis.v3.cloud_measurement_chunks \
            --batch analysis/v3/native_measurement_batch_20260908.json \
            --chunk '${{ matrix.chunk }}' \
            --out "$RUNNER_TEMP/v3-native-${{ matrix.chunk }}"
      - uses: actions/upload-artifact@v4
        with:
          name: v3-native-${{ matrix.chunk }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v3-native-${{ matrix.chunk }}/measurement/public_report.json
          if-no-files-found: error
          retention-days: 30
      # Source images exist only in temporary memory. Numerical payloads,
      # links and partial units must never enter public artifacts or logs.
      # No ecological join, release publication or automatic full-cohort fan-out.
