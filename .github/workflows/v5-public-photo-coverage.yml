name: V5 verified three-trait photograph coverage for poster
on:
  push:
    branches: [codex/v5-annual-manuscript-draft-20261111]
    paths: ['.github/workflows/v5-public-photo-coverage.yml','analysis/v5/export_v5_photo_coverage_5deg.py']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: azami-v5-niche-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  climate_fit:
    # GitHub restricts draft-release asset GETs to push-capable tokens. Match
    # the existing S2 source-recovery job; this job makes no repository or
    # release mutations and never changes the draft's visibility.
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: .
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original-source dependencies and test climate-only source-gate contracts
        run: |
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scipy>=1.11,<2' 'statsmodels>=0.14,<1' 'cryptography>=46,<49' 'shapely>=2,<3' 'rasterio>=1.4,<2' 'requests>=2.31,<3' scikit-learn
      - name: Restore original confidential WCVP-native and explicitly introduced S2 sources
        env:
          AZAMI_METADATA_KEY: ${{ secrets.AZAMI_METADATA_KEY }}
          AZAMI_MEASUREMENTS_KEY: ${{ secrets.AZAMI_MEASUREMENTS_KEY }}
        run: |
          set -euo pipefail
          mkdir -p work/submission/private work/submission/public work/submission/temp
          gh api -H "Accept: application/octet-stream" \
            repos/zuizui0223/azami/releases/assets/658986481 \
            > work/submission/private/original-metadata.aesgcm
          echo 'dfa98fa162a8029cb6477adf4c26ffc5819cc916a0513d32da14d78d845ab4b0  work/submission/private/original-metadata.aesgcm' | sha256sum -c -
          gh api -H "Accept: application/octet-stream" \
            repos/zuizui0223/azami/releases/assets/659010325 \
            > work/submission/private/original-measurements.aesgcm
          echo '111c8fb668265a623c948b635dea68b5182f0a2be04d91ec03bda056b608eb60  work/submission/private/original-measurements.aesgcm' | sha256sum -c -
          gh api repos/zuizui0223/azami/actions/artifacts/12244160272/zip \
            > work/submission/private/authority350.zip
          echo 'ec0e3b67c2fb81d4d1dd8a9215585e4523abcbf8085959854ec80dc826a56ca1  work/submission/private/authority350.zip' | sha256sum -c -
          python -m analysis.v4.native_introduced_opportunity \
            --original work/submission/private/original-metadata.aesgcm \
            --measurements work/submission/private/original-measurements.aesgcm \
            --authority work/submission/private/authority350.zip \
            --output work/submission/private/authority-public-stage \
            --private-focal-all-wild-output work/submission/private/focal_wild.csv.gz
          python - <<'PY'
          import os,io
          import pandas as pd
          from pathlib import Path
          from analysis.v4.native_introduced_opportunity import (
              decrypt_checked, MEASUREMENT_AAD, MEASUREMENT_SEALED_SHA,
              MEASUREMENT_SHA,
          )
          src=Path('work/submission/private/original-measurements.aesgcm').read_bytes()
          clear=decrypt_checked(src,os.environ['AZAMI_MEASUREMENTS_KEY'],
                                MEASUREMENT_SEALED_SHA,MEASUREMENT_SHA,MEASUREMENT_AAD)
          measured=pd.read_csv(io.BytesIO(clear),dtype={'obs_id':str},low_memory=False)
          if measured.obs_id.duplicated().any():
              raise ValueError('UNVERIFIED_OR_DUPLICATE_ORIGINAL_COLOUR_MEASUREMENTS')
          measured.to_csv('work/submission/private/original-measured.csv.gz',
                          index=False,compression='gzip')
          print({'original_measurement_rows':len(measured),
                 'source_colour_fields':[c for c in measured if 'chroma' in c or 'lightness' in c]},
                flush=True)
          PY
      - name: Link background-corrected climate novelty to measured traits
        run: python -m analysis.v5.niche_traits
      - uses: actions/upload-artifact@v4
        with:
          name: v5-verified-three-trait-photo-coverage
          path: |
            work/submission/novelty/v5_photo_coverage_5deg_public.csv
            work/submission/novelty/v5_photo_coverage_5deg_public.receipt.json
          if-no-files-found: error

      - name: Commit only audited coarse V5 5-degree cells to manuscript branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s work/submission/novelty/v5_photo_coverage_5deg_public.csv
          test -s work/submission/novelty/v5_photo_coverage_5deg_public.receipt.json
          python - <<'PY'
          import pandas as pd,json
          from pathlib import Path
          base=Path('work/submission/novelty/v5_photo_coverage_5deg_public')
          data=pd.read_csv(base.with_suffix('.csv'))
          receipt=json.loads(Path(str(base)+'.receipt.json').read_text())
          assert set(data)=={'species','range_state','lat_bin','lon_bin','record_count'}
          assert data.record_count.ge(5).all()
          assert len(data)==receipt['shown_cells']
          assert receipt['total_records']==79421
          print(receipt)
          PY
          contents="$(base64 -w 0 < work/submission/novelty/v5_photo_coverage_5deg_public.csv)"
          gh api -X PUT \
            repos/zuizui0223/azami/contents/manuscripts/v5_annual_20261111/figures/v5_photo_coverage_5deg_public.csv \
            -f branch="${GITHUB_REF_NAME}" \
            -f message="V5: publish verified coarse three-trait photograph cell coverage" \
            -f content="${contents}" > /dev/null
