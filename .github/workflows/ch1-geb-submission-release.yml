name: Ch1 GEB submission release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "analysis/build_geb_submission_release.py"
      - "analysis/geb_submission_release_common.py"
      - "analysis/geb_submission_release_main_figures.py"
      - "analysis/geb_submission_release_supplement.py"
      - "analysis/geb_submission_release_tables.py"
      - "tests/test_build_geb_submission_release.py"
      - ".github/workflows/ch1-geb-submission-release.yml"
      - "manuscript/00_title_abstract.md"
      - "manuscript/01_introduction.md"
      - "manuscript/02_methods.md"
      - "manuscript/03_results.md"
      - "manuscript/04_discussion.md"
      - "manuscript/05_conclusion_and_declarations.md"
      - "manuscript/06_references.md"
      - "manuscript/07_data_code_availability.md"
      - "manuscript/MAIN_FIGURE_CAPTIONS.md"
      - "manuscript/EXPANDED_SUPPLEMENT_CAPTIONS.md"
      - "manuscript/SUBMISSION_FIGURE_MAP.md"
  push:
    branches: [main]
    paths:
      - "analysis/build_geb_submission_release.py"
      - "analysis/geb_submission_release_common.py"
      - "analysis/geb_submission_release_main_figures.py"
      - "analysis/geb_submission_release_supplement.py"
      - "analysis/geb_submission_release_tables.py"
      - "tests/test_build_geb_submission_release.py"
      - ".github/workflows/ch1-geb-submission-release.yml"
      - "manuscript/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: ch1-geb-submission-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CONTINUOUS_ARTIFACT_ID: "9612943217"
      CONTINUOUS_SHA256: "101e996b638996a0c5ae79d358bf51293c3585f0e84c4a961b91dcbedf96211e"
      CROSS_ARTIFACT_ID: "9632715852"
      CROSS_SHA256: "51e7a26b5bd09e030b67b9342586699abaaf46e630f45b6bb4ee7bfc9152ced6"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=2.0,<3" \
            "pandas>=2.2,<4" \
            "matplotlib>=3.8,<4" \
            "pillow>=10,<13" \
            "pytest>=8,<9"

      - name: Unit-test release builder
        run: python -m pytest -q tests/test_build_geb_submission_release.py

      - name: Download immutable source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source_zips artifacts/continuous artifacts/cross
          curl --fail --location --retry 4 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CONTINUOUS_ARTIFACT_ID}/zip" \
            -o source_zips/continuous.zip
          curl --fail --location --retry 4 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CROSS_ARTIFACT_ID}/zip" \
            -o source_zips/cross.zip

      - name: Verify immutable artifact digests
        run: |
          echo "${CONTINUOUS_SHA256}  source_zips/continuous.zip" | sha256sum --check --strict
          echo "${CROSS_SHA256}  source_zips/cross.zip" | sha256sum --check --strict
          unzip -q source_zips/continuous.zip -d artifacts/continuous
          unzip -q source_zips/cross.zip -d artifacts/cross

      - name: Build GEB figure, table and manuscript release
        env:
          MPLBACKEND: Agg
        run: |
          python analysis/build_geb_submission_release.py \
            --continuous-root artifacts/continuous \
            --cross-root artifacts/cross \
            --manuscript-dir manuscript \
            --out-dir build/geb_submission_release \
            --release-date 2026-08-27

      - name: Validate release products
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          root = Path("build/geb_submission_release")
          report = json.loads((root / "metadata/release_validation_report.json").read_text())
          assert report["status"] == "passed"
          assert report["generated_main_figures"] == 3
          assert report["generated_supplement_figures"] == 8
          assert report["generated_figure_files"] == 33
          assert report["abstract_body_words"] <= 300
          assert report["cross_scale_class_counts"] == {
              "neither": 56,
              "within_only": 8,
              "both_scales": 3,
              "among_only": 1,
          }
          pngs = sorted(root.glob("figures/**/*.png"))
          assert len(pngs) == 11
          for path in pngs:
              with Image.open(path) as image:
                  assert min(image.size) >= 1600, (path, image.size)
          assert (root / "metadata/SHA256SUMS.txt").is_file()
          assert (root / "tables/SUPPLEMENT_TABLE_INDEX.csv").is_file()
          print(json.dumps(report, indent=2))
          PY

      - name: Upload GEB submission release
        uses: actions/upload-artifact@v4
        with:
          name: ch1-geb-submission-release
          path: build/geb_submission_release
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
