name: V4 T2 exact same-source real110 Q20 ML NJ topology audit
on:
  push:
    branches: [codex/v4-native-integration-workflow]
    paths:
      - 'analysis/v4/t2_real110_ml_vs_nj_same_q20_topology.py'
      - 'tests/test_v4_t2_real110_ml_vs_nj_same_q20_topology.py'
      - '.github/workflows/v4-t2-real110-ml-vs-nj-q20-topology.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original111-posthoc110-two-algorithm-phylogram-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test unrooted split RF and exact public-source tree identities
        run: |
          python -m pip install 'pytest>=8,<10' 'biopython>=1.83,<2'
          python -m pytest -q tests/test_v4_t2_real110_ml_vs_nj_same_q20_topology.py
      - name: Restore only SHA-verified real DNA original111 mask and real110 ML/NJ trees
        run: |
          set -euo pipefail
          mkdir -p work/compare/source work/compare/ml work/compare/nj work/compare/out
          test "$(gh api repos/zuizui0223/azami/actions/artifacts/12479233954 --jq '.digest')" = 'sha256:01b78f6a8129fec585dbe9a886df1d0997d78eb8a3b45165955455553b187009'
          test "$(gh api repos/zuizui0223/azami/actions/artifacts/12479273411 --jq '.digest')" = 'sha256:87894a99183757e12d510f97d291fe1a2bad246569289402a0b8068c718fbf61'
          test "$(gh api repos/zuizui0223/azami/actions/artifacts/12480041628 --jq '.digest')" = 'sha256:b8a741c83179fe8b8049050efed6f3f80dd75d4671c1459d71c3a791f0c1e10f'
          gh run download 39902959690 --repo zuizui0223/azami --name t2-original111-posthoc110-authentic-Q20-ML-input --dir work/compare/source
          gh run download 39902959690 --repo zuizui0223/azami --name t2-posthoc110-realQ20-GTRG4-ML-vs-independent-NA63 --dir work/compare/ml
          gh run download 39903659219 --repo zuizui0223/azami --name t2-real110-original111-mask-pairwise-nj-NA63-diagnostics --dir work/compare/nj
      - name: Quantify shared whole-source110 unrooted splits and original NA63 topology concordance
        run: |
          python -m analysis.v4.t2_real110_ml_vs_nj_same_q20_topology --ml-tree work/compare/ml/REAL110_ORIGINAL111_POSTHOC_Q20_GTRG4_ML.treefile --nj-tree work/compare/nj/REAL110_SOURCE_NUCLEAR_ORIGINALMASK_UNROOTED_NJ.nwk --original-receipt work/compare/source/REAL110_POSTHOC_ONLY_LOW_Q20_TIP_REMOVED_RECEIPT.json --ml-na63 work/compare/ml/REAL110_POSTHOC_VS_INDEPENDENT_NA63_NUCLEAR_TOPOLOGY.json --nj-na63 work/compare/nj/REAL110_Q20_NJ_VS_PUBLISHED_NA63_SOURCE.json --ml-verified work/compare/ml/REAL110_POSTHOC_ACTUAL_IQTREE_SOURCE_VERIFIED.json --nj-verified work/compare/nj/REAL110_NJ_SOURCE_ROBUSTNESS_SUMMARY.json --output work/compare/out/REAL110_ML_NJ_IDENTICAL_ACTUAL_Q20_UNROOTED_RF_VERIFIED.json
      - name: Confirm methods differ only in tree-estimation procedure and no invented adaptation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('work/compare/out/REAL110_ML_NJ_IDENTICAL_ACTUAL_Q20_UNROOTED_RF_VERIFIED.json').read_text())
          assert a['posthoc_public_BioSamples']==110
          assert a['same_original_108_Q20_reference_loci']
          assert a['same_original_29310_site_89of111_mask']
          assert a['original111_quality_source_passed'] is False
          assert a['independent_published_NA63_exact_source_taxa']==26
          assert not a['full_294_tip_EAzami_nuclear_tree_completed']
          assert not a['botanical_U_to_D_change_number_or_rain_causality_inferred']
          print('REAL110_ML_NJ_Q20_SOURCE_MATCHED_RF=',a['ML_vs_NJ_normalized_unrooted_RF'],'NA63_quartet_ML=',a['ML_vs_NA63_quartet_fraction'],'NA63_quartet_NJ=',a['NJ_vs_NA63_quartet_fraction'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: t2-real110-actual-Q20-ML-NJ-internal-RF-and-NA63-verification
          path: work/compare/out/
          if-no-files-found: error
          retention-days: 90
