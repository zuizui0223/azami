name: V4 original S1 photo split-half geographic signal reliability
on:
  pull_request:
    paths:
      - 'analysis/v4/rf_photographic_split_half_reliability.py'
      - 'tests/test_v4_rf_photographic_split_half_reliability.py'
      - 'analysis/v4/RF_PHOTO_SPLIT_HALF_RELIABILITY_JA.md'
      - '.github/workflows/v4-s1-photo-split-half.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: azami-s1-photo-split-half-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-verified-S1-split-half:
    # No fork or unrelated PR can run with privileged original private source.
    if: >-
      github.repository == 'zuizui0223/azami' &&
      github.event.pull_request.head.repo.full_name == 'zuizui0223/azami' &&
      github.event.pull_request.head.ref == 'analysis/v4-photo-split-half-reliability-20261031' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: .
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original S1 crypto reader, numeric and synthetic-test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scipy>=1.11,<2' \
            'statsmodels>=0.14,<1' 'cryptography>=46,<49' pytest
      - name: Verify disjoint photo splits, geographic signal/null and circular hue only on synthetic rows
        run: |
          python -m pytest -q tests/test_v4_rf_photographic_split_half_reliability.py
          python -m py_compile analysis/v4/rf_photographic_split_half_reliability.py
      - name: Restore exact original S1 AES-GCM privately with SHA-verified receipt
        env:
          AZAMI_METADATA_KEY: ${{ secrets.AZAMI_METADATA_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AZAMI_METADATA_KEY:-}" ]; then
            echo 'PRIVATE_S1_KEY_UNAVAILABLE_IN_AUTHORISED_RUN' >&2
            exit 7
          fi
          mkdir -p work/s1-split-half/private work/s1-split-half/receipt work/s1-split-half/public
          gh run download 39408603488 --repo zuizui0223/azami \
            --name v4-native-observation-input-encrypted \
            --dir work/s1-split-half/private
          gh run download 39408603488 --repo zuizui0223/azami \
            --name v4-all665115-native-climate-aggregate \
            --dir work/s1-split-half/receipt
          python - <<'PY'
          import os, json, hashlib
          from pathlib import Path
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          root=Path('work/s1-split-half')
          data=(root/'receipt/measurement_receipt.json').read_bytes()
          if hashlib.sha256(data).hexdigest() != '246a5ea9643617c6dc766e0b8d27a444a5496afe150d7768032740cf6a53f0a6':
              raise SystemExit('ORIGINAL_RECEIPT_SHA_MISMATCH')
          receipt=json.loads(data)
          encrypted=(root/'private/native-observation-measurements.csv.gz.aesgcm').read_bytes()
          if hashlib.sha256(encrypted).hexdigest() != receipt['encrypted_table_sha256']:
              raise SystemExit('ORIGINAL_ENCRYPTED_DATA_SHA_MISMATCH')
          try:
              plaintext=AESGCM(bytes.fromhex(os.environ['AZAMI_METADATA_KEY'])).decrypt(
                  encrypted[:12], encrypted[12:], receipt['encrypted_table_aad'].encode())
          except Exception:
              raise SystemExit('ORIGINAL_S1_AES_GCM_AUTH_FAILURE') from None
          if hashlib.sha256(plaintext).hexdigest() != receipt['prepared_table_sha256']:
              raise SystemExit('ORIGINAL_SOURCE_DECRYPTED_SHA_DRIFT')
          (root/'private/source-original.csv.gz').write_bytes(plaintext)
          print('Original S1 source authenticated; individual identities not logged',flush=True)
          PY
          python -m analysis.v4.decode_environment \
            --table work/s1-split-half/private/source-original.csv.gz \
            --receipt work/s1-split-half/receipt/measurement_receipt.json \
            --metadata analysis/v4/environment_source_metadata.json \
            --output work/s1-split-half/private/decoded
      - name: Measure eight original traits split-half cell signal at 1 and 5 degrees
        run: |
          set -euo pipefail
          python -m analysis.v4.rf_photographic_split_half_reliability \
            --native work/s1-split-half/private/decoded/observations.csv.gz \
            --receipt work/s1-split-half/private/decoded/measurement_receipt.json \
            --output work/s1-split-half/public/s1_photo_split_half_8traits_1deg_5deg_aggregate.json
          python - <<'PY'
          import json
          from pathlib import Path
          f=Path('work/s1-split-half/public/s1_photo_split_half_8traits_1deg_5deg_aggregate.json')
          report=json.loads(f.read_text(encoding='utf-8'))
          assert report['schema']=='azami_original_s1_photo_split_half_geographic_signal_v1'
          assert report['source_original_s1_observations']==313350
          assert report['original_GEB_S1_S2_Holm_H3c_and_RF_untouched']
          assert len(report['results'])==16
          assert report['design']['seeds']==8
          assert report['design']['min_photos_per_cell']==4
          assert all(r['status'] in ('estimated_source_split_half_QC_not_RF',
                      'insufficient_repeated_taxa_for_split_half',
                      'insufficient_cross_half_spatial_signal_support') for r in report['results'])
          forbidden={'obs_id','accepted_key','taxon','taxon_name','latitude','longitude',
                     'user_id','photographer_id','photo_id','individual_prediction'}
          def check(node):
              if isinstance(node,dict):
                  for k,v in node.items():
                      if k in forbidden:raise ValueError('PRIVATE_AGGREGATE_KEY_'+k)
                      check(v)
              elif isinstance(node,list):
                  for x in node:check(x)
          check(report)
          print({'original_S1':313350,'n_photo_split_half_diagnostics':len(report['results']),
                 'n_estimated':sum(r['status']=='estimated_source_split_half_QC_not_RF' for r in report['results'])},flush=True)
          PY
      - name: Publish anonymous aggregate photo half-reliability only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: azami-v4-original-S1-photo-split-half-${{ github.run_id }}
          path: work/s1-split-half/public/s1_photo_split_half_8traits_1deg_5deg_aggregate.json
          retention-days: 90
          if-no-files-found: error
      - name: Always remove all decrypted source rows, receipts and intermediate private data
        if: always()
        run: rm -rf work/s1-split-half/private work/s1-split-half/receipt