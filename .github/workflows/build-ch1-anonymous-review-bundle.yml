name: Build Chapter 1 anonymous review bundle

on:
  pull_request:
    paths:
      - 'reproducibility/build_anonymous_review_bundle.py'
      - 'tests/test_anonymous_review_bundle.py'
      - 'analysis/v3/**'
      - 'analysis/ch1/image_to_trait_automated_technical_audit_summary.json'
      - 'reproducibility/current_reference/**'
      - 'reproducibility/requirements-current.txt'
      - '.github/workflows/build-ch1-anonymous-review-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-review-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen numerical environment
        run: |
          python -m pip install -r reproducibility/requirements-current.txt
          python -m pip install pytest==9.1.1

      - name: Run focused anonymous-bundle tests
        run: pytest -q tests/test_anonymous_review_bundle.py tests/test_current_reproduction.py tests/test_current_release_bundle.py

      - name: Build, identity-scan, and self-replay anonymous review bundle
        run: |
          mkdir -p work/anonymous-review
          python -m reproducibility.build_anonymous_review_bundle \
            --download \
            --out work/anonymous-review/chapter1_anonymous_review_bundle.zip
          python -m zipfile -t work/anonymous-review/chapter1_anonymous_review_bundle.zip
          cat work/anonymous-review/chapter1_anonymous_review_bundle.zip.sha256

      - name: Upload anonymous review bundle
        uses: actions/upload-artifact@v4
        with:
          name: chapter1-anonymous-review-bundle
          path: |
            work/anonymous-review/chapter1_anonymous_review_bundle.zip
            work/anonymous-review/chapter1_anonymous_review_bundle.zip.sha256
          if-no-files-found: error
          retention-days: 30
