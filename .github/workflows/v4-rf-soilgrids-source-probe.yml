name: V4 RF SoilGrids six-layer official WebDAV source probe (public only)
on:
  pull_request:
    paths:
      - 'analysis/v4/rf_soilgrids_webdav_probe.py'
      - 'tests/test_v4_rf_soilgrids_webdav_probe.py'
      - 'analysis/v4/RF_SOILGRIDS_SOURCE_PROTOCOL_JA.md'
      - '.github/workflows/v4-rf-soilgrids-source-probe.yml'
permissions:
  contents: read
concurrency:
  group: azami-soilgrids-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  official-six-source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    if: >-
      github.repository == 'zuizui0223/azami' &&
      github.event.pull_request.number == 167 &&
      github.event.pull_request.head.repo.full_name == 'zuizui0223/azami'
    env:
      PYTHONPATH: .
      GDAL_HTTP_MAX_RETRY: '1'
      GDAL_HTTP_TIMEOUT: '12'
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install testing and rasterio with no confidential data
        run: |
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scipy>=1.11,<2' 'statsmodels>=0.14,<1' 'rasterio>=1.3,<2' 'requests>=2.31,<3' pytest
      - name: Validate SoilGrids Q0.5 VRT parser and exact physical-unit scales
        run: |
          python -m pytest -q tests/test_v4_rf_soilgrids_webdav_probe.py
          python -m py_compile analysis/v4/rf_soilgrids_webdav_probe.py
      - name: Verify six official WebDAV VRT source payloads and public test pixel
        run: |
          python -m analysis.v4.rf_soilgrids_webdav_probe \
            --public-sentinel --output work/soilgrids_public_source_probe.json
      - name: Save aggregate source diagnostic even on probe error
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azami-soilgrids-six-source-audit-${{ github.run_id }}
          path: work/soilgrids_public_source_probe.json
          if-no-files-found: warn
          retention-days: 90