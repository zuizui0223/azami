name: V4 RF SoilGrids six-layer official WebDAV source probe (public only)
on:
  pull_request:
    paths:
      - 'analysis/v4/rf_soilgrids_webdav_probe.py'
      - 'analysis/v4/rf_soilgrids_window_sampler.py'
      - 'tests/test_v4_rf_soilgrids_window_sampler.py'
      - 'tests/test_v4_rf_soilgrids_webdav_probe.py'
      - 'analysis/v4/RF_SOILGRIDS_SOURCE_PROTOCOL_JA.md'
      - '.github/workflows/v4-rf-soilgrids-source-probe.yml'
permissions:
  contents: read
concurrency:
  group: azami-soilgrids-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  official-six-source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    if: >-
      github.repository == 'zuizui0223/azami' &&
      github.event.pull_request.number == 167 &&
      github.event.pull_request.head.repo.full_name == 'zuizui0223/azami'
    env:
      PYTHONPATH: .
      GDAL_HTTP_MAX_RETRY: '1'
      GDAL_HTTP_TIMEOUT: '12'
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install testing and rasterio with no confidential data
        run: |
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scipy>=1.11,<2' 'statsmodels>=0.14,<1' 'rasterio>=1.3,<2' 'requests>=2.31,<3' pytest
      - name: Validate SoilGrids Q0.5 VRT parser and exact physical-unit scales
        run: |
          python -m pytest -q tests/test_v4_rf_soilgrids_webdav_probe.py tests/test_v4_rf_soilgrids_window_sampler.py
          python -m py_compile analysis/v4/rf_soilgrids_webdav_probe.py
      - name: Verify six official WebDAV VRT source payloads and public test pixel
        run: |
          python -m analysis.v4.rf_soilgrids_webdav_probe \
            --public-sentinel --output work/soilgrids_public_source_probe.json
      - name: Compare GDAL source pixels against grouped native-window reads at PUBLIC sentinels
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          import numpy as np
          import rasterio
          from rasterio.warp import transform
          from analysis.v4.rf_soilgrids_webdav_probe import official_url
          from analysis.v4.rf_soilgrids_window_sampler import sample_projected_pixels_windowed
          url=official_url('soil_phh2o_0_5cm')
          # Fixed public inland sentinels; no original S1 points/IDs are used.
          points=((21.0,52.0),(-94.0,42.0),(25.0,-21.0),(137.0,35.0))
          virtual='/vsicurl?max_retry=1&retry_delay=1&list_dir=no&url='+url
          with rasterio.Env(GDAL_DISABLE_READDIR_ON_OPEN='EMPTY_DIR',
                            GDAL_HTTP_MAX_RETRY='1',GDAL_HTTP_RETRY_DELAY='1',
                            GDAL_HTTP_TIMEOUT='12',GDAL_HTTP_CONNECTTIMEOUT='8'):
              with rasterio.open(virtual) as src:
                  xs,ys=transform('EPSG:4326',src.crs,[x for x,_ in points],[y for _,y in points])
                  reference=np.array([np.nan if np.ma.is_masked(v[0]) else float(v[0])
                    for v in src.sample(zip(xs,ys),indexes=1,masked=True)],dtype=float)
                  grouped,diagnostic=sample_projected_pixels_windowed(src,xs,ys,
                                                                      window_pixels=16,max_seconds=120)
          if not np.allclose(reference,grouped,rtol=0,atol=0,equal_nan=True):
              raise SystemExit('PUBLIC_SOILGRIDS_NATIVE_PIXEL_WINDOW_MISMATCH')
          result={'status':'exact_public_pixel_equality',
                  'n_public_positions':len(points),
                  'n_exact_equal_including_nodata':len(points),
                  'n_finite_source_pixels':int(np.isfinite(grouped).sum()),
                  'n_window_reads':diagnostic['n_unique_source_windows'],
                  'source_original_photo_locations_or_ids_used':False,
                  'raster_soil_RF_not_run':True}
          target=Path('work/soilgrids_window_equivalence.json')
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result),flush=True)
          PYCODE
      - name: Save aggregate source diagnostic even on probe error
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azami-soilgrids-six-source-audit-${{ github.run_id }}
          path: |
            work/soilgrids_public_source_probe.json
            work/soilgrids_window_equivalence.json
          if-no-files-found: warn
          retention-days: 90