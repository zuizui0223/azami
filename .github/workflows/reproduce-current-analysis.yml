name: Zenodo 22703215 draft maintenance (branch only)
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [inspect, update]
        default: inspect
permissions:
  contents: read
  actions: read
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect or update only the specified unpublished draft
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          UPDATE_MODE: ${{ inputs.mode }}
        run: python -m reproducibility.maintain_zenodo_draft
      - name: Save draft receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zenodo-draft-receipt-${{ github.run_id }}
          path: work/zenodo-receipt/*.json
          retention-days: 30
          if-no-files-found: ignore
