name: V5 climate overlap density figure
on:
  push:
    branches: [codex/v5-heads-scales]
    paths: ['analysis/v5/export_overlap.py','.github/workflows/v5-overlap.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: azami-v5-overlap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  climate_fit:
    # GitHub restricts draft-release asset GETs to push-capable tokens. Match
    # the existing S2 source-recovery job; this job makes no repository or
    # release mutations and never changes the draft's visibility.
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: .
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original-source dependencies and test climate-only source-gate contracts
        run: |
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scipy>=1.11,<2' 'statsmodels>=0.14,<1' 'cryptography>=46,<49' 'shapely>=2,<3' 'rasterio>=1.4,<2' 'requests>=2.31,<3' scikit-learn
      - name: Restore original confidential WCVP-native and explicitly introduced S2 sources
        env:
          AZAMI_METADATA_KEY: ${{ secrets.AZAMI_METADATA_KEY }}
        run: |
          set -euo pipefail
          mkdir -p work/submission/private work/submission/public work/submission/temp
          gh api -H "Accept: application/octet-stream" \
            repos/zuizui0223/azami/releases/assets/658986481 \
            > work/submission/private/original-metadata.aesgcm
          echo 'dfa98fa162a8029cb6477adf4c26ffc5819cc916a0513d32da14d78d845ab4b0  work/submission/private/original-metadata.aesgcm' | sha256sum -c -
          gh api repos/zuizui0223/azami/actions/artifacts/12244160272/zip \
            > work/submission/private/authority350.zip
          echo 'ec0e3b67c2fb81d4d1dd8a9215585e4523abcbf8085959854ec80dc826a56ca1  work/submission/private/authority350.zip' | sha256sum -c -
          python -m analysis.v5.export_overlap
      - uses: actions/upload-artifact@v4
        with:
          name: v5-climate-overlap
          path: work/submission/overlap/*.npz
          if-no-files-found: error
