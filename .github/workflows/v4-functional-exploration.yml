name: V4 functional trait analysis

on:
  pull_request:
    paths:
      - 'analysis/v4/**'
      - 'tests/test_v4_functional_pilot.py'
      - '.github/workflows/v4-functional-exploration.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  v4-functional:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical tests
        run: python -m pip install 'numpy>=2.0,<3' 'pandas>=2.2,<4' pytest
      - name: Syntax and synthetic numerical invariants
        run: |
          python -m compileall -q analysis/v4
          python -m pytest -q tests/test_v4_functional_pilot.py
      - name: Download frozen v3 numerical inputs and verify SHA256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work/v4/inputs work/v4/output
          gh api "repos/zuizui0223/azami/actions/artifacts/9612943217/zip" > work/v4/traits-artifact.zip
          gh api "repos/zuizui0223/azami/actions/artifacts/9633419268/zip" > work/v4/environment-artifact.zip
          echo "101e996b638996a0c5ae79d358bf51293c3585f0e84c4a961b91dcbedf96211e  work/v4/traits-artifact.zip" | sha256sum -c -
          echo "d7c0c466f55b67695d06ae46c21a6452dbe6cfd92a52db8042caa200429e97f4  work/v4/environment-artifact.zip" | sha256sum -c -
          unzip -p work/v4/traits-artifact.zip universe/continuous_trait_universe_observation_long.csv > work/v4/inputs/traits.csv
          unzip -p work/v4/environment-artifact.zip process_environment/strict_spatial_chelsa_process.csv > work/v4/inputs/environment.csv
      - name: Recompute v4 pilot from frozen numerical sources
        run: |
          python analysis/v4/functional_pilot.py \
            --traits work/v4/inputs/traits.csv \
            --environment work/v4/inputs/environment.csv \
            --out-dir work/v4/output \
            > work/v4/output/stdout.json
      - name: Validate exploratory output denominators and invariants
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          p=Path('work/v4/output/result.json')
          a=json.loads(p.read_text())
          assert a['analysis_scope']=='retrospective_exploratory_not_confirmatory'
          assert a['source_env_obs']==46276 and a['source_taxa']==259
          assert a['complete_observations']==1777 and a['complete_taxa']==42
          assert a['top_taxa_counts']['Cirsium vulgare']==13207
          assert a['top_taxa_counts']['Cirsium arvense']==11795
          assert abs(a['top2_fraction'] - 25002/46276)<1e-12
          for key,mod in a['environment_blocks'].items():
              for name,values in mod.items():
                  r2=values['full_r2']-values['baseline_r2']
                  assert math.isclose(sum(values['block_shapley_r2'].values()),r2,abs_tol=1e-8)
                  assert 0<=values['baseline_r2']<=values['full_r2']<=1
          assert a['influence_among_chroma_radiation']['all']['n_taxa']==143
          assert abs(a['influence_among_chroma_radiation']['all']['beta_standardized']+0.3453720171)<1e-8
          assert abs(a['influence_among_chroma_radiation']['exclude_top2']['beta_standardized']+0.350163)<1e-5
          assert set(a['environment_blocks'])=={'among','among_spatial_latlon','within_equal_taxon_weight'}
          assert len(a['cross_scale_module_integration'])==3
          print('PASS v4 pilot contract and real-input replay',p)
          PY
      - name: Upload aggregate v4 diagnostic receipt only
        uses: actions/upload-artifact@v4
        with:
          name: v4-functional-exploratory-aggregate
          path: work/v4/output/result.json
          retention-days: 30
  observation-models:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numerical environment
        run: python -m pip install -r reproducibility/requirements-current.txt 'cryptography>=46,<49' pytest
      - name: Verify observation-level REML and joint score invariants
        run: python -m pytest -q tests/test_v4_observation_models.py tests/test_v4_measurement_coverage_audit.py
      - name: Restore verified observation input
        env:
          AZAMI_METADATA_KEY: ${{ secrets.AZAMI_METADATA_KEY }}
        run: |
          set -euo pipefail
          mkdir -p work/v4-observation/private work/v4-observation/receipt work/v4-observation/output
          gh run download 39408603488 --repo zuizui0223/azami --name v4-native-observation-input-encrypted --dir work/v4-observation/private
          gh run download 39408603488 --repo zuizui0223/azami --name v4-all665115-native-climate-aggregate --dir work/v4-observation/receipt
          python - <<'PY'
          import os, json, hashlib
          from pathlib import Path
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          root=Path('work/v4-observation')
          raw=(root/'receipt/measurement_receipt.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='246a5ea9643617c6dc766e0b8d27a444a5496afe150d7768032740cf6a53f0a6'
          receipt=json.loads(raw)
          sealed=(root/'private/native-observation-measurements.csv.gz.aesgcm').read_bytes()
          assert hashlib.sha256(sealed).hexdigest()==receipt['encrypted_table_sha256']
          try:
              data=AESGCM(bytes.fromhex(os.environ['AZAMI_METADATA_KEY'])).decrypt(
                  sealed[:12],sealed[12:],receipt['encrypted_table_aad'].encode())
          except Exception:
              raise SystemExit('Private observation input authentication failed.') from None
          assert hashlib.sha256(data).hexdigest()==receipt['prepared_table_sha256']
          (root/'private/observations.csv.gz').write_bytes(data)
          PY
      - name: Audit inherited measurement selection and failure before inference
        run: |
          python -m analysis.v4.measurement_coverage_audit \
            --table work/v4-observation/private/observations.csv.gz \
            --work work/v4-observation/zenodo \
            --output work/v4-observation/output/measurement_coverage_audit.json
      - name: Fit three modules with common climate predictors at both scales
        run: |
          python -m analysis.v4.observation_models \
            --table work/v4-observation/private/observations.csv.gz \
            --receipt work/v4-observation/receipt/measurement_receipt.json \
            --output work/v4-observation/output
      - name: Verify full model grid and actual observation counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('work/v4-observation/output/results.json').read_text())
          assert a['primary_status']=='estimated'
          assert len(a['models'])==9
          assert all(m['status']=='estimated' for m in a['models'].values())
          assert len(a['attribution_sensitivity'])==6
          assert all(m['status']=='estimated' for m in a['attribution_sensitivity'].values())
          assert a['models']['colour/drop0']['components']['corolla_lab_lightness']['n']==186439
          assert a['models']['colour/drop0']['components']['corolla_hue_sin']['n']==186390
          assert a['models']['orientation/drop0']['components']['orientation_image_vertical_angle']['n']==170066
          assert a['models']['bract_projection/drop0']['components']['bract_spread_fraction']['n']==1303
          print('PASS observation-level model grid; no cross-trait complete-case filter')
          PY
      - name: Save aggregate model results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-observation-model-results
          path: work/v4-observation/output/
          retention-days: 90
          if-no-files-found: warn
