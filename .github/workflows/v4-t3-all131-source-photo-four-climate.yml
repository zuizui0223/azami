name: V4 T3 all131 source-verified external photo sites four S1 S2 climates
on:
  workflow_dispatch:
  push:
    branches: [codex/v4-native-integration-workflow]
    paths:
      - 'analysis/v4/t3_real_131_photo_fourclimate_s1s2_extension.py'
      - 'tests/test_v4_t3_real_131_photo_fourclimate_s1s2_extension.py'
      - '.github/workflows/v4-t3-all131-source-photo-four-climate.yml'
permissions:
  contents: read
  actions: read
jobs:
  real-other-tribe-131-source-climate-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: .
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authenticated public raster and source-phylogeny dependencies
        run: |
          python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'pandas>=2.1,<3' \
            'rasterio>=1.4,<2' 'requests>=2.32,<3' 'pytest>=8,<10'
      - name: Test original GenBank taxon source, four original S1/S2 climates, no invented S1-angle
        run: |
          python -m pytest -q tests/test_v4_t3_real_131_photo_fourclimate_s1s2_extension.py \
            tests/test_v4_t3_s1_continuous_external_photo_source_pilot.py
      - name: Restore 131 exact-original GenBank nuclear ITS published source roster
        run: |
          set -euo pipefail
          mkdir -p work/t3/source work/t3/rasters work/t3/rsds/chelsa_rsds_mean work/t3/results work/t3/private
          test "$(gh api repos/zuizui0223/azami/actions/artifacts/12504855926 --jq '.digest')" = \
            'sha256:64419785872135e4232eae8f96d6976f22da958300764209619951223fd9a55e'
          gh run download 39960458391 --repo zuizui0223/azami \
            --name t3-published2025-163-source-genbank-ITS-ETS-154names-exact-original \
            --dir work/t3/source
          test -s work/t3/source/T3_2025_NUCLEAR_rDNA_SOURCE_ACCESSION_TAXON_MAPPING.csv
      - name: Recover EXACT previously authenticated four-source S1 S2 climate rasters
        run: |
          python -m analysis.v4.s1_s2_real_bio18_bio05_rsds_elevation \
            --stage download --source-root work/t3/rasters
          echo '90078d99eeb0b08dd1a115a5ffa60b7c19e5849686854db950283cbac9d3817d  work/t3/rasters/CHELSA_bio05_1981-2010_V.2.1.tif' | sha256sum -c -
          echo '68b0b1cb905cdf6972364e947e137f714a68d287f38863b1516161a2a4bbd7ec  work/t3/rasters/CHELSA_bio18_1981-2010_V.2.1.tif' | sha256sum -c -
          echo '8b9ac1eddbb1e51ea4aa860f637a5ec30096e1668a85303febe0d91abf901017  work/t3/rasters/wc2.1_30s_elev.zip' | sha256sum -c -
          echo '1d57ce9fd3584cea6a227396bc75ef88522fd5346e8487c17370885c0499716e  work/t3/rasters/wc2.1_30s_elev.tif' | sha256sum -c -
          gh api repos/zuizui0223/azami/actions/artifacts/12242917323/zip \
            > work/t3/private/rsds-cache.zip
          echo '2193bd04b979f6684f7bce7c670074af63072d270a20c4dc2fd0bd5934862df4  work/t3/private/rsds-cache.zip' | sha256sum -c -
          unzip -q work/t3/private/rsds-cache.zip -d work/t3/rsds/chelsa_rsds_mean
      - name: Audit all 131 authentic ITS biological species GBIF still-photo availability then physical BIO18 BIO05 RSDS DEM at sites
        run: |
          python -m analysis.v4.t3_real_131_photo_fourclimate_s1s2_extension \
            --ITS-roster work/t3/source/T3_2025_NUCLEAR_rDNA_SOURCE_ACCESSION_TAXON_MAPPING.csv \
            --source-root work/t3/rasters \
            --rsds-cache-root work/t3/rsds \
            --rsds-metadata analysis/v4/environment_source_metadata.json \
            --outdir work/t3/results
          git rev-parse HEAD > work/t3/results/AUTHENTIC_T3_SOURCE_CODE_COMMIT.txt
      - name: Validate exactly all 131 source taxa and ecology-climate alignment without pretending T3 angle exists
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("work/t3/results")
          d=json.loads((root/"T3_OTHER_TRIBE_131_TRUE_DNA_TAXA_PUBLIC_IMAGES_FOUR_CLIMATES.json").read_text())
          assert d["original_genbank_ITS_biological_taxa"]==131
          assert len(d["by_species"])==131
          assert set(d["four_axes_exactly_S1_S2"])=={"chelsa_bio18","chelsa_bio05","chelsa_rsds_mean","elevation_m"}
          assert d["n_georeferenced_photo_records_before_all4_climate"]>=50
          assert d["n_records_4_environment_complete"]>0
          assert d["n_species_4_environment_complete"]>0
          assert d["original_131_taxon_selection_not_based_on_photography_or_environment_or_U_D"]
          assert d["n_actual_qualified_T3_S1_equivalent_continuous_head_angle_measurements"]==0
          assert d["no_cross_tribe_angle_environment_effect_fitted"]
          assert d["original_ITS_ETS_one_linked_rDNA_gene_tree_not_independent_multilocus_species_tree"]
          assert d["sampling_observation_lat_lon_and_image_bytes_never_exported"]
          assert d["validity"]=="SOURCE_AND_NICHE_FEASIBILITY_ONLY"
          import csv
          with (root/"T3_SOURCE_PUBLIC_PHOTO_REFERENCE_LICENSES.csv").open() as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==d["n_georeferenced_photo_records_before_all4_climate"]
          assert not {"_latitude","_longitude","decimalLatitude","decimalLongitude","user_id"}.intersection(rows[0])
          assert all(x["not_a_measured_S1_head_angle"]=="True" for x in rows)
          print("VERIFIED_T3_ACTUAL_OTHER_TRIBE_SOURCE_PHOTOS_FOUR_ENVIRONMENTS_NO_FABRICATED_ANGLE")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-t3-all131-real-other-tribe-public-photo-four-original-climates
          path: work/t3/results/
          retention-days: 90
          if-no-files-found: warn
