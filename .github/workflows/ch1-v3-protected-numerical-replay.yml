name: Chapter 1 v3 protected numerical replay

on:
  push:
    branches: [revision/ch1-v3-20260907]
    paths:
      - analysis/v3/protected_numerical_replay_contract.json
  workflow_dispatch:

concurrency:
  group: ch1-v3-protected-replay-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # Download/upload assets on the existing UNPUBLISHED draft only.

jobs:
  replay:
    if: github.repository == 'zuizui0223/azami' && github.ref == 'refs/heads/revision/ch1-v3-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical transport dependencies
        run: python -m pip install numpy==2.2.6 pandas==2.3.3 shapely==2.1.2 requests==2.32.5 pytest==9.1.1
      - name: Test protected transport and original source linkage
        run: python -m pytest -q tests/test_v3_protected_artifacts.py tests/test_v3_private_replay.py tests/test_v3_reconciled_photo_schedule.py
      - name: Restore exact numerical source and verify protected output roundtrip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m analysis.v3.protected_artifacts cloud-replay \
            --contract analysis/v3/protected_numerical_replay_contract.json \
            --out "$RUNNER_TEMP/v3-protected-replay"
      - name: Publish receipt only, never source identifiers or numerical payload
        run: |
          mkdir -p publish
          cp "$RUNNER_TEMP/v3-protected-replay/public_report.json" publish/
      - uses: actions/upload-artifact@v4
        with:
          name: ch1-v3-protected-replay-${{ github.run_id }}
          path: publish/public_report.json
          if-no-files-found: error
          retention-days: 30
      # No source-image retrieval, release publication or explicit source cleanup.
      # Private numerical inputs/outputs remain in the verified unpublished draft.
