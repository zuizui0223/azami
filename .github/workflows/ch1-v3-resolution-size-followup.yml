name: Chapter 1 v3 large-original resolution followup

on:
  # Completed historical qualification: dependency edits must not refetch images.
  workflow_dispatch:

concurrency:
  group: ch1-v3-large-original-resolution-followup-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  followup:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned CPU image environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0+cpu torchvision==0.26.0+cpu
          python -m pip install -r reproducibility/v3-image-cpu-requirements.txt
          python -m pip install -e . --no-deps

      - name: Run deterministic followup tests
        run: python -m pytest -q tests/test_v3_resolution_size_followup.py tests/test_v3_resolution_stream_gate.py

      - name: Recover immutable metadata and detector package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p source
          python - <<'PY'
          from pathlib import Path
          from analysis.v3.recover_revision_inputs import download
          download(8066010557, Path('source/metadata.zip'), '2f216652602a0b3c42b64780d9b31a3ecb2e7fc1300b28b303e8c369b31884ae')
          download(8076736948, Path('source/detector.zip'), '2bc7cc49c2f213d4a5c5dab96e42fcdda7ceda23ffc3130520a5dd44b8c76c05')
          PY
          python - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          with zipfile.ZipFile('source/metadata.zip') as z:
              data=z.read('photo_metadata_merged.csv')
              assert hashlib.sha256(data).hexdigest()=='506917aef9a9452dddcf373acfb941e9f3620ba9740ef588cbcf8725557828e4'
              Path('source/photo_metadata_merged.csv').write_bytes(data)
          with zipfile.ZipFile('source/detector.zip') as z:
              data=z.read('recovery/model/weights/best.pt')
              assert hashlib.sha256(data).hexdigest()=='4078e0510532852681b65ee529cd82237b649ec99b17c4ca5f1da460a62d2bed'
              Path('source/best.pt').write_bytes(data)
          PY

      - name: Execute deterministic 128-photo large-original stream followup
        run: |
          python -m analysis.v3.resolution_size_followup \
            --metadata source/photo_metadata_merged.csv \
            --weights source/best.pt \
            --out-dir followup_output \
            --photos 128 \
            --min-iou 0.50

      - name: Enforce no source-image or source-identifier retention
        run: |
          test "$(find followup_output -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) | wc -l)" -eq 0
          python - <<'PY'
          import json
          r=json.load(open('followup_output/resolution_followup_report.json'))
          assert r['photos_requested']==128 and r['photos_selected']==128
          assert r['source_images_persisted']==0
          assert r['full_original_archive_required_by_design'] is False
          assert r['ecological_models_executed'] is False
          print({'successful_pairs':r['successful_pairs'],
                 'matched_head_pairs':r['matched_head_pairs'],
                 'status_counts':r['endpoint_status_counts'],
                 'bytes_transferred_total':r['bytes_transferred_total']})
          PY
          rm -f followup_output/pilot_manifest_private.csv
          test ! -e followup_output/pilot_manifest_private.csv
          rm -rf source

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ch1-v3-large-original-resolution-followup-${{ github.run_id }}
          path: followup_output
          if-no-files-found: error
          retention-days: 30
