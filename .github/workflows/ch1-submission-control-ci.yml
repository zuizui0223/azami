name: Ch1 submission control CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submission-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile submission-facing Python
        run: python -m compileall -q analysis src
      - name: Check active submission paths
        run: python analysis/ch1/run_submission.py check
      - name: Validate frozen claim registry
        run: python analysis/ch1/run_submission.py claims
      - name: Print current submission status
        run: python analysis/ch1/run_submission.py summary
