name: V4 T3 S1 original angle measurement blind 23 taxa 115 QC packet
on:
  workflow_dispatch:
  push:
    branches: [codex/v4-native-integration-workflow]
    paths:
      - 'analysis/v4/t3_blind_s1_orientation_qc_source_packet.py'
      - 'tests/test_v4_t3_blind_s1_orientation_qc_source_packet.py'
      - '.github/workflows/v4-t3-blind-115-s1-original-angle-qc-packet.yml'
permissions:
  contents: read
  actions: read
jobs:
  original-other-tribe-blind-licensed-QC-packet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify true 131 source taxon and 23 source photo manual-QC gates
        run: |
          python -m pip install 'pytest>=8,<10'
          python -m pytest -q tests/test_v4_t3_blind_s1_orientation_qc_source_packet.py
      - name: Recover verified independent source real four climate and geolocated 131-tip photo counts
        run: |
          mkdir -p work/T3/source work/T3/out
          test "$(gh api repos/zuizui0223/azami/actions/artifacts/12549069699 --jq '.digest')" = \
            'sha256:ea1d3039f23f4a8c610e94480e0ae32af44604b9ba62c9ca523e7acd786a34dc'
          gh run download 40066319064 --repo zuizui0223/azami \
            --name v4-t3-all131-real-other-tribe-public-photo-four-original-climates \
            --dir work/T3/source
          echo 'ffb90a009b031522480f3b5618db2c7ad70050b993e6eee70f0a428e05cd20d2  work/T3/source/T3_OTHER_TRIBE_131_TRUE_DNA_TAXA_PUBLIC_IMAGES_FOUR_CLIMATES.json' | sha256sum -c -
      - name: Assemble reproducible original S1 continuous orientation transfer QC photo references only
        run: |
          python -m analysis.v4.t3_blind_s1_orientation_qc_source_packet \
            --source-json work/T3/source/T3_OTHER_TRIBE_131_TRUE_DNA_TAXA_PUBLIC_IMAGES_FOUR_CLIMATES.json \
            --source-photo-csv work/T3/source/T3_SOURCE_PUBLIC_PHOTO_REFERENCE_LICENSES.csv \
            --out work/T3/out
          git rev-parse HEAD > work/T3/out/SOURCE_CODE_COMMIT.txt
      - name: Stop fake S1 angles and check all proposed source image hyperlinks retained with licenses
        run: |
          python - <<'PY'
          import json,csv
          from pathlib import Path
          root=Path("work/T3/out")
          cfg=json.loads((root/"T3_BLIND_ORIENTATION_ANGLE_QC_REQUIREMENTS.json").read_text())
          with (root/"T3_OTHER_TRIBE_23_SPECIES_115_BLIND_S1_ANGLE_QC_QUEUE.csv").open() as f:
              rows=list(csv.DictReader(f))
          assert cfg["n_QC_eligible_independent_source_taxa"]==23
          assert cfg["n_selected_original_GBIF_image_references"]==115
          assert cfg["n_image_angle_measurements_in_packet"]==0
          assert cfg["source_lat_lon_and_climate_values_NOT_in_annotation_packet"]
          assert cfg["manually_review_before_accepting_numeric_angle"]
          assert len(rows)==115 and len({r["DNA_tip_original_source_taxon"] for r in rows})==23
          assert all(r["original_S1_image_vertical_0_to_180_angle_degrees"]=="" for r in rows)
          assert all(r["source_public_image_url"].startswith("https://") and r["source_license_url"] for r in rows)
          assert not {"latitude","longitude","elevation_m","chelsa_bio18"}.intersection(rows[0])
          print("PASS_115_REAL_EXTERNAL_GENBANK_TAXON_LICENSED_SOURCE_IMAGE_QC_NO_FABRICATED_S1_ANGLE")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-t3-blind-23-ITS-source-taxa-115-photo-S1-angle-QC-packet
          path: work/T3/out/
          retention-days: 90
          if-no-files-found: warn
