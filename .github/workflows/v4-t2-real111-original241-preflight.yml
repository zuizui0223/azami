name: V4 T2 real 111 taxa author241 >=80pct single-reference nuclear preflight
on:
  push:
    branches: [codex/v4-native-integration-workflow]
    paths:
      - 'analysis/v4/t2_real111_original241_phylo_preflight.py'
      - 'tests/test_v4_t2_real111_original241_phylo_preflight.py'
      - '.github/workflows/v4-t2-real111-original241-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real111-sample-and-original-locus-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source cohorts, strict modal reference and two botanical nodding source names
        run: |
          python -m pip install 'pytest>=8,<10'
          python -m pytest -q tests/test_v4_t2_real111_original241_phylo_preflight.py
      - name: Restore REAL original 111 source samples and 241 author locus occupancies
        run: |
          set -euo pipefail
          mkdir -p work/input work/out
          test "$(gh api repos/zuizui0223/azami/actions/artifacts/12472932541 --jq '.digest')" = 'sha256:90667c75234ba14e8e5f5378defc9bfc54fb3cecf9f51e59b74b2651b6d384fb'
          gh run download 39885604460 --repo zuizui0223/azami \
            --name t2-real120k-all111-original241-shared-locus-occupancy \
            --dir work/input
          test -s work/input/T2_ALL113_SOURCE_TAXA_REAL120K_BEST_SINGLE_RUN.csv
          test -s work/input/T2_AUTHOR241_SHARED_Q20_120K_ACROSS111_TAXA.csv
      - name: Run empirically predeclared original-reference-copy 80pct species gate
        run: |
          python -m analysis.v4.t2_real111_original241_phylo_preflight \
            --taxa work/input/T2_ALL113_SOURCE_TAXA_REAL120K_BEST_SINGLE_RUN.csv \
            --loci work/input/T2_AUTHOR241_SHARED_Q20_120K_ACROSS111_TAXA.csv \
            --outdir work/out
      - name: Require same source taxa and realistic nucleotides-not-yet-recovered claim
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path('work/out')
          r=json.loads((p/'S1_111_REAL_ORIGINAL241_GLOBAL_PHYLO_PREFLIGHT.json').read_text())
          def n(file):
              with (p/file).open() as f:
                  return sum(1 for _ in csv.DictReader(f))
          assert n('S1_111_REAL120K_SAMPLE_SOURCE_RUNS.csv')==111
          assert n('S1_TWO_SHORT_SOURCE_TAXA_NOT_GENETIC_ABSENCE.csv')==2
          assert n('AUTHOR241_S1_111_SOURCE_COMMON_REFERENCE_ML_TARGETS.csv')==118
          assert r['source_taxon_number_for_gate']==89
          assert r['candidate_80pct_original_reference_loci']==118
          assert r['technical_ML_source_locus_gate_passed']
          assert r['source_botanical_nodding_author_names_present']==['Cirsium conspicuum','Cirsium scopulorum']
          assert r['original_S1_accepted_taxa_master']==244
          assert r['original_S1_named_taxa_master']==251
          assert r['same_original_reference_not_single_copy_orthology']
          assert r['no_nuclear_species_tree']
          print('PASS 111 real taxa, two missing short runs, original 118 shared-copy candidate loci, zero invented sequences')
          PY
      - name: Archive only source accession identities and 118 independently preregistered reference loci
        uses: actions/upload-artifact@v4
        with:
          name: v4-t2-real111-original118-shared-copy-preflight
          path: work/out
          if-no-files-found: error
          retention-days: 90
