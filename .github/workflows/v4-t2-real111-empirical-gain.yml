name: V4 T2 real all111 taxa same-run 30k120k 241 nuclear copy occupancy
on:
  push:
    branches: [codex/v4-native-integration-workflow]
    paths:
      - 'analysis/v4/t2_real111_taxa_same_ref_30k120k_depth_gain.py'
      - 'tests/test_v4_t2_real111_taxa_same_ref_30k120k_depth_gain.py'
      - '.github/workflows/v4-t2-real111-empirical-gain.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original111-molecular-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source identity and matched-sample statistics code
        run: |
          python -m pip install 'pytest>=8,<10'
          python -m pytest -q tests/test_v4_t2_real111_taxa_same_ref_30k120k_depth_gain.py
      - name: Require original all123 120k per-locus Q20 source workflow to succeed
        run: |
          set -euo pipefail
          gh run watch 39885604460 --repo zuizui0223/azami --exit-status --interval 10
          test "$(gh api repos/zuizui0223/azami/actions/runs/39885604460 --jq '.conclusion')" = "success"
      - name: Recover authenticated all125 30k original and 120k original241 depth matrices
        run: |
          set -euo pipefail
          mkdir -p work/111/old work/111/new work/111/source work/111/out
          test "$(gh api repos/zuizui0223/azami/actions/artifacts/12428430410 --jq '.digest')" = 'sha256:16ef207ec02ee24ea3d214a9935ddc0d21e70003573935ffdf1132aa9bacc5a1'
          gh run download 39783655030 --repo zuizui0223/azami --pattern 't2-real241-shard-*' --dir work/111/old
          gh run download 39885604460 --repo zuizui0223/azami --pattern 't2-real120k-125-perlocus-shard-*' --dir work/111/new
          gh run download 39885604460 --repo zuizui0223/azami --name t2-real120k-125-source241-identities --dir work/111/source
          echo "1142600fd5d7a1cfd2bd7a359c35bb249fda552ebf973ef545a36ad3a25ec7bc  work/111/source/S1_MOREYRA_PUBLIC_SRA_RUN_LINKS.csv" | sha256sum -c -
          test "$(find work/111/old -name 'shard_*.json' | wc -l)" -eq 10
          test "$(find work/111/new -name 'shard_*.json' | wc -l)" -eq 10
      - name: Same accepted taxon and same real SRA run 30k vs 120k common-copy occupancy
        run: |
          python -m analysis.v4.t2_real111_taxa_same_ref_30k120k_depth_gain \
            --source work/111/source/S1_MOREYRA_PUBLIC_SRA_RUN_LINKS.csv \
            --original30k-shards work/111/old \
            --real120k-shards work/111/new \
            --out-dir work/111/out
      - name: Reject omitted taxon, fake 294 species tree or missing 241 source loci
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path('work/111/out')
          src=json.loads((p/'111_TAXON_REAL_COMMON241_30K120K_SUMMARY.json').read_text())
          for name,n in [('111_SOURCE_TAXA_BIOSAMPLE_SELECTION.csv',111),
                         ('111_TAXA_X_241_REAL_SITE_DEPTH_COPY_MATRIX.csv',26751),
                         ('241_AUTHOR_LOCI_SAME_REF_OCCUPANCY_30K_120K.csv',241)]:
              with (p/name).open() as h:
                  rows=list(csv.DictReader(h))
              assert len(rows)==n
          assert src['source_original_S1_accepted_keys']==244
          assert src['source_original_S1_named_units']==251
          assert src['measured_same_original_run_120k_taxa']==111
          assert len(src['short_public_runs_not_genetically_absent'])==2
          assert src['real_111x241_taxon_locus_comparisons']==26751
          assert not src['phylogenetic_tree_fitted_from_this_matrix']
          assert src['occupation_same_reference_does_not_ensure_Cirsium_orthology']
          print('PASS ACTUAL public111 taxa x original241 nuclear loci same specimen depth30k/120k copy-aware occupancy')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t2-real111-241-same-original-reference-30k120k-occupancy
          path: work/111/out/
          retention-days: 90
          if-no-files-found: warn
