name: Build current Chapter 1 Zenodo data staging bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'reproducibility/build_current_release_bundle.py'
      - 'reproducibility/run_current_analysis.py'
      - 'reproducibility/zenodo_release_metadata.prepared.json'
      - '.github/workflows/build-current-zenodo-staging.yml'
  pull_request:
    paths:
      - 'reproducibility/build_current_release_bundle.py'
      - 'reproducibility/run_current_analysis.py'
      - 'reproducibility/zenodo_release_metadata.prepared.json'
      - 'tests/test_current_release_bundle.py'
      - '.github/workflows/build-current-zenodo-staging.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Initialize staging paths
        shell: bash
        run: |
          echo "INPUT_DIR=${RUNNER_TEMP}/azami-release-inputs" >> "$GITHUB_ENV"
          echo "OUT_DIR=${RUNNER_TEMP}/azami-zenodo-data-staging" >> "$GITHUB_ENV"

      - name: Fetch frozen numerical input archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$INPUT_DIR"
          fetch_artifact () {
            local id="$1"
            local role="$2"
            echo "Fetching artifact $id ($role)"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "$INPUT_DIR/artifact-${id}-${role}.zip"
          }
          fetch_artifact 9612943217 continuous
          fetch_artifact 9633419268 environment
          fetch_artifact 8983877726 spatial
          fetch_artifact 8227254443 historical
          # Used only to recover the exact native-status input; this full artifact
          # is NOT copied into the Zenodo data package.
          fetch_artifact 10292140117 taxonomy

      - name: Build data-only Zenodo staging bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          python -m reproducibility.build_current_release_bundle \
            --input-dir "$INPUT_DIR" \
            --expected-head "$GITHUB_SHA" \
            --out "$OUT_DIR/azami_ch1_v3_analysis_inputs.zip" \
            > "$OUT_DIR/build_receipt.json"
          cat "$OUT_DIR/build_receipt.json"
          cat "$OUT_DIR/azami_ch1_v3_analysis_inputs.zip.sha256"

      - name: Verify data-only boundary and contents
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          import os

          root=Path(os.environ['OUT_DIR'])
          receipt=json.loads((root/'build_receipt.json').read_text())
          assert receipt['release_ready'] is False
          assert set(receipt['release_gaps']) == {'release_metadata'}
          assert receipt['analysis_input_count'] == 5
          assert receipt['code_included'] is False
          assert receipt['manuscript_files_included'] is False
          assert receipt['figures_included'] is False
          assert receipt['reference_outputs_included'] is False

          z=zipfile.ZipFile(root/'azami_ch1_v3_analysis_inputs.zip')
          names=set(z.namelist())
          required={
              'inputs/artifact-9612943217-continuous.zip',
              'inputs/artifact-9633419268-environment.zip',
              'inputs/artifact-8983877726-spatial.zip',
              'inputs/artifact-8227254443-historical.zip',
              'inputs/observation_native_status.csv',
              'input_contract.json',
              'README.txt',
              'release_manifest.json',
              'checksums.json',
          }
          assert required <= names, sorted(required - names)

          forbidden_prefixes=('code/','reference/','replay/','figures/')
          assert not any(name.startswith(forbidden_prefixes) for name in names)
          forbidden_suffixes=('.doc','.docx','.odt','.rtf')
          assert not any(name.lower().endswith(forbidden_suffixes) for name in names)

          manifest=json.loads(z.read('release_manifest.json'))
          assert manifest['archive_role']=='durable_processed_analysis_inputs'
          assert manifest['analysis_input_count']==5
          assert manifest['github_code_commit']==os.environ['GITHUB_SHA']
          assert manifest['code_included'] is False
          assert manifest['manuscript_files_included'] is False
          assert manifest['figures_included'] is False
          assert manifest['reference_outputs_included'] is False
          assert manifest['replay_receipts_included'] is False
          assert set(manifest['release_gaps'])=={'release_metadata'}

          print(json.dumps({
              'status':'PASS',
              'release_gaps':manifest['release_gaps'],
              'analysis_input_count':manifest['analysis_input_count'],
              'code_included':manifest['code_included'],
              'github_code_commit':manifest['github_code_commit'],
          }, indent=2))
          PY

      - name: Upload Zenodo data staging bundle
        uses: actions/upload-artifact@v4
        with:
          name: ch1-v3-zenodo-analysis-inputs
          path: |
            ${{ runner.temp }}/azami-zenodo-data-staging/azami_ch1_v3_analysis_inputs.zip
            ${{ runner.temp }}/azami-zenodo-data-staging/azami_ch1_v3_analysis_inputs.zip.sha256
            ${{ runner.temp }}/azami-zenodo-data-staging/build_receipt.json
          if-no-files-found: error
          retention-days: 90
