[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "azami-analysis"
version = "0.1.0"
description = "Reproducibility code and frozen outputs for image-phenomics analyses"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "shapely>=2.1,<3",
  "statsmodels>=0.14",
  "requests>=2.31",
  "biopython>=1.83,<2",
  "opencv-python-headless>=4.8",
  "pillow>=10",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8"]
full = [
  "rasterio>=1.3,<2",
  "pyproj>=3.6,<4",
  "ultralytics>=8.3,<9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
