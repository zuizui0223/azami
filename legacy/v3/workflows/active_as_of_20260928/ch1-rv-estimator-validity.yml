name: Chapter 1 RV estimator validity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'analysis/v3/run_rv_estimator_validity.py'
      - 'analysis/ch1/RV_ESTIMATOR_VALIDITY_CONTRACT_20260915.json'
      - '.github/workflows/ch1-rv-estimator-validity.yml'

permissions:
  contents: read
  actions: read

jobs:
  estimator-validity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen current numerical environment
        run: python -m pip install -r reproducibility/requirements-current.txt

      - name: Recover exact frozen inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/rv-validity/input
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9612943217/zip > work/rv-validity/traits.zip
          echo '101e996b638996a0c5ae79d358bf51293c3585f0e84c4a961b91dcbedf96211e  work/rv-validity/traits.zip' | sha256sum -c -
          unzip -q work/rv-validity/traits.zip 'universe/continuous_trait_universe_observation_long.csv' -d work/rv-validity/input

          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9633419268/zip > work/rv-validity/environment.zip
          echo 'd7c0c466f55b67695d06ae46c21a6452dbe6cfd92a52db8042caa200429e97f4  work/rv-validity/environment.zip' | sha256sum -c -
          unzip -q work/rv-validity/environment.zip 'process_environment/strict_spatial_chelsa_process.csv' -d work/rv-validity/input

      - name: Run frozen estimator-validity sensitivity
        run: |
          python -m analysis.v3.run_rv_estimator_validity \
            --traits work/rv-validity/input/universe/continuous_trait_universe_observation_long.csv \
            --environment work/rv-validity/input/process_environment/strict_spatial_chelsa_process.csv \
            --out-dir work/rv-validity/result \
            --minimum-complete-observations-per-taxon 5 \
            --equal-n-replicates 1000 \
            --null-permutations 499 \
            --qap-permutations 9999 \
            --seed 20260915

      - name: Verify manuscript decision surface exists
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('work/rv-validity/result/rv_estimator_validity_summary.json')
          d = json.loads(p.read_text())
          assert d['common_cohort'] == {'observations': 1734, 'taxa': 42, 'constructs': 9, 'relations': 36}
          assert d['status'] == 'posthoc_estimator_validity_sensitivity'
          assert isinstance(d['manuscript_decision']['retain_stronger_overall_among_language'], bool)
          print(json.dumps(d['manuscript_decision'], indent=2))
          PY

      - name: Upload complete estimator-validity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch1-rv-estimator-validity
          path: work/rv-validity/
          if-no-files-found: error
